openapi: 3.1.0
info:
  title: Ansilume REST API
  version: "2.8.0"
  description: |
    REST API v1 for the Ansilume automation platform.

    Every feature of Ansilume is reachable via this API — the web UI is one
    client among many. When a feature changes, this document **must** be
    updated in the same commit (see `CLAUDE.md`).

    ## Authentication

    All endpoints under `/api/v1/` require a Bearer token except where noted.
    Create a token via the browser (*Profile → API Tokens*) or from the console:

    ```bash
    docker compose exec app php yii api-token/create admin "my-token" --raw
    ```

    Pass it as:

    ```
    Authorization: Bearer <token>
    ```

    ## Authorization

    Every endpoint requires a permission, the same one the matching page in
    the web UI requires (for example `credential.view` to list credentials).
    Without it the call returns `403 Forbidden` before anything happens.
    Superadmins pass every permission check. Tokens of disabled users are
    rejected with `401`.

    ## Team scope

    Projects can be assigned to teams, with viewer or operator access. For a
    caller who is not an admin, everything that belongs to a team-assigned
    project is limited to that project's teams: viewer access to read,
    operator access to change, launch, resume and cancel. Projects without a
    team stay open to everyone with the permission. Admins, superadmins and
    installations without team-assigned projects are not restricted.

    - Lists leave out what the caller may not see, and `meta.total` counts
      only the visible rows.
    - A single resource the caller may not see, or may not change, answers
      `403`; an unknown one `404`.
    - A `project_id` in a request body needs operator access to that project
      (`403` otherwise). Other references in a request body that the caller
      cannot see (the job template of a workflow step or a schedule, the
      inventory of a job template, the job templates of a vault assignment)
      are reported as not existing (`422`), like unknown or deleted ones.
      Visible job templates the caller may not operate answer `403`. Where a
      request lists job templates (workflow steps, vault assignments),
      `error.job_template_ids` names the offending IDs.
    - Workflow templates and their runs belong to the projects of their job
      steps: seeing them needs view access to the project of every job step,
      changing, launching, resuming or canceling them operator access to
      every one. Only job steps count: approval and pause steps do not
      restrict, so a workflow without job steps is open to everyone with the
      permission. A deleted job template keeps counting with its project; a
      step whose job template was purged with its project restricts the
      workflow to unrestricted callers. A refused launch, resume or cancel
      names job templates in `error.job_template_ids` only to callers who may
      see the workflow; others get a `403` without them.
    - An approval request follows its job's project; the request of a
      workflow approval step, like the placeholder job behind it, follows its
      workflow.
    - Analytics count only what the caller may see.
    - Triggers (`/trigger/...`) run as the user who generated the token and
      are refused once that user may no longer launch; see the Triggers
      endpoints.

    ## Errors

    Error responses have the shape `{ "error": { "message": "..." } }` and
    use conventional HTTP status codes (401, 403, 404, 409, 422). Some errors
    add fields next to `message`, such as `error.job_template_ids` or
    `error.used_by`. Others come from the framework instead, with the shape
    `{ "name": "Not Found", "message": "...", "code": 0, "status": 404 }`:
    `400` for a request body that is not valid JSON, `401` for a missing or
    invalid token, `404` for an unknown resource `{id}` in the path (a
    role's `{name}`), and `500` for an unexpected error. An unknown nested
    ID in the path (`artifact_id`, `userId`, `projectId`) answers `404` in
    the usual shape. The trigger endpoints, outside `/api/v1/`, answer
    `403` and `500` as `{ "error": "Launch refused." }` and
    `{ "error": "Launch failed." }`. Their `400` (missing token), `404`
    (unknown or revoked token, or another method than POST on
    `/trigger/{token}`) and `405` (another method than POST on
    `/trigger/fire` and `/trigger/fire-workflow`) are the web UI's HTML
    error page, without a JSON body.

servers:
  - url: http://localhost:8080
    description: Local dev (via nginx)
  - url: https://ansilume.example.com
    description: Production (replace with your deployment)

security:
  - bearerAuth: []

tags:
  - name: Projects
  - name: Inventories
  - name: Credentials
  - name: Job Templates
  - name: Jobs
  - name: Schedules
  - name: Runner Groups
  - name: Runners
  - name: Teams
  - name: Users
  - name: Webhooks
  - name: Audit Logs
  - name: Notification Templates
  - name: Approval Rules
  - name: Approvals
    description: |
      Approval requests of jobs whose template has an approval rule, and of
      workflow approval steps. Seeing a request needs view access to the
      job's project or, for a workflow approval step, to the workflow.
      Deciding also needs a place on the rule's approver list.
  - name: Workflow Templates
    description: |
      A workflow template has no project of its own: it belongs to the
      projects of its job steps. Seeing it needs view access to the project
      of every job step; changing, deleting and launching it need operator
      access to every one.
  - name: Workflow Jobs
    description: |
      Runs of workflow templates. They follow their workflow template, also
      after it was deleted. A run's job steps run as the user who launched
      the run; each is checked when it starts.
  - name: Analytics
    description: |
      Reports over jobs, workflows, approval requests and runners. They count
      only what the caller may see: jobs of job templates the caller may
      view, runs of workflows the caller may view, approval requests the
      caller may view. runner-activity lists every runner but counts only
      those jobs. A filter on a project or template the caller cannot see
      counts nothing. Each filter takes a single value. An ID that is not a
      whole number, a date not in `YYYY-MM-DD` form, a granularity other
      than `daily` or `weekly`, or a `date_to` before `date_from` or more
      than 365 days after it answers 422.
  - name: Triggers
    description: |
      Inbound triggers. The token is the only authentication. A trigger runs
      as the user who generated its token and is refused while that user may
      not launch the template.
  - name: Roles
  - name: Profile
  - name: LDAP
  - name: System

# Shared query parameter list used by every analytics endpoint.
# Defined once via a YAML anchor and referenced with `*` so we don't
# repeat eight parameters ten times.
x-analytics-filters: &analyticsFilters
  - { in: query, name: date_from, required: false, schema: { type: string, format: date }, description: "Inclusive start date (YYYY-MM-DD). Defaults to 30 days ago." }
  - { in: query, name: date_to, required: false, schema: { type: string, format: date }, description: "Inclusive end date (YYYY-MM-DD). Defaults to today. Not before date_from and at most 365 days after it (422 otherwise)." }
  - { in: query, name: project_id, required: false, schema: { type: integer, minimum: 1 } }
  - { in: query, name: template_id, required: false, schema: { type: integer, minimum: 1 } }
  - { in: query, name: user_id, required: false, schema: { type: integer, minimum: 1 } }
  - { in: query, name: runner_group_id, required: false, schema: { type: integer, minimum: 1 } }
  - { in: query, name: granularity, required: false, schema: { type: string, enum: [daily, weekly], default: daily } }
  - { in: query, name: format, required: false, schema: { type: string, enum: [json, csv], default: json }, description: "csv also needs analytics.export (403 otherwise)." }

paths:
  # ─────────────────────────────── Projects ───────────────────────────────
  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Projects]
      summary: Create a project
      description: Requires `project.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
            examples:
              git:
                summary: Git-backed project
                value:
                  name: my-playbooks
                  scm_type: git
                  scm_url: "https://github.com/example/playbooks.git"
                  scm_branch: main
              manual:
                summary: Manual project
                value:
                  name: local-playbooks
                  scm_type: manual
      responses:
        '201': { $ref: '#/components/responses/ProjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Projects]
      summary: Get a single project
      responses:
        '200': { $ref: '#/components/responses/ProjectResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Projects]
      summary: Update a project
      description: |
        Requires `project.update` and operator access. Changing
        `vault_password_source` is audited as `project.vault-source-changed`
        and re-checks the project's job templates against the last vault scan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200': { $ref: '#/components/responses/ProjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Projects]
      summary: Delete a project
      description: |
        Requires `project.delete`. Refuses with 422 while active job templates
        reference this project. Templates that were already deleted (soft-deleted,
        no longer listed) are purged together with the project.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/projects/{id}/vault:
    get:
      tags: [Projects]
      summary: Vault overview of a project
      description: |
        Requires `project.view` and view access to the project. The last scan
        of the checkout for ansible-vault content (encrypted files and inline
        `!vault` values, vault IDs, the vault settings of the repository's
        ansible.cfg, findings) and, per job template, whether its vault
        password opens the encrypted files it probably loads. Checked without
        decrypting; nothing in it is secret. Runner names, groups and versions
        need `runner-group.view` (otherwise only their number), the names of
        vault passwords `credential.view` or `job-template.view` (otherwise
        only their id).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/ProjectVaultResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{id}/vault/scan:
    post:
      tags: [Projects]
      summary: Rescan a project checkout for vault content
      description: |
        Requires `project.update` and operator access. Scans the checkout as
        it is now (it does not fetch: a git project's checkout changes only
        with a sync, and every sync scans it), re-checks every job template of
        the project and answers with the overview. Audited as
        `project.vault-scanned`. Without a checkout, `error` says so and the
        overview is empty. The checks of one rescan share a time budget of
        30 seconds; templates it does not finish get the status `incomplete`
        with the reason `time_limit` and go first next time.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/ProjectVaultResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{id}/sync:
    post:
      tags: [Projects]
      summary: Trigger a git sync for a project
      description: |
        Requires `project.update`. Only works for `scm_type=git` projects.
        Queues a background sync job.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Sync queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      syncing: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── Inventories ─────────────────────────────
  /api/v1/inventories:
    get:
      tags: [Inventories]
      summary: List inventories
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Inventories]
      summary: Create an inventory
      description: Requires `inventory.create` permission.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryInput' }
            examples:
              static:
                summary: Static YAML inventory
                value:
                  name: zabbix-hq
                  inventory_type: static
                  content: "---\nall:\n  hosts:\n    zabbix-hq:\n      ansible_host: 10.1.42.108\n"
      responses:
        '201': { $ref: '#/components/responses/InventoryResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/inventories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Inventories]
      summary: Get a single inventory
      responses:
        '200': { $ref: '#/components/responses/InventoryResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Inventories]
      summary: Update an inventory
      description: |
        Requires `inventory.update` and operator access to the inventory's
        project and, when `project_id` changes, to the new project (403
        otherwise). Changing the type or the project is rejected with 422 when
        job templates of another project would then use a file or dynamic
        inventory of this project.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryInput' }
      responses:
        '200': { $ref: '#/components/responses/InventoryResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Inventories]
      summary: Delete an inventory
      description: Requires `inventory.delete`.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Credentials ─────────────────────────────
  /api/v1/credentials:
    get:
      tags: [Credentials]
      summary: List credentials
      description: Secret material is never returned, not even redacted placeholders.
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Credentials]
      summary: Create a credential
      description: |
        Requires `credential.create`. The secret of the credential's type is
        required (see `CredentialInput.secrets`); without it the answer is 422,
        for example `Token is required for Token credentials.` For `ssh_key`
        type, provide the raw PEM private key in `secrets.private_key`; public
        key and algorithm are derived server-side via `ssh-keygen -y`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialInput' }
            examples:
              ssh:
                summary: SSH key credential
                value:
                  name: ssh
                  credential_type: ssh_key
                  username: root
                  secrets:
                    private_key: "-----BEGIN OPENSSH PRIVATE KEY-----\n...\n-----END OPENSSH PRIVATE KEY-----\n"
              password:
                summary: Username/password credential
                value:
                  name: db-root
                  credential_type: username_password
                  username: root
                  secrets:
                    password: "<password>"
              token:
                summary: Token credential exposed as an environment variable
                value:
                  name: deploy-token
                  credential_type: token
                  env_var_name: DEPLOY_TOKEN
                  secrets:
                    token: "<token>"
      responses:
        '201': { $ref: '#/components/responses/CredentialResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Credentials]
      summary: Get a single credential
      description: |
        Adds `secret_status` (whether the stored secret is usable) and
        `used_by` (job templates, projects and waiting jobs that use the
        credential). The lists only name what the caller may see; the hidden
        counts cover the rest.
      responses:
        '200': { $ref: '#/components/responses/CredentialDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Credentials]
      summary: Update a credential
      description: |
        Requires `credential.update`. Omitted fields keep their value. If
        `secrets` is omitted or its values are blank, the stored secret is
        kept; a submitted secret replaces it. Changing `credential_type`
        requires the new type's secret (422 otherwise), so no secret of the
        old type stays behind. Changing it to `vault` is rejected with 422
        while a job template using the credential already has another vault
        password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialInput' }
      responses:
        '200': { $ref: '#/components/responses/CredentialResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Credentials]
      summary: Delete a credential
      description: |
        Requires `credential.delete`. A credential that a job template, a
        project or a waiting job uses is not deleted: the answer is 409 with
        `error.used_by`. Pass `force=1` to delete it anyway. It is then
        detached from every job template and project, and waiting jobs that
        need it fail before they start.
      parameters:
        - name: force
          in: query
          required: false
          description: "`1` or `true` deletes a credential that is in use."
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CredentialInUse' }

  /api/v1/credentials/{id}/job-templates:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Credentials]
      summary: Job templates a vault password can be assigned to
      description: |
        Requires `job-template.update` and `credential.view`. Lists the job
        templates the caller may change, with their current vault passwords.
      responses:
        '200': { $ref: '#/components/responses/VaultAssignmentCandidatesResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Credentials]
      summary: Assign a vault password to several job templates
      description: |
        Requires `job-template.update` and `credential.view`. A template that
        has another vault password gets it replaced in the same position (a
        primary stays primary); any further vault password is detached, so
        each template ends up with exactly this one. Each changed template is
        audited as `job-template.updated`. Jobs that already wait keep the
        credentials they were launched with.

        Nothing is written when the request is invalid: 422 for a credential
        that is not a vault password or has no usable secret, a malformed or
        empty list, more than 500 IDs, or IDs of templates that do not exist
        or that the caller cannot see; 403 for templates the caller can see
        but not change. `error.job_template_ids` names the offending IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultAssignmentInput' }
            example:
              job_template_ids: [12, 15]
      responses:
        '200': { $ref: '#/components/responses/VaultAssignmentResponse' }
        '403': { $ref: '#/components/responses/VaultAssignmentRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/VaultAssignmentRejected' }

  # ─────────────────────────── Job Templates ───────────────────────────
  /api/v1/job-templates:
    get:
      tags: [Job Templates]
      summary: List job templates
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: warning
          in: query
          required: false
          description: Only templates with this warning, see JobTemplateWarning.
          schema: { type: string, enum: [multiple_vault_credentials, inventory_other_project, vault_password_mismatch, vault_password_missing, vault_file_damaged, vault_check_incomplete] }
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/JobTemplateList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Job Templates]
      summary: Create a job template
      description: |
        Requires `job-template.create` and operator access to the project
        (403 otherwise). Rejected with 422 when the credentials hold more than
        one vault password, when a file or dynamic inventory belongs to another
        project than the template, and when the project, inventory, runner
        group or approval rule does not exist. An inventory of a project the
        caller cannot see counts as not existing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobTemplateInput' }
            example:
              name: Deploy web servers
              project_id: 1
              inventory_id: 1
              playbook: site.yml
              runner_group_id: 1
              verbosity: 0
              forks: 5
      responses:
        '201': { $ref: '#/components/responses/JobTemplateResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/job-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Job Templates]
      summary: Get a single job template
      responses:
        '200': { $ref: '#/components/responses/JobTemplateResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Job Templates]
      summary: Update a job template
      description: |
        Requires `job-template.update` and operator access to the template's
        project and, when `project_id` changes, to the new project (403
        otherwise). Rejected with 422 while the template holds more than one
        vault password, also when the request leaves `credential_ids` out;
        send `credential_ids` with one vault password at most. Changing
        `project_id` or `inventory_id` to a file or dynamic inventory of
        another project is rejected too; older templates that already have one
        keep working and report the `inventory_other_project` warning. A new
        inventory must exist and belong to a project the caller can see, as on
        create.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobTemplateInput' }
      responses:
        '200': { $ref: '#/components/responses/JobTemplateResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Job Templates]
      summary: Delete a job template
      description: |
        Requires `job-template.delete`. A soft delete, like in the web UI: the
        template disappears from lists and can no longer be launched, while
        its jobs keep their link to it. Its trigger token is revoked.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────── Jobs ──────────────────────────────
  /api/v1/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      description: |
        Requires `job.view`. Lists only the jobs of job templates the caller
        may see (deleted templates count with their project). Jobs without a
        job template, such as the placeholder job of a workflow approval
        step, are listed only for unrestricted callers; fetch them by ID.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/JobList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Jobs]
      summary: Launch a job from a template
      description: |
        Requires `job.launch` and operator access to the template's project.
        The response lists the credentials the job will use and the
        template's warnings (e.g. a vault password that does not open the
        template's encrypted files); warnings never block a launch.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobLaunchInput' }
      responses:
        '201': { $ref: '#/components/responses/JobLaunchResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get a single job
      description: |
        Requires `job.view` and view access to the job (403 otherwise). A job
        follows the project of its job template. A job without a job template
        is not open to everyone: the placeholder job of a workflow approval
        step follows its workflow (view access to the project of every job
        step), and a job whose template was purged is visible only to
        unrestricted callers.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/JobDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/jobs/{id}/cancel:
    post:
      tags: [Jobs]
      summary: Cancel a running job
      description: |
        Requires `job.cancel` and operator access to the job, by the same rule
        as viewing it: the job template's project, or the workflow of a
        workflow approval placeholder. Access is checked before the job's
        state, so a caller without it gets 403 whatever the status; 409 only
        tells a caller with access that the job is already finished.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/JobDetailResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The job is already finished and cannot be canceled
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }

  /api/v1/jobs/{id}/artifacts:
    get:
      tags: [Jobs]
      summary: List artifacts for a job
      description: Requires `job.view` and view access to the job.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: List of artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/JobArtifact' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/jobs/{id}/artifacts/download-all:
    get:
      tags: [Jobs]
      summary: Download all artifacts as a zip archive
      description: Requires `job.view` and view access to the job.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Zip file download
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/jobs/{id}/artifacts/{artifact_id}/download:
    get:
      tags: [Jobs]
      summary: Download a single artifact
      description: |
        Requires `job.view` and view access to the job. By default the
        response uses `Content-Disposition: attachment` so the browser saves
        the file.

        Pass `?inline=1` to receive `Content-Disposition: inline`. This is
        honoured for two MIME categories:
        - Image types (`image/png`, `image/jpeg`, `image/gif`, `image/webp`)
          — rendered as `<img>` in the UI.
        - PDF (`application/pdf`) — served with a hardened
          `Content-Security-Policy: ... sandbox;` header so the document can
          be embedded in a sandboxed `<iframe>` without script execution.

        Non-image / non-PDF artifacts ignore the parameter and continue to
        download.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - name: artifact_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: inline
          in: query
          required: false
          description: Set to `1` to render images inline (ignored for non-image MIME types).
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/jobs/{id}/artifacts/{artifact_id}/content:
    get:
      tags: [Jobs]
      summary: Get artifact content inline (text-based files only)
      description: Requires `job.view` and view access to the job. Returns 415 for non-previewable MIME types.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - name: artifact_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Inline artifact content
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:           { type: integer }
                      display_name: { type: string }
                      mime_type:    { type: string }
                      content:      { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415':
          description: Artifact type is not previewable

  # ─────────────────────────── Schedules ───────────────────────────
  /api/v1/schedules:
    get:
      tags: [Schedules]
      summary: List schedules
      description: |
        Requires `job.launch`. Lists only the schedules of job templates the
        caller may see.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Schedules]
      summary: Create a schedule
      description: |
        Requires `job.launch`. `job_template_id` must be a job template the
        caller may operate: one the caller sees but may not operate answers
        403, one that is unknown, deleted or in a project the caller cannot
        see answers 422 `The selected job template does not exist.` A body
        without `name`, `job_template_id` or `cron_expression` answers 422.

        The caller becomes the schedule's creator, returned as `created_by`;
        `created_by` in the body is ignored. Scheduled jobs run as the
        creator, and only while the creator is active, holds `job.launch` and
        may operate the job template's project. Otherwise the schedule does
        not launch when it is due: the refusal is audited as
        `schedule.launch.denied` and the `schedule.failed_to_launch`
        notification is sent. This holds on installations without teams too.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
            example:
              name: Nightly deploy
              job_template_id: 1
              cron_expression: "0 2 * * *"
              timezone: UTC
              enabled: true
      responses:
        '201': { $ref: '#/components/responses/ScheduleResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/schedules/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Schedules]
      summary: Get a single schedule
      description: Requires `job.launch` and view access to the project of the schedule's job template.
      responses:
        '200': { $ref: '#/components/responses/ScheduleResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Schedules]
      summary: Update a schedule
      description: |
        Requires `job.launch` and operator access to the project of the
        schedule's job template (403 otherwise). A new `job_template_id`
        follows the rules of create: 403 for a template the caller sees but
        may not operate, 422 `The selected job template does not exist.` for
        an unknown, deleted or invisible one. The schedule keeps its creator
        (`created_by`), whom its jobs run as; `created_by` in the body is
        ignored. Every update stores a fresh `next_run_at`, the next time the
        cron expression matches.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200': { $ref: '#/components/responses/ScheduleResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Schedules]
      summary: Delete a schedule
      description: Requires `job.launch` and operator access to the project of the schedule's job template.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/schedules/{id}/toggle:
    post:
      tags: [Schedules]
      summary: Toggle a schedule between enabled and disabled
      description: Requires `job.launch` and operator access to the project of the schedule's job template.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/ScheduleResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ─────────────────────── Runner Groups ───────────────────────
  /api/v1/runner-groups:
    get:
      tags: [Runner Groups]
      summary: List runner groups
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/RunnerGroupList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Runner Groups]
      summary: Create a runner group
      description: Requires `runner-group.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerGroupInput' }
            example:
              name: production-runners
              description: Runners in the production datacenter
      responses:
        '201': { $ref: '#/components/responses/RunnerGroupResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/runner-groups/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Runner Groups]
      summary: Get a single runner group
      responses:
        '200': { $ref: '#/components/responses/RunnerGroupResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Runner Groups]
      summary: Update a runner group
      description: Requires `runner-group.update`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerGroupInput' }
      responses:
        '200': { $ref: '#/components/responses/RunnerGroupResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Runner Groups]
      summary: Delete a runner group
      description: |
        Requires `runner-group.delete`. Refuses if runners or job templates
        still reference this group.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ────────────────────────────── Runners ────────────────────────────
  /api/v1/runners:
    get:
      tags: [Runners]
      summary: List runners
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - name: group_id
          in: query
          schema: { type: integer }
          description: Filter by runner group ID
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/RunnerList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/runners/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Runners]
      summary: Get a single runner
      responses:
        '200': { $ref: '#/components/responses/RunnerResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Runners]
      summary: Delete a runner
      description: Requires `runner-group.update`.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runners/{id}/move:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [Runners]
      summary: Move runner to a different group
      description: |
        Requires `runner-group.update`. Refuses if the runner has active
        or pending jobs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerMoveInput' }
            example:
              target_group_id: 2
      responses:
        '200': { $ref: '#/components/responses/RunnerResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/runners/{id}/regenerate-token:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [Runners]
      summary: Regenerate runner token
      description: |
        Requires `runner-group.update`. Returns the new raw token (shown once).
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      runner: { $ref: '#/components/schemas/Runner' }
                      token: { type: string, description: Raw token (shown once) }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────── Teams ──────────────────────────────
  /api/v1/teams:
    get:
      tags: [Teams]
      summary: List teams
      description: Requires `admin` role.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/TeamList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Teams]
      summary: Create a team
      description: Requires `admin` role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
            example:
              name: platform-team
              description: Infrastructure automation team
      responses:
        '201': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/teams/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Teams]
      summary: Get a team with members and projects
      description: Requires `admin` role.
      responses:
        '200': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Teams]
      summary: Update a team
      description: Requires `admin` role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '200': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Teams]
      summary: Delete a team
      description: Requires `admin` role. Also removes all member and project associations.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/teams/{id}/members:
    post:
      tags: [Teams]
      summary: Add a member to a team
      description: Requires `admin` role.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
            example:
              user_id: 5
      responses:
        '201': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/teams/{id}/members/{userId}:
    delete:
      tags: [Teams]
      summary: Remove a member from a team
      description: Requires `admin` role.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - in: path
          name: userId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/teams/{id}/projects:
    post:
      tags: [Teams]
      summary: Assign a project to a team
      description: Requires `admin` role.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: integer }
                role: { type: string, default: viewer, enum: [viewer, operator] }
            example:
              project_id: 3
              role: operator
      responses:
        '201': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/teams/{id}/projects/{projectId}:
    delete:
      tags: [Teams]
      summary: Unassign a project from a team
      description: Requires `admin` role.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - in: path
          name: projectId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────── Users ──────────────────────────────
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      description: Requires `user.view`.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/UserList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user
      description: Requires `user.create`. Password is required and must be at least 5 characters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
            example:
              username: operator01
              email: operator01@example.com
              password: changeme123
              role: operator
      responses:
        '201': { $ref: '#/components/responses/UserResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/users/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Users]
      summary: Get a single user
      description: |
        Requires `user.view`. Sensitive fields (password_hash, auth_key,
        totp_secret, recovery_codes) are never returned.
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Update a user
      description: |
        Requires `user.update`. Password is optional on update — if provided
        it must be at least 5 characters. Taking the superadmin flag from the
        only superadmin (`is_superadmin: false`) answers 422
        `Cannot demote the only superadmin.` and changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Users]
      summary: Delete a user
      description: |
        Requires `user.delete`. Cannot delete your own account or the last
        superadmin (422). A user whom other records still refer to cannot be
        deleted either (409): jobs they launched, rows they created (projects,
        templates, schedules and so on) or a trigger token they generated.
        Disable such a user instead (`PUT` with `status: 0`).
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Other records still refer to the user. Nothing was changed: the
            user and their roles are kept.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── LDAP ─────────────────────────────
  /api/v1/admin/ldap/test:
    get:
      tags: [LDAP]
      summary: Run an LDAP connection diagnostic
      description: |
        Admin-only. Performs a service-account bind against the configured
        directory and returns connection-level diagnostics. Never returns the
        bind password or any other secret.
      responses:
        '200':
          description: Diagnostic snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LdapDiagnosticResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [LDAP]
      summary: Run a diagnostic and verify a directory user
      description: |
        Admin-only. Same as `GET /admin/ldap/test`, plus an optional user
        lookup. If `password` is included the call performs a full
        authenticate (bind as user); otherwise it performs a search-only
        lookup. Useful for verifying the search filter, group mapping,
        and the resulting Ansilume role assignment for a candidate user.

        Audited via `ldap.test.performed`. The submitted password is **never**
        logged, persisted, or returned.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Directory username to look up (sAMAccountName / uid).
                password:
                  type: string
                  description: Optional. If set, performs a full authenticate.
            example:
              username: jdoe
              password: optional-only-for-bind-verification
      responses:
        '200':
          description: Diagnostic snapshot with optional user lookup
          content:
            application/json:
