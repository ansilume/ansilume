          description: Test dispatched
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent: { type: boolean }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ─────────────────────────── Approval Rules ───────────────────────────
  /api/v1/approval-rules:
    get:
      tags: [Approval Rules]
      summary: List approval rules
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
