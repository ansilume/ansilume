  # ─────────────────────────── Triggers ───────────────────────────
  /trigger/fire:
    post:
      tags: [Triggers]
      summary: Launch a job by trigger token
      description: |
        Authentication is the trigger token itself, sent in the
        `X-Trigger-Token` header (recommended) or as
        `Authorization: Bearer <token>`. This endpoint is **not** under
        `/api/v1/`, and the Bearer token here is the trigger token, not an
        API token. The `token` query parameter still works but is
        deprecated. Generate or revoke the token on the job template's page
        or with `POST` and `DELETE /api/v1/job-templates/{id}/trigger-token`,
        which need `job-template.update` and operator access to the
        template's project; the raw token is shown once, the server keeps
        only its SHA-256 hash.

        ```bash
        curl -X POST -H "X-Trigger-Token: <trigger-token>" \
          -H "Content-Type: application/json" -d "{}" \
          https://ansilume.example.com/trigger/fire
        ```

        The job runs as the user who generated the token. Tokens generated
        before Ansilume recorded that run as the template's creator; the
        template page says which applies, and `trigger_user_id` of
        `GET /api/v1/job-templates/{id}` names the user, both for callers who
        may change the template. Every call checks that this user is active,
        holds `job.launch` and may operate the template's project. Otherwise
        the call answers 403 `{"error": "Launch refused."}` and is audited as
        `trigger.denied` with the reason (`not_permitted` or
        `no_project_access`) and the transport; the caller learns nothing
        else. A launch is audited as `trigger.fired` with the transport and
        the `job_id`. This user is the job's launcher (`launched_by`) and
        never approves it, so for an older token the template's creator does
        not approve the jobs of its trigger until the token is generated
        again.

        The optional JSON body overrides `extra_vars`, `limit` and
        `verbosity` of the job template. Values in `extra_vars` whose key is
        a password field of the template's survey are password answers,
        stored only encrypted. A launch the server refuses for a reason the
        caller can fix answers 422 with the reason, for example
        `$encrypted$` sent as a password answer, a `verbosity` above 5, an
        approval rule that leaves too few eligible approvers besides the
        user the trigger runs as (that user never approves the job), or a
        template whose own approval rule differs from its inventory's. A
        template with an approval rule, its own or its inventory's, creates
        a job that waits for approval: the answer's `status` is then
        `pending_approval`, and `queued` for a job that waits for a runner.
        Any method but POST answers 405.
      security:
        - triggerTokenHeader: []
        - triggerTokenBearer: []
        - {}
      parameters:
        - in: query
          name: token
          required: false
          deprecated: true
          description: |
            The trigger token in the URL. Deprecated: URLs end up in access
            logs and in proxies. Ansilume's nginx masks it in its access log,
            from `token=` to the end of the URL; send the token in the
            `X-Trigger-Token` header instead.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerJobInput' }
            example:
              extra_vars: { env: prod }
              limit: webservers
      responses:
        '201': { $ref: '#/components/responses/TriggerJobLaunched' }
        '400': { $ref: '#/components/responses/TriggerTokenMissing' }
        '403': { $ref: '#/components/responses/TriggerLaunchRefused' }
        '404': { $ref: '#/components/responses/TriggerNotFound' }
        '422': { $ref: '#/components/responses/TriggerLaunchRejected' }
        '500': { $ref: '#/components/responses/TriggerLaunchFailed' }

  /trigger/{token}:
    post:
      tags: [Triggers]
      summary: Launch a job by trigger token in the path (deprecated)
      deprecated: true
      description: |
        Deprecated: the path ends up in access logs and in proxies. Send the
        token in the `X-Trigger-Token` header of `POST /trigger/fire`
        instead; the template page shows only that form.

        Same as `/trigger/fire`, with the token in the path, also with a
        trailing slash. Runs as the user who generated the token, with the
        same checks and answers; an `X-Trigger-Token` header wins over the
        path. Ansilume's nginx masks the path in its access log. Any method
        but POST answers 405, and every other path under `/trigger/` answers
        404. Tokens are lowercase, as generated; the path also takes
        uppercase hexadecimal, which answers 404 like any unknown token.
      security: []
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: '^[a-fA-F0-9]{64}$' }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerJobInput' }
      responses:
        '201': { $ref: '#/components/responses/TriggerJobLaunched' }
        '403': { $ref: '#/components/responses/TriggerLaunchRefused' }
        '404': { $ref: '#/components/responses/TriggerNotFound' }
        '422': { $ref: '#/components/responses/TriggerLaunchRejected' }
        '500': { $ref: '#/components/responses/TriggerLaunchFailed' }

  /trigger/fire-workflow:
    post:
      tags: [Triggers]
      summary: Launch a workflow by trigger token
      description: |
        Mirror of `/trigger/fire` for workflow templates: launches a run of
        the workflow template whose trigger token is sent, in the
        `X-Trigger-Token` header (recommended), as
        `Authorization: Bearer <token>`, or in the deprecated `token` query
        parameter. The token is hashed (SHA-256) on the server; generated
        tokens are shown exactly once. Generating or revoking it, on the
        workflow's page or with `POST` and
        `DELETE /api/v1/workflow-templates/{id}/trigger-token`, needs
        `workflow-template.update` and operator access to the project of every
        job step.

        The run is launched as the user who generated the token, or as the
        workflow's creator for tokens generated before Ansilume recorded that;
        `trigger_user_id` of `GET /api/v1/workflow-templates/{id}` names the
        user for callers who may change the workflow. Every call checks that
        this user is active, holds `workflow.launch` and may operate the
        project of every job step, also for a workflow without steps.
        Otherwise the call answers 403 `{"error": "Launch refused."}` and is
        audited as `workflow.launch.denied` with source `trigger` and the
        transport. Each job step is checked again, as the same user, when it
        starts. A launch is audited as `trigger.fired` with the transport and
        the `workflow_job_id`. This user is the launcher of the run's
        approval steps and job steps and never approves them, so for an
        older token the workflow's creator does not approve them until the
        token is generated again.

        The optional JSON body's `extra_vars` (a JSON object, or JSON text of
        one) are the run's launch extra vars. They are stored on the run,
        password answers as `$encrypted$`, and reach every job step of it:
        over the job template's extra vars, and under the step's mapping of
        the previous step's output (`extra_vars_template`). A value whose
        key is a password field of the job template of any job step is a
        password answer: it is stored only encrypted and stays encrypted in
        every step's job. `null`, `""` and `{}` mean none. Other keys of the
        body are ignored, and so is a body that is not valid JSON.

        A launch the server refuses for a reason the caller can fix answers
        422 with the reason, and no run is created: extra vars that are not
        a JSON object, that JSON cannot hold or that take more than 65535
        bytes, `$encrypted$` sent as a password answer, a workflow without
        steps, a workflow deleted meanwhile, an approval that could never be
        granted (an approval step, or a job step whose job template has an
        approval rule, its own or its inventory's, whose rule leaves too few
        eligible approvers besides the user the trigger runs as, or no
        longer exists), and a job step whose job template and inventory have
        different approval rules. Any method but POST answers 405.
      security:
        - triggerTokenHeader: []
        - triggerTokenBearer: []
        - {}
      parameters:
        - in: query
          name: token
          required: false
          deprecated: true
          description: |
            The trigger token in the URL. Deprecated: URLs end up in access
            logs and in proxies. Send it in the `X-Trigger-Token` header
            instead.
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TriggerWorkflowInput' }
            example:
              extra_vars: { release: '2026.04' }
      responses:
        '201':
          description: Workflow launched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TriggerWorkflowResult' }
              example:
                workflow_job_id: 17
        '400': { $ref: '#/components/responses/TriggerTokenMissing' }
        '403': { $ref: '#/components/responses/TriggerLaunchRefused' }
        '404': { $ref: '#/components/responses/TriggerNotFound' }
        '422': { $ref: '#/components/responses/WorkflowTriggerLaunchRejected' }
        '500': { $ref: '#/components/responses/TriggerLaunchFailed' }

  # ────────────────────────────── Roles ──────────────────────────────
  /api/v1/roles:
    get:
      tags: [Roles]
      summary: List all RBAC roles (system + custom)
      responses:
        '200':
          description: List of roles with summary counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RoleSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Roles]
      summary: Create a custom role
      description: |
        Requires `role.create`. A caller who is no superadmin may list only
        permissions they hold, through their roles or the default role
        viewer; a permission they do not hold answers 403 `You cannot grant
        the permission "user.update": you do not hold it.`, naming the first
        such permission of the request, and nothing is written. A permission
        listed twice is granted once. The answers come in this order: 403
        `Forbidden.` without `role.create`; 422 for a body that does not
        validate (the name, an unknown permission); 403 for a permission the
        caller does not hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
            example:
              name: reader-plus
              description: Read-only access with analytics
              permissions: [project.view, job.view, analytics.view]
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/RoleCreateForbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/roles/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9_-]*$' }
    get:
      tags: [Roles]
      summary: Get a role with direct + effective permissions
      responses:
        '200':
          description: Role detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Roles]
      summary: Update a role's description and direct permissions
      description: |
        System roles (viewer/operator/admin) can have their permissions edited
        but not their name. The name field in the body is ignored for them.

        Requires `role.update`. A caller who is no superadmin changes only a
        role they may assign (they hold every permission it grants, and for
        the admin role, or a role that contains it, they hold the admin
        role), and adds to it only permissions they hold; removing
        permissions needs no more. A role they may not change answers 403
        `You cannot change or delete this role: you may not assign it, as it
        grants more than you hold.`; an added permission they do not hold
        answers 403 `You cannot grant the permission "user.update": you do
        not hold it.`. Nothing is written. The answers come in this order:
        403 `Forbidden.` without `role.update`; 404 for an unknown role; 403
        for a role the caller may not change; 422 for a body that does not
        validate; 403 for an added permission the caller does not hold.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/RoleUpdateForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Roles]
      summary: Delete a custom role
      description: |
        System roles cannot be deleted — returns 422. Users holding the role
        are left with no role and must be reassigned manually.

        Requires `role.delete`. A caller who is no superadmin deletes only a
        role they may assign; anyone else gets 403 `You cannot change or
        delete this role: you may not assign it, as it grants more than you
        hold.` and nothing is deleted. The answers come in this order: 403
        `Forbidden.` without `role.delete`; 404 for an unknown role; 403 for
        a role the caller may not change; 422 `Cannot delete system role.`;
        422 `Role could not be deleted.`.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/RoleDeleteForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/permissions:
    get:
      tags: [Roles]
      summary: List all known permissions grouped by domain
      description: |
        Returns the full permission catalog used by the role management UI.
        Useful for building custom role editors.
      responses:
        '200':
          description: Grouped permission catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PermissionGroup' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/profile/change-password:
    post:
      tags: [Profile]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
            example:
              current_password: "currentpass123"
              new_password: "newpass12345"
              new_password_confirm: "newpass12345"
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string, example: "Password changed." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message: { type: string }
                      fields: { type: object, additionalProperties: { type: string } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-hex
      description: API token minted via `/profile/tokens` or `php yii api-token/create`.
    triggerTokenHeader:
      type: apiKey
      in: header
      name: X-Trigger-Token
      description: |
        The trigger token of a job or workflow template, for the `/trigger/`
        endpoints only. The recommended way to send it: headers stay out of
        access logs and proxy logs, unlike URLs.
    triggerTokenBearer:
      type: http
      scheme: bearer
      bearerFormat: 64 hexadecimal characters
      description: |
        The trigger token as `Authorization: Bearer <token>`, for the
        `/trigger/` endpoints only; an API token does not work here. A token
        in the URL wins over it, and only the Bearer scheme counts, so a
        caller with an unrelated `Authorization` header keeps working.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    StepIdPath:
      name: stepId
      in: path
      required: true
      description: |
        The ID of a step of the workflow template `{id}` (`id` of
        `WorkflowStep`), not its position. A step of another workflow
        template answers 404 as an unknown one.
      schema: { type: integer, minimum: 1 }
    WaitingForFilter:
      name: waiting_for
      in: query
      required: false
      description: |
        Only the running runs that wait for this at their current step:
        `approval` (an approval request), `resume` (a paused run) or
        `runner` (a job that waits for a runner). Empty: no filter. Any
        other value answers 422 `waiting_for must be one of: approval,
        resume, runner.`
      schema: { type: string, enum: [approval, resume, runner] }
    WorkflowTemplateIdFilter:
      name: workflow_template_id
      in: query
      required: false
      description: |
        Only the runs of this workflow template, also a deleted one: a whole
        number from 1, in digits. Empty: no filter. Any other value answers
        422 `workflow_template_id must be a positive integer.`
      schema: { type: integer, minimum: 1 }
    WorkflowJobStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Only the runs with this stored status; a run that waits is
        `running` (see `waiting_for`). Empty: no filter. Any other value
        answers 422 `status must be one of: running, succeeded, failed,
        canceled.`
      schema: { type: string, enum: [running, succeeded, failed, canceled] }
    ApprovalStatusFilter:
      name: status
      in: query
      required: false
      description: |
        Only the approval requests with this status. Empty: no filter. Any
        other value answers 422 `status must be one of: pending, approved,
        rejected, timed_out, canceled.`
      schema: { type: string, enum: [pending, approved, rejected, timed_out, canceled] }

  responses:
    NotFound:
      description: |
        Resource not found. An unknown resource `{id}` in the path (a role's
        `{name}`) answers in the framework's shape (`FrameworkError`). Unknown
        nested IDs in the path (`artifact_id`, `userId`, `projectId`) and
        other lookups answer as `ErrorResponse`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FrameworkError'
              - $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required (missing or invalid token)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FrameworkError' }
          examples:
            missing:
              summary: No Bearer token
              value: { name: Unauthorized, message: 'Bearer token required.', code: 0, status: 401 }
            invalid:
              summary: An unknown or expired token, or the token of a disabled user
              value: { name: Unauthorized, message: 'Invalid or expired token.', code: 0, status: 401 }
    Forbidden:
      description: |
        The caller lacks the required permission, or access to the resource:
        view or operator access to the project it belongs to (team scope).
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    RunnerManagementForbidden:
      description: |
        The caller lacks the permission the request needs:
        `runner-group.create` to create a runner group, `runner-group.delete`
        to delete one, and `runner-group.update` to change one and to move or
        delete a runner or regenerate its token. Of the built-in roles only
        admin holds them, so operators get this answer too. The check comes
        first, before the `404` of an unknown ID: nothing is changed or
        audited, and no token is returned.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              message: Forbidden.
    ValidationError:
      description: Invalid input
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ServerError:
      description: Server-side failure (e.g. directory unreachable)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    DeletedResponse:
      description: Deletion confirmed
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  deleted: { type: boolean }
    GenericResponse:
      description: Success
      content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } }
    AnalyticsResult:
      description: |
        Analytics report result, counting only what the caller may see (team
        scope). When `format=json` the body wraps the report under
        `data.result` with the echoed filter set under `data.filters`. When
        `format=csv` the body is raw CSV.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  filters:
                    type: object
                    description: Echo of the filter parameters that were applied
                  result:
                    description: |
                      Report payload — shape depends on the endpoint. Summary
                      endpoints return an object; list endpoints return an
                      array of rows.
                    oneOf:
                      - { type: object }
                      - { type: array, items: { type: object } }
        text/csv:
          schema:
            type: string
            description: CSV export (only when `format=csv`)
    InventoryDetailResponse:
      description: The inventory with its content and source path
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/InventoryDetail' }
    InventoryViewResponse:
      description: The inventory with its content and source path, and the job templates that use it
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/InventoryView' }
    InventoryRejected:
      description: |
        The inventory was not saved, and nothing was written: a field of the
        body that holds a list or an object (`<field> must be a single
        value, not a list or an object.`), or the first validation error,
        such as `Name cannot be blank.`, `The selected project does not
        exist.`, `The selected approval rule does not exist.`, `Approval
        rule must be an integer.`, a dynamic inventory with an approval rule
        but without a source path, a change of the type or the project that
        would leave job templates of another project on a file or dynamic
        inventory of this one, static content that the inventory brings
        (new, changed, or of an inventory that becomes static) and that is
        no YAML mapping (`Invalid YAML: …`, `Inventory must be a YAML
        mapping (not a scalar).`), and, on an update that gives the
        inventory an approval rule, live job templates on it with another
        rule of their own.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            notAValue:
              summary: A field that holds a list or an object
              value:
                error:
                  message: 'project_id must be a single value, not a list or an object.'
            approvalRuleNotFound:
              summary: An approval_rule_id that names no rule
              value:
                error:
                  message: 'The selected approval rule does not exist.'
            rulesDiffer:
              summary: An update gives the inventory a rule while a job template on it has another rule of its own
              value:
                error:
                  message: 'Job templates that use this inventory have another approval rule of their own: "deploy-web". A launch waits for one rule only, so give them this rule or none first.'
            sourcePathRequired:
              summary: A dynamic inventory with an approval rule but without a source path
              value:
                error:
                  message: "A dynamic inventory with an approval rule needs a source path: without one, jobs use the default inventory of Ansible or of the repository's ansible.cfg, which no rule gates."
    InventoryNotFound:
      description: |
        The inventory does not exist, in the framework's shape
        (`FrameworkError`), or another request deleted it while the change
        was checked, as `ErrorResponse`. Nothing was written.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FrameworkError'
              - $ref: '#/components/schemas/ErrorResponse'
          examples:
            inventory:
              summary: An unknown inventory
              value: { name: Not Found, message: 'Inventory #7 not found.', code: 0, status: 404 }
            deletedMeanwhile:
              summary: Another request deleted the inventory while the change was checked
              value:
                error:
                  message: 'Inventory #7 not found.'
    InventoryInUse:
      description: |
        The inventory is in use and was not deleted: live job templates use
        it, or deleted ones still refer to it, for the history of their
        jobs. `error.used_by` says which: the list holds the live job
        templates the caller may see, the counts everything. Point the job
        templates at another inventory first; a deleted job template keeps
        its inventory until its project is deleted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/InventoryInUseError' }
          example:
            error:
              message: 'Inventory "web-prod" is in use by 1 job template(s). Point its job templates at another inventory first. A deleted job template keeps its inventory for the history of its jobs until its project is deleted, so deleting the template does not free it.'
              used_by:
                in_use: true
                job_templates:
                  - { id: 12, name: deploy-web, project_id: 2, project_name: web, approval_rule_id: null, approval_rule_name: null }
                hidden_job_template_count: 0
                deleted_job_template_count: 0
    CredentialResponse:
      description: Credential (secrets never included)
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Credential' }
    CredentialDetailResponse:
      description: Credential with secret status and usage (secrets never included)
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/CredentialDetail' }
    VaultAssignmentCandidatesResponse:
      description: Job templates the caller may change
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/VaultAssignmentCandidate' } }
    VaultAssignmentResponse:
      description: Outcome per job template
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/VaultAssignmentResult' }
    CredentialInUse:
      description: The credential is in use; nothing was deleted
      content: { application/json: { schema: { $ref: '#/components/schemas/CredentialInUseError' } } }
    VaultAssignmentRejected:
      description: The request was rejected; nothing was written
      content: { application/json: { schema: { $ref: '#/components/schemas/VaultAssignmentError' } } }
    JobDetailResponse:
      description: Job with its credentials (secrets never included)
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/JobDetail' }
    JobLaunchResponse:
      description: The launched job, with the template's warnings
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/JobDetail' }
              warnings:
                type: array
                items: { $ref: '#/components/schemas/JobTemplateWarning' }
    ProjectVaultResponse:
      description: Vault overview of the project
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/ProjectVault' }
    ProjectResponse:
      description: Project
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Project' }
    ProjectRejected:
      description: |
        Invalid input, such as a missing name, an unknown `scm_type`, or, for
        git projects, a `scm_branch` that starts with `-` or contains
        whitespace, also the branch a project was saved with before 2.11.0
        when a `PUT` sends no other one, and that of a manual project that a
        `PUT` makes a git project. The answer names the first error. Nothing
        was saved and no sync was queued.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            branch:
              summary: A branch that starts with "-" or contains whitespace
              value:
                error:
                  message: 'The branch cannot start with "-" or contain whitespace.'
    JobTemplateResponse:
      description: Job template
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/JobTemplate' }
    JobTemplateRejected:
      description: |
        The job template was not saved, and nothing was written: the first
        validation error. Among them `The selected inventory does not
        exist.` for an inventory that does not exist or belongs to a project
        the caller cannot see, also one with an approval rule, and an own
        approval rule other than the rule of the template's inventory
        (`Inventory "web-prod" has the approval rule "deploy-prod": a job
        template on it may have only that rule as its own, or none.`). More
        than one vault password, a file or dynamic inventory of another
        project, and the rules of `survey_fields` and `extra_vars` of
        `JobTemplateInput` answer 422 as well.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            rulesDiffer:
              summary: An own approval rule other than the rule of the template's inventory
              value:
                error:
                  message: 'Inventory "web-prod" has the approval rule "deploy-prod": a job template on it may have only that rule as its own, or none.'
            inventoryNotFound:
              summary: An inventory that does not exist, or that the caller cannot see
              value:
                error:
                  message: 'The selected inventory does not exist.'
    JobResponse:
      description: Job
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Job' }
    ScheduleResponse:
      description: Schedule
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Schedule' }
    RunnerGroupResponse:
      description: Runner group
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/RunnerGroup' }
    RunnerResponse:
      description: Runner
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Runner' }
    TeamResponse:
      description: Team with members and projects
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/TeamDetail' }
    UserResponse:
      description: User (sensitive fields excluded)
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/User' }
    UserGrantForbidden:
      description: |
        The caller lacks `user.create`, may not assign the `role` (one that
        grants permissions the caller does not hold, or the `admin` role or a
        role that contains it, from a caller who does not hold the `admin`
        role), or is no superadmin and would set `is_superadmin`. Nothing was
        written.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            permission:
              summary: Missing user.create
              value:
                error:
                  message: Forbidden.
            role:
              summary: A role that grants permissions the caller does not hold
              value:
                error:
                  message: 'You cannot assign the role "admin": it grants permissions you do not hold.'
            adminRole:
              summary: The admin role, from a caller who holds its permissions but not the role
              value:
                error:
                  message: 'You cannot assign the role "admin": it is or contains the admin role, which only superadmins and admins may assign.'
            superadmin:
              summary: is_superadmin set or cleared by a caller who is no superadmin
              value:
                error:
                  message: 'Only a superadmin can set or clear is_superadmin.'
    UserUpdateForbidden:
      description: |
        The caller lacks `user.update`, may not change the user (a
        superadmin, a user with a role that grants permissions the caller
        does not hold, a user with the `admin` role or a role that contains
        it, from a caller who does not hold the `admin` role, or a user whose
        teams give them more access to a project than the caller's teams give
        the caller), may not assign the `role` (one that grants permissions
        the caller does not hold, or the `admin` role or a role that contains
        it, from a caller who does not hold the `admin` role), or is no
        superadmin and would set or clear `is_superadmin`. Nothing was
        written.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            permission:
              summary: Missing user.update
              value:
                error:
                  message: Forbidden.
            change:
              summary: A superadmin, or a user whose roles grant permissions the caller does not hold
              value:
                error:
                  message: 'You cannot change or delete this user: they are a superadmin, or a role assigned to them grants permissions you do not hold.'
            adminUser:
              summary: A user with the admin role, from a caller who holds every permission of their roles but not the admin role
              value:
                error:
                  message: 'You cannot change or delete this user: a role assigned to them is or contains the admin role, which only a superadmin or an admin may assign.'
            team:
              summary: A user whose teams give them more access to a project than the caller has
              value:
                error:
                  message: 'You cannot change or delete this user: their teams give them more access to a project than you have.'
            role:
              summary: A role that grants permissions the caller does not hold
              value:
                error:
                  message: 'You cannot assign the role "admin": it grants permissions you do not hold.'
            adminRole:
              summary: The admin role, from a caller who holds its permissions but not the role
              value:
                error:
                  message: 'You cannot assign the role "admin": it is or contains the admin role, which only superadmins and admins may assign.'
            superadmin:
              summary: is_superadmin set or cleared by a caller who is no superadmin
              value:
                error:
                  message: 'Only a superadmin can set or clear is_superadmin.'
    UserDeleteForbidden:
      description: |
        The caller lacks `user.delete`, or may not change the user: a
        superadmin, a user with a role that grants permissions the caller
        does not hold, a user with the `admin` role or a role that contains
        it, from a caller who does not hold the `admin` role, or a user whose
        teams give them more access to a project than the caller's teams give
        the caller. Nothing was deleted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            permission:
              summary: Missing user.delete
              value:
                error:
                  message: Forbidden.
            change:
              summary: A superadmin, or a user whose roles grant permissions the caller does not hold
              value:
                error:
                  message: 'You cannot change or delete this user: they are a superadmin, or a role assigned to them grants permissions you do not hold.'
            adminUser:
              summary: A user with the admin role, from a caller who holds every permission of their roles but not the admin role
              value:
                error:
                  message: 'You cannot change or delete this user: a role assigned to them is or contains the admin role, which only a superadmin or an admin may assign.'
            team:
              summary: A user whose teams give them more access to a project than the caller has
              value:
                error:
                  message: 'You cannot change or delete this user: their teams give them more access to a project than you have.'
    RoleCreateForbidden:
      description: |
        The caller lacks `role.create`, or lists a permission they do not
        hold. Nothing was written.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            permission:
              summary: Missing role.create
              value:
                error:
                  message: Forbidden.
            grant:
              summary: A permission the caller does not hold
              value:
                error:
                  message: 'You cannot grant the permission "user.update": you do not hold it.'
    RoleUpdateForbidden:
      description: |
        The caller lacks `role.update`, may not change the role (it grants
        more than they hold), or adds a permission they do not hold. Nothing
        was written.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            permission:
              summary: Missing role.update
              value:
                error:
                  message: Forbidden.
            change:
              summary: A role the caller may not assign
              value:
                error:
                  message: 'You cannot change or delete this role: you may not assign it, as it grants more than you hold.'
            grant:
              summary: An added permission the caller does not hold
              value:
                error:
                  message: 'You cannot grant the permission "user.update": you do not hold it.'
    RoleDeleteForbidden:
      description: |
        The caller lacks `role.delete`, or may not change the role. Nothing
        was deleted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            permission:
              summary: Missing role.delete
              value:
                error:
                  message: Forbidden.
            change:
              summary: A role the caller may not assign
              value:
                error:
                  message: 'You cannot change or delete this role: you may not assign it, as it grants more than you hold.'
    WebhookResponse:
      description: Webhook
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Webhook' }
    AuditLogResponse:
      description: Audit log entry
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/AuditLog' }
    NotificationTemplateResponse:
      description: Notification template
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/NotificationTemplate' }
    NotificationTemplateRejected:
      description: |
        Invalid input, such as a missing name or an unknown channel, or
        `$encrypted$` at the place of a channel secret that cannot keep a
        stored value: nothing is stored there (always on create), the
        channel changed, or, for a header of a webhook channel, its `url`
        changed. Nothing was written.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            notStored:
              summary: $encrypted$ where no value is stored
              value:
                error:
                  message: 'bot_token has no stored value; enter the real value.'
            channelChanged:
              summary: $encrypted$ after a change of the channel
              value:
                error:
                  message: 'webhook_url: the channel changed; enter the real value.'
            urlChanged:
              summary: A header kept as $encrypted$ while the webhook url changes
              value:
                error:
                  message: 'headers.Authorization: url changed; enter the real value.'
            notEncodable:
              summary: A config with a number too large for JSON
              value:
                error:
                  message: 'The config cannot be stored: it contains a number too large for JSON.'
    ApprovalRequestResponse:
      description: Approval request
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/ApprovalRequest' }
    ApprovalDecisionForbidden:
      description: |
        The vote was refused, and nothing was recorded: the caller may not
        see the request, launched its job, or is not an eligible approver
        (see Approvals). The launcher of a job reads `You launched this job;
        another approver must decide.`; for the job of a workflow step, the
        placeholder job of an approval step or the job of a gated job step,
        the user who started the run reads `You launched this workflow run;
        another approver must decide.`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            hidden:
              summary: The caller may not see the request
              value:
                error:
                  message: Forbidden.
            launcher:
              summary: The caller launched the job
              value:
                error:
                  message: You launched this job; another approver must decide.
            launcherRun:
              summary: The caller started the workflow run whose step waits for the request
              value:
                error:
                  message: You launched this workflow run; another approver must decide.
            notEligible:
              summary: The caller is no eligible approver
              value:
                error:
                  message: You are not eligible to decide on this request.
    ApprovalDecisionConflict:
      description: |
        The request takes no more votes, and nothing was recorded:
        `error.status` is the request's status. It is resolved; it has
        expired (status still `pending`: the next maintenance run applies
        its timeout); or its job no longer waits for approval, or still
        waits but can never run, because its workflow step or run has
        ended or its job template was deleted (status `canceled`: the vote
        closed the request, and canceled such a job).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApprovalDecisionConflictError' }
          examples:
            resolved:
              summary: The request is resolved
              value:
                error:
                  message: 'Approval request #12 is already resolved: approved.'
                  status: approved
            expired:
              summary: The request has expired
              value:
                error:
                  message: 'Approval request #12 has expired and takes no more votes; its timeout is applied by the next maintenance run.'
                  status: pending
            jobNotWaiting:
              summary: The job no longer waits for approval
              value:
                error:
                  message: 'Approval request #12 can no longer be decided: its job #34 no longer waits for approval.'
                  status: canceled
    ApprovalDecisionRejected:
      description: |
        The vote was not recorded: the caller has voted on this request
        already, or the vote is invalid, for example a comment that is too
        long or not a string.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            alreadyVoted:
              summary: A second vote of the same caller
              value:
                error:
                  message: User has already voted on this request.
            commentTooLong:
              summary: A comment of more than 1000 characters
              value:
                error:
                  message: 'The decision cannot be recorded: Comment should contain at most 1,000 characters.'
            commentNotAString:
              summary: A comment that is a list, an object or a number
              value:
                error:
                  message: 'The decision cannot be recorded: Comment must be a string.'
    ApprovalRuleResponse:
      description: Approval rule, as stored
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/ApprovalRule' }
    ApprovalRuleDetailResponse:
      description: Approval rule with where it is used
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/ApprovalRuleDetail' }
    ApprovalRuleRejected:
      description: |
        The rule was not saved: `job_template_id` other than null (approval
        rules never gated a job template that way), or the first validation
        error, such as `Name cannot be blank.`, `Name must be a string.`,
        `Approver Type cannot be blank.`, `Approver Type is invalid.`,
        `Approver Config cannot be blank.`, `Approver Config must be valid
        JSON.`, `Approver Config must be a JSON object.` for a list or a
        single value, or, for a `users` rule, `Required approvals (3)
        exceeds eligible approvers (1).`
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            jobTemplateId:
              summary: job_template_id was sent
              value:
                error:
                  message: 'job_template_id is not used by approval rules: set approval_rule_id on the job template (admins only).'
            tooFewApprovers:
              summary: More required approvals than listed users
              value:
                error:
                  message: Required approvals (3) exceeds eligible approvers (1).
    ApprovalRuleInUse:
      description: |
        The rule is in use and was not deleted. `error.used_by` says where:
        the lists hold what the caller may see, the counts everything.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApprovalRuleInUseError' }
    WorkflowTemplateResponse:
      description: Workflow template with its steps
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/WorkflowTemplateDetail' }
    WorkflowLaunchResponse:
      description: The launched run, and what it waits for right after the launch
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/WorkflowLaunchResult' }
          examples:
            approval:
              summary: The first step waits for an approval
              value:
                data: { workflow_job_id: 17, waiting_for: approval, approval_request_id: 12 }
            running:
              summary: The first step runs, or the run has already ended
              value:
                data: { workflow_job_id: 17, waiting_for: null, approval_request_id: null }
    WorkflowLaunchRejected:
      description: |
        The launch was refused for a reason the caller or an admin can fix,
        and no run was created. `error.message` says why. An approval that
        could never be granted is checked for every approval step and every
        gated job step (a job step whose job template has an approval rule,
        its own or its inventory's), and the first such step in the run
        order answers; a job step whose job template and inventory have
        different approval rules too, as a launch waits for one rule only.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            notAnObject:
              summary: The extra vars are not a JSON object
              value:
                error:
                  message: 'The extra vars must be a JSON object, such as {"env": "prod"}.'
            placeholder:
              summary: A password answer was the placeholder
              value:
                error:
                  message: 'The value of "db_password" is the placeholder $encrypted$; send the real value.'
            tooFewApprovers:
              summary: An approval that could never be granted
              value:
                error:
                  message: 'Step "Release approval": approval rule "deploy-prod" needs 1 approval(s) from users other than the one who launches, but only 0 of its approvers may decide. An admin can add approvers to the rule.'
            ruleMissing:
              summary: An approval step whose rule is gone
              value:
                error:
                  message: 'Step "Release approval": its approval rule no longer exists. An admin can choose another rule.'
            rulesDiffer:
              summary: A job step whose job template and inventory have different approval rules
              value:
                error:
                  message: "Step \"Deploy\": its job template and its inventory have different approval rules, and a launch waits for one rule only. An admin can remove the template's own rule or give it the inventory's rule."
            noSteps:
              summary: The workflow has no steps
              value:
                error:
                  message: 'Workflow template #5 has no steps.'
            deleted:
              summary: The workflow was deleted meanwhile
              value:
                error:
                  message: 'Workflow template #5 was deleted.'
    WorkflowLaunchFailed:
      description: |
        A database error stopped the launch, for example a deadlock, a lock
        wait timeout or a lost connection; it is no refusal. The message
        names the error by its class, SQLSTATE and driver error code, never
        by its message, which can carry the SQL statement with its values,
        and the application log has it as `Launch of workflow template #5
        failed: ...` with the same text. No run was created, unless the
        error struck while the run's first step started: then the run exists
        and has ended as failed. Launch again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            deadlock:
              summary: A deadlock
              value:
                error:
                  message: 'yii\db\Exception (SQLSTATE 40001, driver error 1213)'
            lostConnection:
              summary: A database error that escaped Yii's wrapping, such as a failed COMMIT
              value:
                error:
                  message: 'PDOException (SQLSTATE HY000, driver error 2006)'
    WorkflowStepsLocked:
      description: |
        The steps did not change, because runs of the workflow are active.
        The message names the first 10 runs and counts the others;
        `error.workflow_job_ids` lists them all. Let them finish, or cancel
        them, then send the steps again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkflowStepsLockedError' }
          example:
            error:
              message: 'Steps cannot change while run(s) #12 of this workflow are active: wait for them to finish or cancel them.'
              workflow_job_ids: [12]
    WorkflowStepWritten:
      description: |
        The step as it is now, and what the change did. A change that
        writes nothing says so in `change.message`, and has no warnings.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkflowStepWriteResponse' }
          examples:
            added:
              summary: A job step added after the approval step, which was the last step
              value:
                data:
                  id: 43
                  name: Deploy
                  step_order: 30
                  step_type: job
                  job_template_id: 15
                  approval_rule_id: null
                  on_success_step_id: null
                  on_failure_step_id: 0
                  on_always_step_id: null
                  extra_vars_template: []
                  position: 3
                  is_start: false
                  reachable: true
                  cannot_run: null
                  routes:
                    success: { kind: end, via: next, step_id: null, position: null, run_outcome: succeeds, loop: false }
                    failure: { kind: end, via: on_failure, step_id: null, position: null, run_outcome: fails, loop: false }
                    closed_gate: null
                change:
                  message: 'Step "Deploy" added at position 3 of 3, after "Release approval". "Release approval" now continues with "Deploy" (was the end of the run).'
                  warnings: []
            movedToStart:
              summary: That step moved to the start, before the approval step
              value:
                data:
                  id: 43
                  name: Deploy
                  step_order: 10
                  step_type: job
                  job_template_id: 15
                  approval_rule_id: null
                  on_success_step_id: null
                  on_failure_step_id: 0
                  on_always_step_id: null
                  extra_vars_template: []
                  position: 1
                  is_start: true
                  reachable: true
                  cannot_run: null
                  routes:
                    success: { kind: step, via: next, step_id: 41, position: 2, run_outcome: null, loop: false }
                    failure: { kind: end, via: on_failure, step_id: null, position: null, run_outcome: fails, loop: false }
                    closed_gate: null
                change:
                  message: 'Step "Deploy" moved to position 1 of 3, at the start. "Deploy" now continues with "Build" (was the end of the run). "Release approval" now ends the run (was "Deploy").'
                  warnings:
                    - 'Runs now start with "Deploy" (was "Build").'
                    - 'Job step "Deploy" now runs before the approval step "Release approval": runs start it without waiting for that approval.'
    WorkflowStepDeletedResponse:
      description: |
        The step was removed, and what that did: where it was, how the empty
        branches of other steps now lead, and warnings when runs now start
        with another step, reach a job step without passing the approval
        step they passed before, or when an approval step is no longer on
        the success path.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkflowStepRemoveResponse' }
          example:
            data: { deleted: true, id: 43 }
            change:
              message: 'Step "Deploy" removed; it was at position 3 of 3. "Release approval" now ends the run (was "Deploy").'
              warnings: []
    WorkflowForStepNotFound:
      description: |
        The workflow template does not exist, in the framework's shape
        (`FrameworkError`), or another request deleted it meanwhile, as
        `ErrorResponse`.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FrameworkError'
              - $ref: '#/components/schemas/ErrorResponse'
          examples:
            workflow:
              summary: An unknown or deleted workflow template
              value: { name: Not Found, message: 'Workflow template #5 not found.', code: 0, status: 404 }
            deletedMeanwhile:
              summary: The workflow template was deleted while the change was checked
              value:
                error:
                  message: 'Workflow template #5 not found.'
    WorkflowStepNotFound:
      description: |
        The workflow template does not exist, in the framework's shape
        (`FrameworkError`); or, as `ErrorResponse`, it has no step `{stepId}`
        (a step of another workflow template included), another request
        deleted it meanwhile, or removed the step meanwhile.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/FrameworkError'
              - $ref: '#/components/schemas/ErrorResponse'
          examples:
            workflow:
              summary: An unknown or deleted workflow template
              value: { name: Not Found, message: 'Workflow template #5 not found.', code: 0, status: 404 }
            step:
              summary: The workflow template has no such step
              value:
                error:
                  message: 'Workflow template #5 has no step with ID 43.'
            deletedMeanwhile:
              summary: The workflow template was deleted while the change was checked
              value:
                error:
                  message: 'Workflow template #5 not found.'
            removedMeanwhile:
              summary: Another request removed the step while the change was checked
              value:
                error:
                  message: 'Workflow template #5 has no step with ID 43.'
    WorkflowStepsForbidden:
      description: |
        Missing `workflow-template.update` or operator access to the project
        of every job step of the workflow (`Forbidden.`), or the steps of a
        workflow that has an approval step or a gated job step (a job step
        whose job template has an approval rule, its own or its
        inventory's), without `approval-rule.update`. Nothing was written.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            forbidden:
              summary: Missing workflow-template.update or operator access to the workflow
              value:
                error:
                  message: Forbidden.
            approvalWorkflow:
              summary: The workflow has an approval step
              value:
                error:
                  message: 'This workflow has an approval step: only admins may change its steps (approval-rule.update).'
            gatedJobWorkflow:
              summary: The workflow has a job step whose job template has an approval rule
              value:
                error:
                  message: 'This workflow has a job step whose job template has an approval rule: only admins may change its steps (approval-rule.update).'
            gatedInventoryJobWorkflow:
              summary: The workflow has a job step whose job template's inventory has an approval rule
              value:
                error:
                  message: "This workflow has a job step whose job template's inventory has an approval rule: only admins may change its steps (approval-rule.update)."
    WorkflowStepRemoveConflict:
      description: |
        The step was not removed: runs of the workflow are active
        (`error.workflow_job_ids`, see `WorkflowStepsLocked`), or branches of
        other steps lead to it (`error.step_ids`): change those branches
        first.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/WorkflowStepsLockedError'
              - $ref: '#/components/schemas/WorkflowStepRoutedToError'
          examples:
            runsActive:
              summary: A run of the workflow is active
              value:
                error:
                  message: 'Steps cannot change while run(s) #12 of this workflow are active: wait for them to finish or cancel them.'
                  workflow_job_ids: [12]
            routedTo:
              summary: Other steps route to the step
              value:
                error:
                  message: 'Step "Deploy" was not removed: other steps route to it (step 1 "Build", step 4 "Verify"). Edit those steps to lead elsewhere first, then remove it.'
                  step_ids: [41, 44]
    WorkflowRunOperationFailed:
      description: |
        A database error stopped the cancel or the resume of the run. The
        message says what to do, and the application log has the error as
        `Workflow run #12: the cancel failed with a database error: ...`
        (`the resume` for a resume), with its class, SQLSTATE and driver
        error code, never its message. Load the run again
        (`GET /api/v1/workflow-jobs/{id}`): a run that still runs can be
        canceled again, and a pause step that still waits can be resumed
        again; for a run that shows canceled, the maintenance run ends its
        steps and cancels their waiting jobs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            cancel:
              summary: A cancel failed on a database error
              value:
                error:
                  message: 'Canceling workflow run #12 failed with a database error; see the application log. Load the run again: a run that still runs can be canceled again; for a canceled run, the maintenance run ends its steps and cancels their waiting jobs.'
            resume:
              summary: A resume failed on a database error
              value:
                error:
                  message: 'Resuming workflow run #12 failed with a database error; see the application log. Load the run again: a pause step that still waits can be resumed again.'
    WorkflowTemplateDeletedResponse:
      description: The workflow template was deleted, and its running runs canceled.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/WorkflowTemplateDeletion' }
          example:
            data: { deleted: true, canceled_runs: 1, failed_runs: 0 }
    WorkflowJobResponse:
      description: Workflow run, without its steps
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/WorkflowJob' }
    WorkflowJobDetailResponse:
      description: Workflow run with its steps
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/WorkflowJobDetail' }
    TriggerJobLaunched:
      description: |
        Job launched. `status` says whether it waits for approval
        (`pending_approval`: its job template has an approval rule, its own
        or its inventory's) or is queued for a runner (`queued`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TriggerJobResult' }
          example:
            job_id: 42
            status: pending_approval
    TriggerLaunchRefused:
      description: |
        The user the trigger runs as may not launch it: disabled, without the
        launch permission, or without operator access to the project (of
        every job step, for a workflow). Audited; no details for the caller.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TriggerError' }
          example:
            error: Launch refused.
    TriggerNotFound:
      description: |
        Unknown or revoked token. Also sends the `webhook.invalid_token`
        notification with the token's first six characters, so operators
        notice leaked or stale tokens. Every other path under `/trigger/`
        answers 404 `Page not found.` too, without a notification. The body
        is the web UI's HTML error page, not JSON.
      content:
        text/html:
          schema: { type: string }
    TriggerTokenMissing:
      description: |
        `Missing trigger token.`: the request carries no usable token, in no
        `X-Trigger-Token` header, no `token` query parameter and no
        `Authorization: Bearer` header. An empty value, or a list such as
        `token[]=...`, counts as none. The body is the web UI's HTML error
        page, not JSON.
      content:
        text/html:
          schema: { type: string }
    TriggerLaunchRejected:
      description: |
        The job template refused the launch for a reason the caller or an
        operator can fix; nothing was launched. `error` says why:
        `$encrypted$` sent as a password answer (send the real value), a
        password field whose name cannot carry an answer (rename it in the
        survey), extra vars that JSON cannot hold, such as a number too
        large for JSON (`1e999`), in the extra vars or in a password answer,
        or the template's approval rule: too few eligible approvers besides
        the user the trigger runs as, a rule that no longer exists, or a
        rule that changed while the job was being launched (an admin fixes
        the rule, or the call is sent again). The rule of the template's
        inventory refuses it the same way, and a launch waits for one rule
        only: a template whose own rule differs from its inventory's, an
        inventory that no longer exists, and an inventory, or its rule,
        that changed while the job was being launched answer 422 too, with
        the messages of `JobLaunchRejected`. A `limit` or a `verbosity`
        the job record does not take (longer than 255 characters; below 0
        or above 5; a list or an object) is refused with the record's
        messages; releases up to 2.9.0 answered 500 for it, or took a list
        or an object as the verbosity for a number.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TriggerRejectedError' }
          examples:
            invalidInput:
              summary: A verbosity the job record does not take
              value:
                error: Verbosity must be no greater than 5.
            placeholder:
              summary: A password answer was the placeholder
              value:
                error: 'The value of "db_password" is the placeholder $encrypted$; send the real value.'
            unusableName:
              summary: A password field needs another name
              value:
                error: 'Survey field "db[pw]" has a name that cannot be used for a password answer; rename it in the survey before launching.'
            numberTooLarge:
              summary: A number JSON cannot hold, in a password answer
              value:
                error: 'The password answers cannot be stored: they contain a number too large for JSON.'
            tooFewApprovers:
              summary: Too few approvers besides the user the trigger runs as
              value:
                error: 'Approval rule "deploy-prod" needs 1 approval(s) from users other than the one who launches, but only 0 of its approvers may decide on this job. An admin can add approvers to the rule.'
            ruleMissing:
              summary: The template's approval rule no longer exists
              value:
                error: 'The approval rule of job template #7 no longer exists. An admin can choose another rule.'
            rulesDiffer:
              summary: The template's own rule differs from the rule of its inventory
              value:
                error: "Job template #7 and its inventory #3 have different approval rules, and a launch waits for one rule only. An admin can remove the template's own rule or give it the inventory's rule."
            inventoryRuleMissing:
              summary: The approval rule of the template's inventory no longer exists
              value:
                error: 'The approval rule of inventory #3, which job template #7 uses, no longer exists. An admin can choose another rule.'
            inventoryMissing:
              summary: The template's inventory no longer exists
              value:
                error: 'Inventory #3 of job template #7 no longer exists. Choose another inventory for the template.'
            inventoryChanged:
              summary: The template got another inventory meanwhile
              value:
                error: 'The inventory of job template #7 changed while the job was being launched. Launch it again.'
            inventoryRuleChanged:
              summary: The approval rule of the template's inventory changed meanwhile
              value:
                error: 'The approval rule of inventory #3, which job template #7 uses, changed while the job was being launched. Launch it again.'
    WorkflowTriggerLaunchRejected:
      description: |
        The workflow launch was refused for a reason the caller or an admin
        can fix, and no run was created. `error` says why: extra vars that
        are not a JSON object, that JSON cannot hold (`The extra vars cannot
        be stored: ...` or `The password answers cannot be stored: ...`) or
        that are too large (`The extra vars are too large: a run stores at
        most 65535 bytes of them as JSON.`), `$encrypted$` sent as a
        password answer of a job step's template, a workflow without steps,
        a workflow deleted meanwhile, an approval that could never be
        granted, or a job step whose job template and inventory have
        different approval rules (see `WorkflowLaunchRejected`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TriggerRejectedError' }
          examples:
            notAnObject:
              summary: The extra vars are not a JSON object
              value:
                error: 'The extra vars must be a JSON object, such as {"env": "prod"}.'
            placeholder:
              summary: A password answer was the placeholder
              value:
                error: 'The value of "db_password" is the placeholder $encrypted$; send the real value.'
            tooFewApprovers:
              summary: An approval that could never be granted
              value:
                error: 'Step "Release approval": approval rule "deploy-prod" needs 1 approval(s) from users other than the one who launches, but only 0 of its approvers may decide. An admin can add approvers to the rule.'
            rulesDiffer:
              summary: A job step whose job template and inventory have different approval rules
              value:
                error: "Step \"Deploy\": its job template and its inventory have different approval rules, and a launch waits for one rule only. An admin can remove the template's own rule or give it the inventory's rule."
            noSteps:
              summary: The workflow has no steps
              value:
                error: 'Workflow template #5 has no steps.'
            deleted:
              summary: The workflow was deleted meanwhile
              value:
                error: 'Workflow template #5 was deleted.'
    TriggerLaunchFailed:
      description: |
        The launch failed for another reason, for example a database error.
        The reason is in the application log.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TriggerError' }
          example:
            error: Launch failed.
    TriggerTokenCreatedResponse:
      description: |
        The new trigger token and the user the trigger now runs as. The
        token appears in no other response; the response is sent with
        `Cache-Control: no-store`.
      headers:
        Cache-Control:
          description: Always `no-store`, as the body holds a secret.
          schema: { type: string, enum: [no-store] }
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/TriggerTokenCreated' }
          example:
            data: { token: "<trigger-token>", trigger_user_id: 7 }
    TriggerTokenRevokedResponse:
      description: The template has no trigger token now.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/TriggerTokenRevoked' }
          example:
            data: { revoked: true }
    JobLaunchRejected:
      description: |
        Nothing was launched or stored. `job_template_id` is missing, the
        launch would leave a password answer unprotected (`$encrypted$` sent
        as an answer, or a password field of the template whose name cannot
        carry an answer: rename it in the survey), JSON cannot hold the
        extra vars, such as a number too large for JSON (`1e999`; the
        message says whether that is in the extra vars or in a password
        answer), or the template's approval rule refuses it: fewer eligible
        approvers besides the caller than the rule requires (an admin adds
        approvers to the rule), a rule that no longer exists (an admin
        chooses another), a template deleted meanwhile, or a rule that
        changed while the job was being launched (launch it again). The
        rule of the template's inventory refuses it the same way, and a
        launch waits for one rule only: a template whose own rule differs
        from its inventory's (an admin removes the template's rule or gives
        it the inventory's), an inventory rule that no longer exists, an
        inventory that no longer exists (choose another inventory for the
        template), and a template whose inventory, or that inventory's rule,
        changed while the job was being launched (launch it again). A
        `limit` or a `verbosity` the job record does not take (longer than
        255 characters; below 0 or above 5; a list or an object) is refused
        with the record's messages, and `error.fields` names each such
        field with its message.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/JobLaunchError' }
          examples:
            invalidInput:
              summary: A verbosity the job record does not take
              value:
                error:
                  message: Verbosity must be no greater than 5.
                  fields:
                    verbosity: Verbosity must be no greater than 5.
            placeholder:
              summary: A password answer was the placeholder
              value:
                error:
                  message: 'The value of "db_password" is the placeholder $encrypted$; send the real value.'
            unusableName:
              summary: A password field needs another name
              value:
                error:
                  message: 'Survey field "db[pw]" has a name that cannot be used for a password answer; rename it in the survey before launching.'
            numberTooLarge:
              summary: A number JSON cannot hold, in the extra vars
              value:
                error:
                  message: 'The extra vars cannot be stored: they contain a number too large for JSON.'
            missingTemplate:
              summary: No job template given
              value:
                error:
                  message: job_template_id is required.
            tooFewApprovers:
              summary: Too few approvers besides the caller
              value:
                error:
                  message: 'Approval rule "deploy-prod" needs 1 approval(s) from users other than the one who launches, but only 0 of its approvers may decide on this job. An admin can add approvers to the rule.'
            ruleMissing:
              summary: The template's approval rule no longer exists
              value:
                error:
                  message: 'The approval rule of job template #7 no longer exists. An admin can choose another rule.'
            templateDeleted:
              summary: The template was deleted meanwhile
              value:
                error:
                  message: 'Job template #7 was deleted.'
            ruleChanged:
              summary: The template's approval rule changed meanwhile
              value:
                error:
                  message: 'The approval rule of job template #7 changed while the job was being launched. Launch it again.'
            rulesDiffer:
              summary: The template's own rule differs from the rule of its inventory
              value:
                error:
                  message: "Job template #7 and its inventory #3 have different approval rules, and a launch waits for one rule only. An admin can remove the template's own rule or give it the inventory's rule."
            inventoryRuleMissing:
              summary: The approval rule of the template's inventory no longer exists
              value:
                error:
                  message: 'The approval rule of inventory #3, which job template #7 uses, no longer exists. An admin can choose another rule.'
            inventoryMissing:
              summary: The template's inventory no longer exists
              value:
                error:
                  message: 'Inventory #3 of job template #7 no longer exists. Choose another inventory for the template.'
            inventoryChanged:
              summary: The template got another inventory meanwhile
              value:
                error:
                  message: 'The inventory of job template #7 changed while the job was being launched. Launch it again.'
            inventoryRuleChanged:
              summary: The approval rule of the template's inventory changed meanwhile
              value:
                error:
                  message: 'The approval rule of inventory #3, which job template #7 uses, changed while the job was being launched. Launch it again.'
    JobTemplateDeletedResponse:
      description: The job template was deleted; what the delete resolved.
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/JobTemplateDeletion' }
          example:
            data: { deleted: true, canceled_jobs: 2, disabled_schedules: 1 }
    ApprovalSummaryResult:
      description: |
        The approval summary of the period, counting only the requests the
        caller may see. With `format=csv` the body is raw CSV.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  filters:
                    type: object
                    description: Echo of the filter parameters that were applied
                  result: { $ref: '#/components/schemas/ApprovalSummary' }
        text/csv:
          schema:
            type: string
            description: CSV export (only when `format=csv`)

  schemas:
    ChangePasswordInput:
      type: object
      required: [current_password, new_password, new_password_confirm]
      properties:
        current_password: { type: string, description: "User's current password" }
        new_password: { type: string, minLength: 8, maxLength: 72, description: "New password (8-72 characters)" }
        new_password_confirm: { type: string, description: "Must match new_password" }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
    JobLaunchError:
      type: object
      description: |
        Why `POST /api/v1/jobs` launched nothing (422). `fields` is there
        only for a `limit` or a `verbosity` that the job record does not
        take: each such field with the record's message, which `message`
        joins.
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: { type: string }
            fields:
              type: object
              description: The refused launch fields (`limit`, `verbosity`), each with its message.
              additionalProperties: { type: string }
    FrameworkError:
      type: object
      description: |
        How the framework renders a request body that is not valid JSON
        (400), a missing or invalid token (401), an unknown resource `{id}`
        in the path or a role's `{name}` (404), and an unexpected error (500).
      properties:
        name: { type: string, example: Not Found }
        message: { type: string, example: 'Workflow template #5 not found.' }
        code: { type: integer, example: 0 }
        status: { type: integer, example: 404 }
    PaginationMeta:
      type: object
      properties:
        total:    { type: integer }
        page:     { type: integer }
        per_page: { type: integer }
        pages:    { type: integer }

    Project:
      type: object
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string, nullable: true }
        scm_type:    { type: string, enum: [manual, git] }
        scm_url:
          type: string
          nullable: true
          description: |
            The git repository URL. A caller who may update the project
            (`project.update` and operator access to it) gets it in full, so
            a `GET` and `PUT` round trip keeps it. Every other caller gets it
            with its userinfo (`user:password@`, or a token before `@`)
            replaced by `***@`, such as
            `https://***@git.example.com/org/repo.git`.
          example: https://git.example.com/org/repo.git
        scm_branch:  { type: string, nullable: true }
        status:      { type: string, enum: [new, syncing, synced, error] }
        last_synced_at: { type: integer, nullable: true, description: Unix timestamp }
        created_at:  { type: integer, description: Unix timestamp }
        vault_password_source:
          type: string
          enum: [ansilume, repository]
          description: |
            `ansilume`: runners use only the job template's vault password and
            ignore the vault settings of the repository's ansible.cfg (default
            for new projects). `repository`: runners also apply them (projects
            created before 2.8). Runners older than 2.8 always behave like
            `repository`.
        vault_scanned_at: { type: integer, nullable: true, description: Unix timestamp of the last vault scan }
    ProjectVault:
      type: object
      properties:
        password_source: { type: string, enum: [ansilume, repository] }
        password_source_label: { type: string, example: Ansilume only }
        scanned_at: { type: integer, nullable: true }
        commit: { type: string, nullable: true, description: "The commit the scan saw, for git projects" }
        error: { type: string, nullable: true, description: "Why there is no scan, e.g. no checkout yet" }
        truncated: { type: boolean, description: "The scan stopped at a limit (files, size, entries or time)" }
        files_scanned: { type: integer }
        repository_settings:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ProjectVaultSettings' }]
        findings: { type: array, items: { $ref: '#/components/schemas/ProjectVaultFinding' } }
        vault_ids: { type: array, items: { type: string }, example: [prod] }
        entries: { type: array, items: { $ref: '#/components/schemas/ProjectVaultEntry' } }
        templates: { type: array, items: { $ref: '#/components/schemas/ProjectVaultTemplate' } }
        runners_without_support:
          type: array
          description: |
            In `ansilume` mode, runners of the project's runner groups that are
            too old to ignore the repository's vault settings. Empty without
            `runner-group.view`; runners_without_support_count still counts them.
          items: { $ref: '#/components/schemas/ProjectVaultRunner' }
        runners_without_support_count: { type: integer, description: "How many such runners there are, whatever the viewer may see" }
    ProjectVaultSettings:
      type: object
      description: Vault settings found in the repository's ansible.cfg.
      properties:
        vault_password_file: { type: string, nullable: true }
        vault_identity_list: { type: string, nullable: true }
        ask_vault_pass: { type: boolean }
        vault_id_match: { type: boolean }
        vault_encrypt_salt: { type: boolean }
    ProjectVaultFinding:
      type: object
      properties:
        code:
          type: string
          enum: [password_file_committed, password_script, ask_vault_pass, vault_id_match, encrypt_salt, malformed, truncated]
        path: { type: string, nullable: true }
        message: { type: string }
    ProjectVaultEntry:
      type: object
      properties:
        path: { type: string, example: inventories/prod/group_vars/all/vault.yml }
        kind: { type: string, enum: [file, inline] }
        line: { type: integer, nullable: true, description: First line of an inline value }
        key: { type: string, nullable: true, description: Variable name of an inline value }
        vault_id: { type: string, nullable: true, description: Vault ID from a format 1.2 header }
        format_version: { type: string, nullable: true, example: '1.2' }
        error: { type: string, nullable: true, description: Why Ansible cannot read it }
    ProjectVaultTemplate:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        status:
          type: string
          nullable: true
          enum: [ok, mismatch, missing_password, unusable_password, repo_managed, no_files, stale, damaged, incomplete]
          description: |
            `ok`: the vault password opens every encrypted file and value the
            template probably loads. `mismatch`: it does not open some (or, with
            vault_id_match in the repository's ansible.cfg in `repository` mode,
            cannot be tried on them). `missing_password`: the template has none.
            `unusable_password`: its secret cannot be used. `repo_managed`: the
            repository's ansible.cfg supplies passwords Ansilume cannot check.
            `no_files`: nothing encrypted to load. `stale`: the checkout changed
            since the scan, or the check is from an older scan. `damaged`: some
            of them are damaged, Ansible cannot read them whatever the password.
            `incomplete`: not everything could be checked, see
            incomplete_reason. null: not checked yet.
        incomplete_reason:
          type: string
          nullable: true
          enum: [scan_limit, time_limit, file_name]
          description: |
            For `incomplete`. `scan_limit`: the scan stopped at a limit, so it
            may have missed files. `time_limit`: the check ran out of time.
            `file_name`: file names that are not valid UTF-8 (listed in unopened).
        credential:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string, nullable: true, description: "null without credential.view or job-template.view" }
        relevant_count: { type: integer }
        unopened_count:
          type: integer
          description: |
            How many entries are behind the status: those the vault password
            does not open (`mismatch`, `repo_managed`), the damaged ones
            (`damaged`), those with unreadable file names (`incomplete`).
        unopened:
          type: array
          description: "The first of them (at most 40)"
          items:
            type: object
            properties:
              path: { type: string }
              line: { type: integer, nullable: true }
              key: { type: string, nullable: true }
              reason:
                type: string
                nullable: true
                enum: [vault_id_match]
                description: "vault_id_match: the password is not tried on this vault ID. null: the password does not open it"
        checked_at: { type: integer, nullable: true }
    ProjectVaultRunner:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        group: { type: string, nullable: true }
        software_version: { type: string, nullable: true }
    ProjectList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Project' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Inventory:
      type: object
      description: An inventory as the list gives it, without `content` and `source_path` (see `InventoryDetail`).
      required: [id, name, description, inventory_type, project_id, approval_rule_id, approval_rule_name, created_at, updated_at]
      properties:
        id:             { type: integer }
        name:           { type: string }
        description:    { type: string, nullable: true }
        inventory_type: { type: string, enum: [static, dynamic, file] }
        project_id:     { type: integer, nullable: true }
        approval_rule_id:
          type: integer
          nullable: true
          description: |
            The approval rule every launch of every job template on this
            inventory waits for; null for none. Only admins
            (`approval-rule.update`) set, change or remove it, and while it
            is set only they change the inventory, but for its `name` and
            `description`, delete it, and give a job template this
            inventory (see `PUT /api/v1/inventories/{id}`). A job template
            on it may have no rule of its own, or only this one.
          example: 3
        approval_rule_name:
          type: string
          nullable: true
          description: The name of that rule; null for none. Rule names are not unique.
          example: deploy-prod
        created_at:     { type: integer }
        updated_at:     { type: integer }
    InventoryDetail:
      description: |
        An inventory with its hosts, or where its hosts come from: what
        `GET /api/v1/inventories/{id}` and the answers of `POST` and `PUT`
        give, to the users who may see the inventory's project. The list
        leaves `content` and `source_path` out.
      allOf:
        - $ref: '#/components/schemas/Inventory'
        - type: object
          required: [content, source_path]
          properties:
            content:
              type: string
              nullable: true
              description: |
                The hosts of a static inventory, as YAML text, or as INI text
                stored before the YAML check (the seeded selftest and demo
                inventories hold `[local]` and
                `localhost ansible_connection=local`); null when none were
                stored.
            source_path:
              type: string
              nullable: true
              description: |
                The inventory file, script or plugin configuration of a file
                or dynamic inventory, a path in the repository of the job
                template's project, read when a runner claims a job; null
                when none was stored.
    InventoryView:
      description: |
        What `GET /api/v1/inventories/{id}` answers: the inventory's detail
        and `used_by`, the job templates that use it, as the Job templates
        card of the inventory's page shows them to the caller. The answers
        of `POST` and `PUT` are the detail without `used_by`.
      allOf:
        - $ref: '#/components/schemas/InventoryDetail'
        - type: object
          required: [used_by]
          properties:
            used_by: { $ref: '#/components/schemas/InventoryUsage' }
    InventoryInput:
      type: object
      required: [name, inventory_type]
      description: |
        `created_by` is not accepted: the caller who creates the inventory
        is its creator. A field below that holds a list or an object answers
        422 (`project_id must be a single value, not a list or an object.`),
        and nothing is written.
      properties:
        name:           { type: string, maxLength: 128 }
        description:    { type: string, nullable: true, maxLength: 1000 }
        inventory_type: { type: string, enum: [static, dynamic, file] }
        content:
          type: string
          maxLength: 262144
          description: |
            Required when inventory_type = static: the hosts as a YAML
            mapping, such as an `all` group with its `hosts`. Content the
            request brings is checked: on a create, when the type changes, and
            when it differs from the stored content in more than its line
            endings (CRLF, CR and LF count as the same). Content stored before
            the check, such as the INI of the seeded selftest and demo
            inventories, stays as it is while the name, the description or
            the approval rule change, also when the body sends it back
            unchanged; to change it, send a YAML mapping.
        source_path:
          type: string
          maxLength: 512
          description: |
            Required when inventory_type = file, and for a dynamic inventory
            with an approval rule (422 `A dynamic inventory with an approval
            rule needs a source path: without one, jobs use the default
            inventory of Ansible or of the repository's ansible.cfg, which no
            rule gates.`).
        project_id:
          type: integer
          nullable: true
          description: |
            The project; null or `""` for none (`""` is the same as null, so
            it is no change of an inventory without a project).
        approval_rule_id:
          type: integer
          nullable: true
          description: |
            The approval rule that every launch of every job template on the
            inventory waits for; null or `""` for none, and text with a whole
            number such as `"3"` is that number. Only admins
            (`approval-rule.update`) set, change or remove it: another value
            than the stored one, `null` and `""` included, answers 403 `Only
            admins may assign or remove an approval rule: that needs
            approval-rule.update.` for everyone else, and nothing is
            written; sending the stored value again, or leaving the field
            out, is allowed. For admins, an ID that names no rule answers 422
            `The selected approval rule does not exist.`, and a value that is
            no whole number 422 `Approval rule must be an integer.` On an
            update, live job templates on the inventory with another rule of
            their own answer 422 `Job templates that use this inventory have
            another approval rule of their own: "deploy-web". A launch waits
            for one rule only, so give them this rule or none first.`
          example: 3
    InventoryList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Inventory' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    InventoryUsage:
      type: object
      description: |
        Which job templates use an inventory. An inventory is in use while
        live job templates use it or deleted ones still refer to it, and
        cannot be deleted then. The list holds the live job templates the
        caller may see, each with its own approval rule; the hidden count
        says how many more live ones there are, and the deleted count how
        many deleted job templates keep the inventory, for the history of
        their jobs, until their project is deleted.
      required: [in_use, job_templates, hidden_job_template_count, deleted_job_template_count]
      properties:
        in_use: { type: boolean }
        job_templates:
          type: array
          items:
            type: object
            required: [id, name, project_id, project_name, approval_rule_id, approval_rule_name]
            properties:
              id: { type: integer }
              name: { type: string }
              project_id: { type: integer }
              project_name: { type: string, nullable: true }
              approval_rule_id: { type: integer, nullable: true, description: "The job template's own approval rule; null for none." }
              approval_rule_name: { type: string, nullable: true }
        hidden_job_template_count: { type: integer }
        deleted_job_template_count: { type: integer }
    InventoryInUseError:
      type: object
      properties:
        error:
          type: object
          required: [message, used_by]
          properties:
            message:
              type: string
              example: 'Inventory "web-prod" is in use by 1 job template(s). Point its job templates at another inventory first. A deleted job template keeps its inventory for the history of its jobs until its project is deleted, so deleting the template does not free it.'
            used_by: { $ref: '#/components/schemas/InventoryUsage' }

    Credential:
      type: object
      description: Secret material is never returned by the API.
      properties:
        id:              { type: integer }
        name:            { type: string }
        description:     { type: string, nullable: true }
        credential_type: { type: string, enum: [ssh_key, username_password, vault, token] }
        username:        { type: string, nullable: true }
        env_var_name:    { type: string, nullable: true, description: "Environment variable a token credential is exposed as. null means ANSILUME_CREDENTIAL_TOKEN." }
        created_at:      { type: integer }
        updated_at:      { type: integer }
    CredentialInput:
      type: object
      required: [name, credential_type]
      properties:
        name:            { type: string, maxLength: 128 }
        description:     { type: string, nullable: true }
        credential_type: { type: string, enum: [ssh_key, username_password, vault, token] }
        username:        { type: string, nullable: true }
        env_var_name:    { type: string, nullable: true, maxLength: 128, pattern: '^[A-Z_][A-Z0-9_]*$', description: "Token credentials only. Blank or null uses ANSILUME_CREDENTIAL_TOKEN." }
        secrets:
          type: object
          description: |
            Secret fields keyed by name. Only the key of `credential_type`
            counts; keys of other types are ignored. Blank values count as not
            provided. On create the key is required; on update a blank or
            missing key keeps the stored secret.

              * `ssh_key`           → `private_key` (PEM)
              * `username_password` → `password`
              * `vault`             → `vault_password`
              * `token`             → `token`
          additionalProperties: { type: string }
    CredentialList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Credential' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    CredentialDetail:
      allOf:
        - $ref: '#/components/schemas/Credential'
        - type: object
          properties:
            secret_status:
              type: string
              enum: [ok, incomplete, undecryptable]
              description: |
                `ok`: the secret of the type is stored. `incomplete`: it is
                missing, as in credentials saved before validation existed;
                jobs get no secret from it. `undecryptable`: it cannot be
                decrypted, usually because APP_SECRET_KEY changed; jobs that
                use it fail before they start.
            used_by: { $ref: '#/components/schemas/CredentialUsage' }
    CredentialUsage:
      type: object
      description: The lists only hold what the caller may see; the hidden counts cover the rest.
      properties:
        in_use: { type: boolean }
        job_templates:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              project_id: { type: integer }
              project_name: { type: string, nullable: true }
              role: { type: string, enum: [primary, additional] }
        projects:
          type: array
          description: Projects that use the credential to clone their repository.
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        hidden_job_template_count: { type: integer }
        hidden_project_count: { type: integer }
        pending_job_count: { type: integer, description: "Jobs that have not started yet (pending, queued or waiting for approval) and need the credential." }
    VaultAssignmentCandidate:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        project_id: { type: integer }
        project_name: { type: string, nullable: true }
        current:
          type: string
          enum: [none, this, other, multiple]
          description: The template's vault passwords now. `multiple` marks a template with more than one.
        vaults:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
    VaultAssignmentInput:
      type: object
      required: [job_template_ids]
      properties:
        job_template_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: integer, minimum: 1 }
    VaultAssignmentItem:
      type: object
      properties:
        job_template_id: { type: integer }
        name: { type: string }
        status:
          type: string
          enum: [assigned, replaced, unchanged, failed]
        replaced:
          type: array
          description: The vault passwords this one replaced or detached.
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        error: { type: string, nullable: true, description: "Why the template could not be saved (status failed)." }
    VaultAssignmentResult:
      type: object
      properties:
        credential_id: { type: integer }
        credential_name: { type: string }
        results: { type: array, items: { $ref: '#/components/schemas/VaultAssignmentItem' } }
        summary:
          type: object
          properties:
            assigned: { type: integer }
            replaced: { type: integer }
            unchanged: { type: integer }
            failed: { type: integer }
    CredentialInUseError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              example: 'Credential "deploy-key" is in use by 2 job template(s). Pass force=1 to delete it anyway; it will be detached from all of them.'
            used_by: { $ref: '#/components/schemas/CredentialUsage' }
    VaultAssignmentError:
      type: object
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: 'You may not change job template(s) #12, #15.'
            job_template_ids:
              type: array
              items: { type: integer }
              example: [12, 15]
              description: >-
                The job template IDs the error is about: not found (422) or
                not changeable (403). Absent for errors about the credential
                or the shape of the list.
    JobTemplateRefError:
      type: object
      description: |
        An error that can name the job templates it is about, as for workflow
        steps. Job templates that do not exist, are deleted or belong to a
        project the caller cannot see are reported as not found (422);
        visible ones the caller may not operate as forbidden (403).
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: 'Job template(s) not found: #12.'
            job_template_ids:
              type: array
              items: { type: integer }
              example: [12]
              description: >-
                The job template IDs the error is about. Absent when the error
                is about something else, such as a missing permission or an
                invalid step.

    JobTemplate:
      type: object
      properties:
        id:              { type: integer }
        name:            { type: string }
        description:     { type: string, nullable: true }
        project_id:      { type: integer }
        project_name:    { type: string, nullable: true }
        inventory_id:    { type: integer }
        inventory_name:  { type: string, nullable: true }
        runner_group_id: { type: integer, nullable: true }
        credential_id:   { type: integer, nullable: true, description: "The primary credential." }
        credential_ids:
          type: array
          items: { type: integer }
          description: The additional credentials in precedence order, after the primary one.
        credentials:
          type: array
          description: All credentials in precedence order, primary first. Never includes secrets.
          items: { $ref: '#/components/schemas/JobTemplateCredential' }
        approval_rule_id:
          type: integer
          nullable: true
          description: |
            The approval rule that gates every launch of the template: each
            job waits for the rule's approvers (status `pending_approval`)
            before it runs. null for none. Only admins
            (`approval-rule.update`) set, change or remove it, and while it
            is set only they change what the template runs: everyone else
            may change only its `name` and `description` (see
            `PUT /api/v1/job-templates/{id}`). This is the template's own
            rule; the rule of its inventory gates its launches too, see
            `approval_gate`.
          example: 3
        approval_rule_name:
          type: string
          nullable: true
          description: The name of that rule; null for none. Rule names are not unique.
          example: deploy-prod
        approval_gate:
          description: |
            The approval rule every launch of the template waits for, and
            what requires it: the template's own rule (`job_template`, also
            when its inventory has the same rule), else the rule of its
            inventory (`inventory`). null when its launches wait for no
            approval. Read-only: rules are assigned with `approval_rule_id`
            of the template or of its inventory. While it is set, only
            admins change what the template runs.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/JobTemplateApprovalGate' }]
        playbook:        { type: string }
        verbosity:       { type: integer }
        forks:           { type: integer }
        become:          { type: boolean }
        become_method:   { type: string, nullable: true }
        become_user:     { type: string, nullable: true }
        limit:           { type: string, nullable: true }
        tags:            { type: string, nullable: true }
        skip_tags:       { type: string, nullable: true }
        has_survey:
          type: boolean
          description: |
            Whether the template has survey fields. Neither the survey
            definition nor the template's extra vars are returned.
        has_trigger_token:
          type: boolean
          description: |
            Whether the template has an inbound trigger token. Only callers
            who may change the template (`job-template.update` and operator
            access to its project) get this field, as only they see the
            trigger on the template's page; it is absent for everyone else.
            The token itself is never returned; it is generated and revoked
            on the template's page.
        trigger_user_id:
          type: integer
          nullable: true
          description: |
            The user a trigger launch runs as: whoever generated the current
            token, or the template's creator for tokens generated before
            Ansilume recorded that. This user is the launcher of the
            trigger's jobs and never approves them. null without a token.
            Like `has_trigger_token`, only callers who may change the
            template get this field.
          example: 7
        warnings:
          type: array
          description: Problems jobs of this template may run into. They never block a launch.
          items: { $ref: '#/components/schemas/JobTemplateWarning' }
        created_by:
          type: integer
          description: |
            User ID of the creator. A trigger token generated before Ansilume
            recorded who generated it runs as this user.
        created_at:      { type: integer }
        updated_at:      { type: integer }
    JobTemplateApprovalGate:
      type: object
      description: |
        The approval rule every launch of a job template waits for (see
        `approval_gate` of `JobTemplate`). A launch waits for one rule only:
        when the template's own rule and its inventory's differ, this names
        the template's own rule, and every launch is refused (422) until an
        admin removes the template's rule or gives it the inventory's.
      required: [approval_rule_id, approval_rule_name, required_by]
      properties:
        approval_rule_id: { type: integer, example: 3 }
        approval_rule_name:
          type: string
          nullable: true
          description: The rule's name; null only when the rule no longer exists, which refuses every launch until an admin chooses another rule.
          example: deploy-prod
        required_by:
          type: string
          enum: [job_template, inventory]
          description: |
            What requires the approval: `job_template` for the template's
            own rule (also when its inventory has the same rule),
            `inventory` for the rule of its inventory. The approval request
            of each launch records it (`required_by` of `ApprovalRequest`).
          example: inventory
    JobTemplateWarning:
      type: object
      properties:
        code:
          type: string
          enum: [multiple_vault_credentials, inventory_other_project, vault_password_mismatch, vault_password_missing, vault_file_damaged, vault_check_incomplete]
          description: |
            `multiple_vault_credentials`: more than one vault password; Ansible
            only gets the first. `inventory_other_project`: a file or dynamic
            inventory of another project, which the runner never reads.
            `vault_password_mismatch`: the vault password does not open some
            encrypted files or values the template probably loads, or has no
            usable secret. `vault_password_missing`: the template probably
            loads encrypted content but has no vault password.
            `vault_file_damaged`: encrypted files or values it probably loads
            are damaged; Ansible cannot read them. `vault_check_incomplete`:
            the check could not cover everything (a limit of the scan or the
            check, or file names that are not UTF-8). The vault warnings come
            from the project's last vault scan; a check from an older scan
            gives none.
        message: { type: string }
        credential_ids:
          type: array
          items: { type: integer }
          description: For multiple_vault_credentials, the vault passwords that are ignored; for vault_password_mismatch, the checked one.
    JobTemplateCredential:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        credential_type: { type: string, enum: [ssh_key, username_password, vault, token] }
        role: { type: string, enum: [primary, additional] }
    JobTemplateList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/JobTemplate' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    JobTemplateDeletion:
      type: object
      required: [deleted, canceled_jobs, disabled_schedules]
      properties:
        deleted:
          type: boolean
          enum: [true]
        canceled_jobs:
          type: integer
          description: |
            The waiting jobs (pending, queued, pending_approval) this delete
            canceled. A job whose cancel failed is not counted; the
            maintenance run cancels it.
        disabled_schedules:
          type: integer
          description: The enabled schedules this delete disabled.
    JobCancelConflictError:
      type: object
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: 'Job #42 was not canceled: it is already succeeded.'
            status:
              type: string
              enum: [pending, queued, running, succeeded, failed, canceled, timed_out, pending_approval, rejected]
              description: |
                The job's status now. Set only when the job finished while it
                was being canceled; the message then names the status in
                words, such as `timed out`.

    Job:
      type: object
      properties:
        id:              { type: integer }
        job_template_id: { type: integer, nullable: true }
        template_name:   { type: string, nullable: true }
        inventory_id:
          type: integer
          nullable: true
          description: |
            The inventory the job was launched with, as its launch recorded
            it: also after its job template got another inventory, or the
            inventory was renamed or deleted. null for a job without one,
            such as the placeholder job of a workflow approval step.
          example: 3
        inventory_name:
          type: string
          nullable: true
          description: |
            That inventory's name when the job was launched; for a job
            launched before 2.12.0, its name now. null when the job has no
            inventory, and for a job launched before 2.12.0 whose inventory
            was deleted since.
          example: web-prod
        status:
          type: string
          enum: [pending, queued, running, succeeded, failed, canceled, timed_out, pending_approval, rejected]
        launched_by:     { type: string, nullable: true, description: "Username of whoever launched the job." }
        extra_vars:
          type: object
          nullable: true
          additionalProperties: true
          description: |
            The extra vars the job was launched with: the template's, the
            survey answers and the launch's own, merged. Password answers
            (values whose key is a password field of the template's survey)
            show as `$encrypted$`; only the runner that runs the job gets
            them. Do not send these extra vars back as a new launch:
            `$encrypted$` as a password answer is refused. Jobs from before
            the update to encrypted answers show `$encrypted$` once the
            update has reached them (see docs/updating.md).
          example: { app_env: production, db_password: "$encrypted$" }
        limit:           { type: string, nullable: true }
        verbosity:       { type: integer, nullable: true }
        check_mode:      { type: boolean }
        exit_code:       { type: integer, nullable: true, description: "-1 when the job ended without an exit code from ansible, for example after a timeout or a failure before execution." }
        execution_command:
          type: string
          nullable: true
          description: |
            The `ansible-playbook` command line the server built when a runner
            claimed the job, for display; null before the claim. Password
            answers show as `$encrypted$` in its `--extra-vars` JSON. A runner
            with the `secret_extra_vars` capability gets the answers in a
            private file and adds `--extra-vars @<file>` itself. For a job
            with password answers that a runner without it claimed, which
            gets the answers inline, the command starts with
            `/usr/bin/env ANSIBLE_VERBOSITY=0` and has at most `-vvv`, because
            ansible-playbook prints its whole command line from verbosity 4 on.
            Also null for jobs from before that update whose command could not
            be masked.
          example: 'ansible-playbook -i __INVENTORY_TMP__ /var/www/runtime/projects/3/site.yml --forks 5 --extra-vars {"app_env":"production","db_password":"$encrypted$"}'
        artifact_count:  { type: integer }
        queued_at:       { type: integer, nullable: true }
        started_at:      { type: integer, nullable: true }
        finished_at:     { type: integer, nullable: true }
        created_at:      { type: integer }
    JobDetail:
      allOf:
        - $ref: '#/components/schemas/Job'
        - type: object
          properties:
            credentials:
              type: array
              description: The job's credentials as launched, primary first. Never includes secrets.
              items: { $ref: '#/components/schemas/JobCredential' }
            approval_request_id:
              type: integer
              nullable: true
              description: |
                The approval request the job waits or waited for (see
                `GET /api/v1/approvals/{id}`); null when it has none, or the
                caller may not see it.
              example: 12
            workflow_job_id:
              type: integer
              nullable: true
              description: |
                The workflow run the job was created for: the job of a job
                step, or the placeholder job of an approval step, which holds
                the step's approval request and never runs. null when the job
                belongs to no workflow step, or the caller may not view that
                workflow.
              example: 17
            workflow_job_step_id:
              type: integer
              nullable: true
              description: |
                The step execution of that run the job was created for (`id`
                of `WorkflowJobStep`); null as `workflow_job_id`.
              example: 31
    JobCredential:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, nullable: true, description: "The name at launch time." }
        credential_type: { type: string, nullable: true }
        role: { type: string, enum: [primary, additional] }
        deleted: { type: boolean, description: "The credential was deleted after the launch." }
    JobLaunchInput:
      type: object
      required: [job_template_id]
      properties:
        job_template_id: { type: integer }
        template_id: { type: integer, deprecated: true, description: "Older name of job_template_id, still accepted." }
        extra_vars:
          description: |
            Extra vars for this run, merged over the template's. An object or
            a JSON string. A value whose top-level key is a password field of
            the template's survey is a password answer: it is stored only
            encrypted. `$encrypted$` as such a value is refused with 422, so
            the `extra_vars` of an earlier job cannot be sent back as they are.
            A number JSON cannot hold, such as `1e999`, is refused with 422
            in either form. Text that is not UTF-8, which only a form-encoded
            body can carry, is refused with 422 in the object form
            (`extra_vars[<key>]=...`); a string that is not valid JSON, such
            text included, is ignored, and the job runs with the template's
            extra vars.
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: string }
        limit: { type: string, maxLength: 255, description: "Longer text, a list or an object is refused with 422 (error.fields)." }
        verbosity: { type: integer, minimum: 0, maximum: 5, description: "A value below 0 or above 5, a list or an object is refused with 422 (error.fields)." }
        check_mode: { type: boolean }
      example:
        job_template_id: 12
        extra_vars: { app_version: "1.4.2", db_password: "<database password>" }
        limit: web
    JobArtifact:
      type: object
      properties:
        id:           { type: integer }
        display_name: { type: string }
        mime_type:    { type: string }
        size_bytes:   { type: integer }
        previewable:  { type: boolean, description: "True for text/JSON/XML/YAML — fetch via /content endpoint." }
        image:        { type: boolean, description: "True for image/png|jpeg|gif|webp — fetch via /download?inline=1 to embed as <img>." }
        inline_frame: { type: boolean, description: "True for application/pdf — fetch via /download?inline=1 to embed in sandboxed <iframe>." }
        created_at:   { type: integer }
    ArtifactStorageStats:
      type: object
      properties:
        stats:
          type: object
          properties:
            total_bytes:    { type: integer, description: "Sum of all stored artifact bytes." }
            artifact_count: { type: integer }
            job_count:      { type: integer, description: "Number of distinct jobs that have at least one artifact." }
        top_jobs:
          type: array
          description: Top ten jobs by total artifact bytes, descending.
          items:
            type: object
            properties:
              job_id:         { type: integer }
              total_bytes:    { type: integer }
              artifact_count: { type: integer }
        config:
          type: object
          properties:
            retention_days:        { type: integer, description: "0 = keep forever." }
            max_file_size:         { type: integer, description: "Per-file byte cap." }
            max_artifacts_per_job: { type: integer }
            max_bytes_per_job:     { type: integer, description: "0 = unlimited." }
            max_total_bytes:       { type: integer, description: "Global cap; 0 = unlimited." }
            max_jobs_with_artifacts: { type: integer, description: "Keep only the N most recent jobs with artifacts; 0 = unlimited." }
    JobList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Job' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Schedule:
      type: object
      properties:
        id:              { type: integer }
        name:            { type: string }
        job_template_id: { type: integer }
        cron_expression: { type: string }
        timezone:        { type: string }
        extra_vars:
          type: string
          nullable: true
          description: |
            Extra vars of the scheduled jobs, a JSON object as text, as the
            schedule's edit form shows them; `null` when there are none.
            Password answers appear as `$encrypted$`; send them back
            unchanged to keep them (see `extra_vars` of `ScheduleInput`).
            Callers who may only view the schedule get the same text. A value
            whose key became a password field of the job template after it
            was stored appears as `$encrypted$` too; the schedule's next run,
            or the next save with `extra_vars`, stores it encrypted. Values
            under the exact name of a password field whose name cannot carry
            an answer appear as `$encrypted$` too; launches of such a
            template are refused until the field is renamed.
          example: '{"app_env": "production", "db_password": "$encrypted$"}'
        enabled:         { type: boolean }
        last_run_at:     { type: integer, nullable: true }
        next_run_at:     { type: integer, nullable: true }
        created_by:
          type: integer
          description: |
            User ID of the user the schedule runs as (**Runs as** in the web
            UI): its creator, or the user who last changed its job template,
            cron expression, timezone or extra vars, or enabled it. Scheduled
            jobs run as this user, who is their launcher and never approves
            them, and only while the user is active, holds `job.launch` and
            may operate the job template's project. A request body cannot set
            it.
        created_at:      { type: integer }
        updated_at:      { type: integer }
    ScheduleList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Schedule' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    NotificationTemplate:
      type: object
      description: >
        Global notification subscription. Fires on any listed event across the
        platform — no per-template pivot. Supported events (15):
        job.launched, job.succeeded, job.failed, job.canceled,
        workflow.launched, workflow.succeeded, workflow.failed, workflow.canceled, workflow.step_failed,
        approval.requested, approval.approved, approval.rejected,
        schedule.failed_to_launch, runner.offline, runner.recovered,
        project.sync_failed, project.sync_succeeded, webhook.invalid_token.
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string, nullable: true }
        channel:     { type: string, enum: [email, slack, teams, webhook, telegram, pagerduty] }
        events:
          type: array
          items: { type: string }
          description: Event names this template subscribes to.
        config:
          type: object
          description: |
            Channel-specific config. email → {emails:[]}, slack/teams →
            {webhook_url}, webhook → {url, headers?}, telegram → {bot_token,
            chat_id}, pagerduty → {routing_key}. Every channel secret is
            answered as `$encrypted$`, to every caller: the `bot_token` of
            telegram; the `webhook_url` of slack and teams; the `url` of
            webhook and the value of every one of its `headers` (the header
            names are shown); the `routing_key` of pagerduty. A key that is a
            secret of one channel is answered as `$encrypted$` in every
            config; an empty value (null or '') is answered as it is. The
            secrets are stored as entered: `$encrypted$` only stands in for
            them.
          example: { bot_token: '$encrypted$', chat_id: '-1001234567890' }
        subject_template: { type: string, nullable: true }
        body_template:    { type: string, nullable: true }
        created_by:  { type: integer }
        created_at:  { type: integer }
        updated_at:  { type: integer }
    NotificationTemplateInput:
      type: object
      required: [name, channel, events]
      properties:
        name:             { type: string, maxLength: 128 }
        description:      { type: string, nullable: true }
        channel:          { type: string, enum: [email, slack, teams, webhook, telegram, pagerduty] }
        events:           { type: string, description: 'Comma-separated event names' }
        config:
          description: |
            Channel-specific settings (see `config` of `NotificationTemplate`),
            as an object or as JSON text. `$encrypted$` at a secret's place
            keeps the stored value, so a `GET` and `PUT` round trip changes
            no secret. That holds only while the template keeps its channel,
            and for a header of a webhook channel only while `url` keeps its
            stored value. Otherwise, and on create, the answer is 422 and
            nothing is written; the message starts with the place of the
            secret: `bot_token has no stored value; enter the real value.`
            where nothing is stored, `webhook_url: the channel changed; enter
            the real value.` after a change of the channel, and
            `headers.Authorization: url changed; enter the real value.` for
            a header once `url` changed. A config that holds a number too
            large for JSON answers 422 `The config cannot be stored: it
            contains a number too large for JSON.`
          oneOf:
            - { type: object }
            - { type: string }
        subject_template: { type: string, nullable: true, maxLength: 512 }
        body_template:    { type: string, nullable: true }
    NotificationTemplateList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/NotificationTemplate' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    ProjectInput:
      type: object
      required: [name, scm_type]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true }
        scm_type: { type: string, enum: [manual, git] }
        scm_url:
          type: string
          nullable: true
          description: |
            The git repository URL. Credentials in its userinfo are stored as
            sent, and shown only to callers who may update the project;
            prefer an SCM credential (`scm_credential_id`). Each sync points
            the project's checkout at the URL as it is then, on the server
            and on runners, so a changed URL counts from the next sync; a
            runner older than 2.11.0 keeps the URL its checkout was cloned
            with until the checkout is removed.
        scm_branch:
          type: string
          nullable: true
          description: |
            The branch that syncs of a git project check out; git takes it for
            a branch name, never for one of its options. For git projects
            (`scm_type` `git` once the request is applied), a branch that
            starts with `-` or contains whitespace is refused: `POST` and
            `PUT` answer 422 `The branch cannot start with "-" or contain
            whitespace.` and save nothing. A git project saved with such a
            branch before 2.11.0 keeps it until it is changed; until then
            every `PUT` that sends no other branch and leaves it a git project
            answers that 422. The branch of a manual project is not checked,
            as no sync reads it; a `PUT` that makes a manual project with
            such a branch a git project answers that 422. An empty branch is
            not checked.
        scm_credential_id:
          type: integer
          nullable: true
          description: |
            The credential that syncs of a git project sign in with. For a git
            project (`scm_type` `git` once the request is applied), an SSH URL
            needs an SSH Key credential and an HTTPS URL a Token or
            Username/Password credential; another type answers 422 `SSH URLs
            require an SSH Key credential.` or `HTTPS URLs require a Token or
            Username/Password credential.` and saves nothing. The credential
            of a manual project is not checked against its URL, as no sync
            reads them. A credential that does not exist is refused with 422
            for every project.
        vault_password_source:
          type: string
          enum: [ansilume, repository]
          description: Defaults to `ansilume` for new projects.

    JobTemplateInput:
      type: object
      required: [name, project_id, inventory_id, playbook]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true }
        project_id: { type: integer }
        inventory_id: { type: integer, description: "A file or dynamic inventory must belong to project_id; static inventories work with any project." }
        credential_id: { type: integer, nullable: true, description: "The primary credential. Its username and key win over the additional ones." }
        credential_ids:
          type: array
          items: { type: integer }
          description: |
            The additional credentials in precedence order. Omit the key to
            keep the current ones; `[]` removes them all. The primary
            credential and duplicates are skipped. Unknown IDs are rejected
            with 422. At most one vault password across the primary and the
            additional credentials; more is rejected with 422.
        playbook: { type: string }
        extra_vars:
          type: string
          nullable: true
          description: |
            Default extra vars of every launch: a JSON object, as text. A
            top-level key that is the name of a password field of the survey
            is rejected with 422 `Remove "<key>" from Extra Vars: a password
            survey field cannot have a default; enter it at launch.` when the
            request changes the extra vars or the names of the password
            fields (one added, renamed, removed, or retyped to or from
            password). The extra vars change when their JSON value does: a
            key, or a value with its type (`"1"` and `1` differ, and so do a
            list and an object, and a whole number beyond the 64-bit range
            and the same digits as text). Spacing, key order and a number
            written another way that PHP reads as the same number within the
            64-bit range (`1.0` for `1`, `9007199254740994.0` for
            `9007199254740994`) are no change. Beyond that range, a whole
            number written without a fraction or an exponent is the same only
            as the same digits (`1e20` for `100000000000000000000` is a
            change), and a whole number that a client rounded is a change
            too. A key written twice counts with its last value. Templates
            saved before this rule keep such a key through other changes;
            the template page shows its value as `$encrypted$`.

            Extra vars that hold a number too large for JSON, such as
            `1e999`, are rejected with 422 `The extra vars cannot be stored:
            they contain a number too large for JSON.` on every save, also
            when the request leaves stored extra vars that hold one as they
            are.
          example: '{"http_port": 8080}'
        verbosity: { type: integer, minimum: 0, maximum: 5, default: 0 }
        forks: { type: integer, minimum: 1, default: 5 }
        become: { type: boolean, default: false }
        become_method: { type: string, default: sudo }
        become_user: { type: string, default: root }
        limit: { type: string, nullable: true }
        tags: { type: string, nullable: true }
        skip_tags: { type: string, nullable: true }
        timeout_minutes: { type: integer, default: 120 }
        runner_group_id: { type: integer, nullable: true }
        approval_rule_id:
          type: integer
          nullable: true
          description: |
            The approval rule that gates every launch of the template; null
            or `""` for none. Only admins (`approval-rule.update`) may set,
            change or remove it: a create with a rule, or an update that
            sends another value than the stored one, answers 403 `Only admins
            may assign or remove an approval rule: that needs
            approval-rule.update.` and writes nothing. Sending the stored
            value again, or leaving the field out, is allowed for everyone.
            An unusable value answers 422 `Approval rule must be an integer.`
            or `The selected approval rule does not exist.` While a template
            has a rule, an update by anyone else that changes another field
            than `name` and `description` answers 403 `This job template has
            an approval rule: only admins may change what it runs
            (approval-rule.update). You may change its name and
            description.` A launch waits for one rule only: when the
            template's inventory has a rule, this may be null or that rule
            only (422 `Inventory "web-prod" has the approval rule
            "deploy-prod": a job template on it may have only that rule as its
            own, or none.` otherwise), and the template's launches wait for
            the inventory's rule while this is null (see `approval_gate` of
            `JobTemplate`).
        survey_fields:
          description: |
            The survey: launch-time inputs whose answers become extra vars,
            as a list of `SurveyField` or the same list as JSON text; `null`
            removes the survey. The survey is checked only when the request
            changes it (on create: always), so templates saved before these
            rules keep saving. A rejected survey answers 422 with the first
            problem:

            - `Survey_fields must be valid JSON.`
            - `Survey fields must be a JSON list of field definitions.`
            - `Survey field <n> must be a JSON object with a name and a type.`
              (`<n>` counts from 1)
            - `Survey field name "<name>" is not a valid variable name: use
              letters, digits and underscores, and start with a letter or an
              underscore.` Checked for new and renamed fields, names compared
              exactly as stored, and for every password field whose name is
              not printable ASCII without a space at its start or end.
            - `Survey field name "<name>" is used more than once.`
            - `Survey field "<name>" has an unknown type "<type>"; use one of:
              text, textarea, integer, boolean, select, password.`
            - `The default of survey field "<name>" must be a single value,
              not a list or an object.`
            - `A password field cannot have a default value.`
          oneOf:
            - type: array
              nullable: true
              items: { $ref: '#/components/schemas/SurveyField' }
            - { type: string, nullable: true }

    SurveyField:
      type: object
      description: |
        One input of a job template's survey. The answer becomes the extra
        var `name`. The answer of a `password` field is a password answer:
        stored only encrypted and shown as `$encrypted$` (see Password survey
        answers). A password field has no default; it is entered at launch.
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z_][A-Za-z0-9_]*$'
          description: |
            The extra var the answer is stored under. New and renamed fields
            need a variable name, compared exactly as stored, so whitespace
            added to a name makes it a new name. Fields saved under another
            name before keep it, but a password field can carry an answer
            only when its name is printable ASCII without a space at its
            start or end, not empty, not numeric and without `[` or `]`. A
            control character (a line break, a tab) or a character outside
            ASCII (a non-breaking space, a byte order mark, a zero-width
            space, a letter like `ä`) anywhere in the name makes it
            unusable. Launches of a template with such a password field are
            refused until it is renamed; values stored under its exact name
            are password answers all the same, shown as `$encrypted$`. A
            changed survey cannot keep a password field name that is not
            printable ASCII without a space at its start or end, nor give
            such a name to a field retyped to password; a name that is empty,
            numeric or has `[` or `]` may stay, but the template's launches
            stay refused.
            Messages show the characters of a name that are not
            printable ASCII escaped as in JSON, such as
            `"db_password\u00a0"` for a trailing non-breaking space.
          example: db_password
        label: { type: string, description: "Shown on the launch form; the name when empty." }
        type:
          type: string
          enum: [text, textarea, integer, boolean, select, password]
          default: text
        required: { type: boolean, default: false }
        default:
          description: A single value; must be empty for a password field.
          oneOf:
            - { type: string }
            - { type: number }
            - { type: boolean }
        options:
          type: array
          items: { type: string }
          description: The choices of a `select` field.
        hint: { type: string, description: "Help text under the input on the launch form." }
      example:
        name: db_password
        label: Database password
        type: password
        required: true

    ScheduleInput:
      type: object
      description: |
        `created_by` is not accepted: a schedule runs as the user who created
        it, or who last changed its job template, cron expression, timezone
        or extra vars, or enabled it (see `created_by` of `Schedule`).
      required: [name, job_template_id, cron_expression]
      properties:
        name: { type: string, maxLength: 128 }
        job_template_id: { type: integer, description: "A job template the caller may operate." }
        cron_expression: { type: string, description: "Standard 5-field cron expression" }
        timezone: { type: string, default: UTC }
        extra_vars:
          type: string
          nullable: true
          description: |
            Extra vars of the scheduled jobs: a JSON object, as text. A value
            whose key is a password field of the job template's survey, or the
            key of an answer the schedule has stored, is a password answer: the
            schedule stores it only encrypted, keeps `$encrypted$` in its
            place, and passes it on encrypted to the jobs it launches. In a
            request:

            - `$encrypted$` as the value keeps the stored answer, so the
              `extra_vars` of a schedule response (`GET`, `POST`, `PUT`) can
              be sent back unchanged to keep every answer;
            - any other value replaces the stored answer, or adds one;
            - a stored answer whose key is missing is dropped;
            - `null`, `""` or a JSON value without keys clears every answer;
            - a `PUT` without `extra_vars` keeps the extra vars and every
              answer, unless it changes `job_template_id`.

            Stored answers never follow a schedule to another job template:
            with a new `job_template_id`, send every answer again. Rejected
            with 422, the first problem only:

            - `"<key>" has no stored value; enter the real value.`
            - `"<key>": the job template changed; enter the real value.`
            - `The job template changed: send extra_vars with the password
              answers again.` (a `PUT` that changes `job_template_id` without
              `extra_vars` while answers are stored)
            - `The stored password answers cannot be decrypted; enter the
              real values.` (`APP_SECRET_KEY` changed since they were stored)
            - `The extra vars cannot be stored: they contain a number too
              large for JSON.` (a number such as `1e999`, in a password
              answer too; also a `PUT` without `extra_vars` while the stored
              extra vars hold such a number)
            - `The extra vars are too long: with $encrypted$ in place of the
              password answers they exceed 65535 bytes.`
            - `The password answers cannot be encrypted. Check APP_SECRET_KEY.`
            - `The database update has not finished; run the migrations.`
          example: '{"app_env": "production", "db_password": "$encrypted$"}'
        enabled: { type: boolean, default: true }

    RunnerGroup:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        runner_count: { type: integer }
        created_at: { type: integer }
    RunnerGroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true }
    RunnerGroupList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RunnerGroup' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Runner:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        runner_group_id: { type: integer }
        runner_group_name: { type: string, nullable: true }
        is_online: { type: boolean }
        last_seen_at: { type: integer, nullable: true }
        software_version:
          type: string
          nullable: true
          description: >-
            Semver version the runner reported on its most recent heartbeat.
            `null` for runners that have not yet reported (pre-upgrade
            images). Capped at 32 characters on the server side.
          example: "2.2.16"
        capabilities:
          type: array
          items: { type: string, enum: [vault_password_source, secret_extra_vars] }
          description: |
            Features the runner reported on its most recent request, limited to
            names this server knows. Empty for runners that report nothing,
            including every runner older than 2.8.

            - `vault_password_source`: the runner honours a project's vault
              password source and, for "Ansilume only" projects, neutralises
              the repository's ansible.cfg vault settings. Runners without it
              apply the repository's vault settings whatever the project says.
            - `secret_extra_vars`: the runner gets password survey answers
              apart from the command and passes them to ansible-playbook in a
              private file (`--extra-vars @<file>`), and masks them in the job
              output. Runners without it, every runner from before this
              capability, get the answers inline in the command, with the
              verbosity capped at 3 and `ANSIBLE_VERBOSITY=0` set, so that
              ansible-playbook does not print its command line.
          example: [vault_password_source, secret_extra_vars]
        transport:
          type: string
          nullable: true
          enum: [https, http_internal, http_external]
          description: |
            How the runner's last request reached the server. `http_internal`:
            plain HTTP from a trusted network (RUNNER_TRUSTED_NETWORKS, by
            default loopback and private ranges, which covers the bundled
            runners). `http_external`: plain HTTP from elsewhere, so claim
            responses carry decrypted credentials in clear. X-Forwarded-Proto
            and X-Forwarded-For count only from trusted peers. `null` until the
            first request after the upgrade.
        transport_insecure: { type: boolean, description: "True for http_external." }
        remote_addr: { type: string, nullable: true, example: "203.0.113.7", description: "Client address of the last request." }
        plaintext_seen_at: { type: integer, nullable: true, description: "Last http_external request; kept after a fix." }
        last_reregistered_at:
          type: integer
          nullable: true
          description: >-
            When self-registration last issued this runner a new token, which
            revokes the previous one. `null` if that never happened. Audited
            as `runner.reregistered`.
        reregistrations_24h:
          type: integer
          description: >-
            Self-registrations of this runner within the last 24 hours. More
            than one usually means two runners share a RUNNER_NAME, or someone
            else registered with it.
        created_at: { type: integer }
    RunnerMoveInput:
      type: object
      required: [target_group_id]
      properties:
        target_group_id: { type: integer, description: ID of the target runner group }
    RunnerList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Runner' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    TeamSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        member_count: { type: integer }
        project_count: { type: integer }
        created_at: { type: integer }
    TeamDetail:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        members:
          type: array
          items:
            type: object
            properties:
              user_id: { type: integer }
              username: { type: string }
        projects:
          type: array
          items:
            type: object
            properties:
              project_id: { type: integer }
              name: { type: string }
              role: { type: string }
        created_at: { type: integer }
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true }
    TeamList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TeamSummary' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    User:
      type: object
      description: Sensitive fields (password_hash, auth_key, totp_secret, recovery_codes) are never returned.
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        status: { type: integer, description: "10 = active, 0 = inactive" }
        is_superadmin: { type: boolean }
        totp_enabled: { type: boolean }
        role:
          type: string
          nullable: true
          description: |
            The role assigned to the user, the first by name when several are;
            null when none is. A default role, such as viewer, which every
            signed-in user holds, is answered only when it is also assigned to
            the user. Sent back with `PUT`, it keeps every role assigned to
            the user.
        auth_source:
          type: string
          enum: [local, ldap]
          description: |
            Where the account authenticates. `local` uses the bcrypt password
            stored in Ansilume; `ldap` binds against the configured directory.
            Immutable once the user exists.
        ldap_dn: { type: string, nullable: true, description: Distinguished name set after the first directory bind (LDAP users only). }
        ldap_uid: { type: string, nullable: true, description: Stable directory identifier (objectGUID/entryUUID). LDAP users only. }
        last_synced_at: { type: integer, nullable: true, description: Unix timestamp of the most recent LDAP attribute sync. }
        ldap_sync_disabled:
          type: boolean
          readOnly: true
          description: |
            True when `ldap/sync` deactivated the account because the
            directory no longer had the user: the user's next LDAP sign-in, or
            an `ldap/sync` that finds them, activates it again. False for every
            other account; one deactivated in Ansilume stays inactive whatever
            the directory says. Read-only: POST and PUT ignore it, and a PUT
            that changes `status` clears it.
        created_at: { type: integer }
        updated_at: { type: integer }
    UserInput:
      type: object
      required: [username, email]
      properties:
        username: { type: string, maxLength: 128 }
        email: { type: string, format: email }
        password:
          type: string
          minLength: 5
          description: Required on create for local users; rejected for LDAP users. Optional on update.
        status: { type: integer, description: "10 = active, 0 = inactive" }
        is_superadmin:
          type: boolean
          description: |
            Only a superadmin may change it: a value that would set or clear
            the flag answers 403 `Only a superadmin can set or clear
            is_superadmin.` for anyone else; the current value is accepted.
        role:
          type: string
          nullable: true
          description: |
            The role to assign: one of the roles the instance has. A role the
            user already has, one of the roles assigned to them, keeps every
            role assigned to the user; another role replaces them all; leave
            it out, or send null or an empty string, to keep them. Another
            value answers 422. Assigning a role needs every permission it
            grants, through its child roles too, unless the caller is a
            superadmin; else 403 `You cannot assign the role "admin": it
            grants permissions you do not hold.` The `admin` role, and a role
            that contains it, also needs a caller who holds the `admin` role,
            unless the caller is a superadmin; else 403 `You cannot assign the
            role "admin": it is or contains the admin role, which only
            superadmins and admins may assign.`
        auth_source:
          type: string
          enum: [local, ldap]
          default: local
          description: |
            Authentication source. Set on create; immutable thereafter — sending
            a different value on update returns 422. Defaults to `local`.
        ldap_dn:
          type: string
          nullable: true
          description: Optional DN. If omitted, the directory bind fills it on first login.
        ldap_uid:
          type: string
          nullable: true
          description: Optional stable directory identifier. Filled by directory sync if omitted.
    UserList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/User' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    LdapDiagnosticResult:
      type: object
      description: |
        LDAP connection diagnostic and optional user-lookup result.
        Never includes secrets — passwords are not echoed.
      properties:
        connection:
          type: object
          properties:
            enabled: { type: boolean }
            host: { type: string }
            encryption:
              type: string
              enum: [none, starttls, ldaps]
            base_dn: { type: string }
            bind_dn_configured: { type: boolean, description: True if a service account DN is set; the password itself is never returned. }
            service_bind: { type: boolean, description: Whether the service-account bind succeeded. }
            error: { type: string, nullable: true, description: Human-readable error if the bind failed. }
        user:
          type: object
          nullable: true
          description: Present only when the request supplies a username.
          properties:
            found:
              type: boolean
              description: |
                True when the directory has the user and, with a `password`,
                the password is right. False otherwise, with `error` saying
                why, such as the error of a failed service bind. Without a
                `password`, `User not found in directory.` means that the
                user search ran and found no entry; a user search or a group
                search that fails answers that failure instead, such as
                `User search failed: No such object` or `Group search
                failed: Operations error`. With a `password`, a wrong one
                answers `User bind failed (invalid credentials).`, a user
                search that finds no entry or fails answers `User not found
                in directory.`, and a failed group search answers the user as
                found, without groups.
            dn: { type: string, nullable: true }
            uid: { type: string, nullable: true }
            username: { type: string, nullable: true }
            email: { type: string, nullable: true }
            display_name: { type: string, nullable: true }
            groups: { type: array, items: { type: string } }
            mapped_roles: { type: array, items: { type: string } }
            error: { type: string, nullable: true, description: 'Set when found=false: why the user was not found, or why the lookup failed.' }

    Webhook:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        events: { type: string, description: Comma-separated event names }
        enabled: { type: boolean }
        has_secret:
          type: boolean
          description: |
            Whether the webhook has a signing secret, so that its deliveries
            carry `X-Ansilume-Signature`. The secret itself is never
            answered. A secret of '' or '0' counts as none, as on the webhook
            pages.
          example: true
        created_at: { type: integer }
        updated_at: { type: integer }
    WebhookInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 128 }
        url: { type: string, format: uri }
        secret:
          type: string
          nullable: true
          description: |
            HMAC-SHA256 signing secret, never answered (`Webhook` has no
            `secret`; `has_secret` says whether one is stored). On update,
            `$encrypted$` keeps the stored secret, and null or '' removes it,
            so deliveries are unsigned. `$encrypted$` where no secret is
            stored, as on create, answers 422 `The secret has no stored
            value; enter the real value.`
        events:
          description: Event names as array or comma-separated string
          oneOf:
            - { type: array, items: { type: string } }
            - { type: string }
        enabled: { type: boolean, default: true }
    WebhookList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Webhook' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    AuditLog:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer, nullable: true }
        action: { type: string }
        object_type: { type: string, nullable: true }
        object_id: { type: integer, nullable: true }
        metadata: { type: object, nullable: true, description: Parsed JSON context }
        ip_address: { type: string, nullable: true }
        created_at: { type: integer }
    AuditLogList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    GenericList:
      type: object
      properties:
        data: { type: array, items: { type: object } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    ApprovalRequest:
      type: object
      required: [id, job_id, launched_by, approval_rule_id, required_by, inventory_id, inventory_name, status, requested_at, resolved_at, expires_at, approval_count, rejection_count, decisions, workflow_job_id, workflow_job_step_id, workflow_template_id, workflow_step_name]
      properties:
        id: { type: integer }
        job_id: { type: integer, description: "The job waiting for the decision; for a workflow approval step, its placeholder job without a job template." }
        launched_by:
          type: integer
          description: |
            The user who launched the job: for a schedule, the user it runs
            as; for a trigger, the user it runs as; for a workflow approval
            step, the user who started the run. Never an eligible approver:
            this user's votes are refused and earlier ones count for
            nothing.
          example: 7
        approval_rule_id:
          type: integer
          nullable: true
          description: The rule the request waits for; null once that rule was deleted (only a rule without pending requests can be).
        required_by:
          type: string
          nullable: true
          enum: [job_template, inventory, approval_step, null]
          description: |
            What required the request: `job_template`, the own approval rule
            of the job's template (also when its inventory has the same
            rule); `inventory`, the rule of the inventory the job was
            launched with (`inventory_id`); `approval_step`, a workflow
            approval step, whose placeholder job runs nothing. The update to
            2.12.0 marked the requests of workflow approval steps made
            before it `approval_step`, those whose step execution still
            existed; every other earlier request says `job_template`. null
            only while the update's migration has not run.
          example: inventory
        inventory_id:
          type: integer
          nullable: true
          description: |
            The inventory the request's job was launched with (`inventory_id`
            of `Job`); null for the placeholder job of an approval step.
          example: 3
        inventory_name:
          type: string
          nullable: true
          description: That inventory's name, as `inventory_name` of `Job` gives it.
          example: web-prod
        status:
          type: string
          enum: [pending, approved, rejected, timed_out, canceled]
          description: |
            `canceled`: the job or workflow run was canceled, or its job
            template deleted, while the request was pending, or a vote or
            timeout found that its job no longer waited for approval. A
            canceled request takes no votes.
        requested_at: { type: integer }
        resolved_at: { type: integer, nullable: true }
        expires_at:
          type: integer
          nullable: true
          description: |
            When the rule's timeout runs out; null without a timeout. A vote
            at or after this time answers 409. The maintenance run, which the
            schedule-runner starts every minute, then applies the rule's
            timeout action: the request becomes `timed_out` and its job is
            rejected, or approved when the rule's timeout action is
            `approve`. An approve applies only within 60 minutes (3600
            seconds) after `expires_at`, counted when the timeout is
            applied; a timeout applied later rejects, and its
            `approval.timed_out` audit entry says so
            (`reason: grace_period_exceeded`).
        approval_count:
          type: integer
          description: The approvals that count; the launcher's votes are left out.
        rejection_count:
          type: integer
          description: The rejections that count; the launcher's votes are left out.
        decisions:
          type: array
          nullable: true
          description: |
            Every vote on the request, in the order cast: the votes the
            request page lists. A vote whose `user_id` is `launched_by` was
            cast by the launcher before self-approval was refused; it counts
            neither as an approval nor as a rejection (`approval_count` and
            `rejection_count` leave it out). null for a caller without
            `approval.view`, which only the answers of approve and reject
            reach.
          items: { $ref: '#/components/schemas/ApprovalDecision' }
        workflow_job_id:
          type: integer
          nullable: true
          description: |
            The workflow run whose step created the request's job: the
            placeholder job of an approval step, or the job of a gated job
            step. null when the job belongs to no workflow step, or the
            caller may not view that workflow: a team member can see the
            request of a gated job step through its job template's project
            while the workflow is hidden, and then learns nothing about the
            workflow, the run or the step.
          example: 17
        workflow_job_step_id:
          type: integer
          nullable: true
          description: The step execution of that run (`id` of `WorkflowJobStep`); null as `workflow_job_id`.
          example: 31
        workflow_template_id:
          type: integer
          nullable: true
          description: The workflow template of that run, also a deleted one; null as `workflow_job_id`.
          example: 5
        workflow_step_name:
          type: string
          nullable: true
          description: The step's name when it ran; null as `workflow_job_id`.
          example: Release approval
    ApprovalRequestList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ApprovalRequest' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    ApprovalDecision:
      type: object
      description: One vote on an approval request.
      required: [user_id, username, decision, comment, created_at]
      properties:
        user_id:
          type: integer
          description: The user who voted.
          example: 12
        username:
          type: string
          example: alice
        decision:
          type: string
          enum: [approved, rejected]
        comment:
          type: string
          nullable: true
          description: The comment given with the vote, as given; null without one.
          example: Change window confirmed
        created_at:
          type: integer
          description: When the vote was cast (Unix time).
          example: 1760000000
    ApprovalDecisionInput:
      type: object
      properties:
        comment:
          type: string
          nullable: true
          maxLength: 1000
          description: |
            Optional comment stored with the vote and shown with the
            decisions, on the page of the request and in `decisions` of the
            request. Longer text, or a value that is not a string, answers
            422.
    ApprovalDecisionConflictError:
      type: object
      properties:
        error:
          type: object
          required: [message, status]
          properties:
            message:
              type: string
              example: 'Approval request #12 is already resolved: approved.'
            status:
              type: string
              enum: [pending, approved, rejected, timed_out, canceled]
              description: The request's status.

    ApprovalRule:
      type: object
      required: [id, name, description, required_approvals, timeout_minutes, timeout_action, approver_type, approver_config, job_template_id, created_by, created_at, updated_at]
      properties:
        id: { type: integer }
        name: { type: string, maxLength: 128, description: "Not unique: two rules can have the same name." }
        description: { type: string, nullable: true, maxLength: 1000 }
        required_approvals:
          type: integer
          minimum: 1
          maximum: 50
          description: |
            How many eligible approvers must approve; the user who launched
            the job never counts (see Approvals).
        timeout_minutes:
          type: integer
          nullable: true
          minimum: 1
          maximum: 10080
          description: Minutes until a request of this rule expires; null for none.
        timeout_action:
          type: string
          enum: [reject, approve]
          description: |
            What happens to the job of an expired request. `approve` applies
            only within 60 minutes after the request expired; later the
            request is rejected.
        approver_type: { type: string, enum: [role, team, users] }
        approver_config:
          type: object
          description: |
            Who is on the approver list: `{"user_ids": [7, 12]}` for
            `users`, `{"role": "operator"}` for `role` (the users assigned
            that role directly), `{"team_id": 3}` for `team` (the team's
            members). Only those who are eligible may decide (see Approvals).
            Always a JSON object: `{}` for a rule without approvers. A rule
            whose approver list an older version stored as a JSON list or a
            single value names no approvers and is returned with `{}` too.
          example: { user_ids: [7, 12] }
        job_template_id:
          type: integer
          nullable: true
          deprecated: true
          description: |
            Unused: a rule never gated a job template through this field.
            `approval_rule_id` of the job template, or of its inventory,
            does that.
        created_by: { type: integer, description: "The user who created the rule; it cannot be changed." }
        created_at: { type: integer }
        updated_at: { type: integer }
    ApprovalRuleDetail:
      allOf:
        - $ref: '#/components/schemas/ApprovalRule'
        - type: object
          required: [used_by]
          properties:
            used_by: { $ref: '#/components/schemas/ApprovalRuleUsage' }
    ApprovalRuleList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/ApprovalRule' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    ApprovalRuleInput:
      type: object
      description: |
        `name`, `approver_type` and `approver_config` are required on create
        and kept when omitted on update. `created_by` is not accepted: the
        caller who creates the rule is its creator.
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 1000 }
        approver_type: { type: string, enum: [role, team, users] }
        approver_config:
          description: |
            The approver list, as an object or as JSON text of one, see
            `approver_config` of `ApprovalRule`. A list or a single value
            answers 422 `Approver Config must be a JSON object.` So does an
            update that leaves the field out, of a rule whose approver list
            an older version stored as a list or a single value, until the
            update sends an object; saving the rule in the web form stores
            the approvers the form shows.
          oneOf:
            - { type: object }
            - { type: string, maxLength: 4096 }
        required_approvals:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
          description: |
            For a `users` rule, at most the number of listed users: more
            answers 422 `Required approvals (3) exceeds eligible approvers
            (1).` Role and team rules are checked at launch, where too few
            eligible approvers besides the launcher refuse the launch.
        timeout_minutes: { type: integer, nullable: true, minimum: 1, maximum: 10080 }
        timeout_action: { type: string, enum: [reject, approve], default: reject }
        job_template_id:
          type: integer
          nullable: true
          deprecated: true
          description: |
            Not used: null is ignored, and any other value answers 422
            `job_template_id is not used by approval rules: set
            approval_rule_id on the job template (admins only).`
    ApprovalRuleUsage:
      type: object
      description: |
        Where an approval rule is used. A rule is in use while one of the
        counts is above 0, and cannot be deleted then. The lists hold only
        what the caller may see (team scope); the hidden counts say how many
        more there are.
      required: [in_use, inventories, hidden_inventory_count, job_templates, hidden_job_template_count, workflow_steps, hidden_workflow_step_count, pending_request_count]
      properties:
        in_use: { type: boolean }
        inventories:
          type: array
          description: |
            Inventories that the rule gates: every launch of every job
            template on them waits for it. An inventory without a project
            is listed to every caller.
          items:
            type: object
            required: [id, name, project_id, project_name]
            properties:
              id: { type: integer }
              name: { type: string }
              project_id: { type: integer, nullable: true }
              project_name: { type: string, nullable: true }
        hidden_inventory_count: { type: integer }
        job_templates:
          type: array
          description: Live job templates that the rule gates.
          items:
            type: object
            required: [id, name, project_id, project_name]
            properties:
              id: { type: integer }
              name: { type: string }
              project_id: { type: integer }
              project_name: { type: string, nullable: true }
        hidden_job_template_count: { type: integer }
        workflow_steps:
          type: array
          description: Steps of live workflows that use the rule.
          items:
            type: object
            required: [workflow_template_id, workflow_template_name, step_id, step_name]
            properties:
              workflow_template_id: { type: integer }
              workflow_template_name: { type: string }
              step_id: { type: integer }
              step_name: { type: string }
        hidden_workflow_step_count: { type: integer }
        pending_request_count:
          type: integer
          description: Pending approval requests of the rule whose job still waits for approval.
    ApprovalRuleInUseError:
      type: object
      properties:
        error:
          type: object
          required: [message, used_by]
          properties:
            message:
              type: string
              example: 'Approval rule "deploy-prod" is in use by 1 inventory(ies), 2 job template(s) and 1 workflow step(s). Remove it from them, and let pending requests be decided or their jobs canceled, before deleting it.'
            used_by: { $ref: '#/components/schemas/ApprovalRuleUsage' }

    ApprovalSummary:
      type: object
      required: [total, approved, rejected, timed_out, canceled, pending, approval_rate, avg_decision_seconds]
      properties:
        total: { type: integer, description: "Approval requests of the period." }
        approved: { type: integer }
        rejected: { type: integer }
        timed_out: { type: integer }
        canceled:
          type: integer
          description: Requests closed because their job or workflow run was canceled, or their job template deleted, before anybody decided.
        pending: { type: integer }
        approval_rate:
          type: number
          description: Approved requests in percent of the approved and rejected ones; 0 when there are none.
        avg_decision_seconds:
          type: number
          description: |
            The average time from request to resolution of the resolved
            requests, canceled ones left out. A timed-out request counts
            until its `expires_at`, also when the maintenance run applied
            its timeout later.

    WorkflowTemplate:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        created_by:
          type: integer
          description: |
            User ID of the creator. A trigger token generated before Ansilume
            recorded who generated it runs as this user.
        has_trigger_token:
          type: boolean
          description: |
            Whether the workflow has an inbound trigger token. Only callers
            who may change the workflow (`workflow-template.update` and
            operator access to the project of every job step) get this field,
            as only they see the trigger on the workflow's page; it is absent
            for everyone else. The token itself is never returned; it is
            generated and revoked on the workflow's page.
        trigger_user_id:
          type: integer
          nullable: true
          description: |
            The user a trigger launch runs as: whoever generated the current
            token, or the workflow's creator for tokens generated before
            Ansilume recorded that. This user is the launcher of the run's
            approval steps and job steps and never approves them. null
            without a token. Like `has_trigger_token`, only callers who may
            change the workflow get this field.
          example: 7
        created_at: { type: integer }
        updated_at: { type: integer }
    WorkflowTemplateDetail:
      allOf:
        - $ref: '#/components/schemas/WorkflowTemplate'
        - type: object
          properties:
            start_step_id:
              type: integer
              nullable: true
              description: The step runs start with, at position 1; null for a workflow without steps.
              example: 41
            success_path: { $ref: '#/components/schemas/WorkflowSuccessPath' }
            steps:
              type: array
              description: The steps in run order, by `position`.
              items: { $ref: '#/components/schemas/WorkflowStep' }
    WorkflowStep:
      type: object
      properties:
        id:
          type: integer
          description: The step's ID. It stays when the step is changed or moved, so branches and runs keep pointing to the step.
        name: { type: string }
        step_order:
          type: integer
          description: |
            An internal sort key: steps run by `step_order`, then by ID. The
            step endpoints number the steps 10, 20, 30, … in run order after
            every add, move and remove of a step; an update that does not
            move the step, and a move to where the step stands, leave the
            numbers as they are. A `steps` list numbers them 0, 1, 2, …;
            steps that an older version gave the same value run by ID. Use
            `position`.
        position:
          type: integer
          minimum: 1
          description: |
            The step's 1-based place in the run order, which runs start at
            1. Adding, moving and removing steps changes it: address a step
            by its `id`.
          example: 2
        is_start:
          type: boolean
          description: Whether runs start with this step, the one at position 1.
        reachable:
          type: boolean
          description: |
            Whether a run can reach the step: it is the start step, or a
            branch that some outcome of a step a run can reach takes leads
            to it. A step that is not reachable never runs. A step that
            cannot run (`cannot_run`) leads nowhere, as a run fails there: a
            step that only it leads to is not reachable.
        cannot_run:
          type: string
          nullable: true
          enum: [job_template_missing, approval_rule_missing, approval_rules_differ, unknown_type, null]
          description: |
            Why a run that reaches the step fails there; null when it can
            run. `job_template_missing`: a job step without a job template,
            or whose job template was deleted; `approval_rule_missing`: an
            approval step without its approval rule, or a job step whose job
            template, or its inventory, has an approval rule that no longer
            exists; `approval_rules_differ`: a job step whose job template
            and its inventory have different approval rules, as a launch
            waits for one rule only (its `routes` are those of a gated job
            step);
            `unknown_type`: a type an older version stored (see
            `step_type`), whose `routes` are all null.
        routes: { $ref: '#/components/schemas/WorkflowStepRoutes' }
        step_type:
          type: string
          description: |
            `job`, `approval` or `pause`. A step stored by an older version
            can carry another type, such as `1` or `JOB`, until it is
            removed; runs fail at such a step (see docs/updating.md).
        job_template_id: { type: integer, nullable: true, description: "Job steps only; null on approval and pause steps." }
        approval_rule_id: { type: integer, nullable: true, description: "Approval steps only; null on job and pause steps." }
        on_success_step_id:
          type: integer
          nullable: true
          description: |
            Step after success, by ID. null: the next step in the run order
            (after the last step, the run ends as succeeded); 0: end the
            workflow; the ID of a step of this workflow, the step itself or
            an earlier one too (a loop: the run repeats steps until a branch
            leads elsewhere). A branch to a step that no longer exists fails
            the run (`The step this branch leads to no longer exists (step ID
            7).`). `routes.success` says where a success leads now.
        on_failure_step_id:
          type: integer
          nullable: true
          description: |
            Step after failure. null: the next step in the run order; 0: end
            the workflow. After a closed approval gate, null ends the run as
            failed instead of going on with the next step: an approval step
            that was rejected, timed out (rejecting) or canceled, and a job
            step whose job was rejected or canceled while it waited for
            approval. Only an explicit step here continues the run then. A
            run that ends after a failed step ends as failed; a branch to a
            step that no longer exists fails the run. A job step that leads
            to itself here retries until its job succeeds or the run is
            canceled. `routes.failure` and `routes.closed_gate` say where a
            failure and a closed gate lead now.
        on_always_step_id:
          type: integer
          nullable: true
          description: |
            Step after either outcome; wins over the other two, except after
            a closed approval gate (see `on_failure_step_id`): then it is
            not taken, on job steps too. A job step still takes it after a
            job that ran. null: not set; 0: end the workflow. Approval steps
            cannot have one: saving it is refused (`An approval step cannot
            have an Always branch: a rejection would continue past it.`),
            and on an approval step saved before that it is followed after
            an approval only. A branch to a step that no longer exists fails
            the run.
        extra_vars_template:
          description: |
            Extra vars this step takes from the output of the previous step:
            extra var name to output variable name. `[]` when there are none.
            A mapping of another shape that a version before 2.11.0 stored is
            answered as it is decoded when it is a JSON list or object (such
            as `["build_version"]`), and as `[]` when it is a number, text,
            true or false. Runs ignore every entry that does not map an extra
            var name to the name of an output variable.
          oneOf:
            - { type: object, additionalProperties: { type: string } }
            - { type: array, maxItems: 0 }
    WorkflowTemplateList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/WorkflowTemplate' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    WorkflowTemplateInput:
      type: object
      description: |
        `name` is required on create and kept when omitted on update.
        `created_by`, `trigger_token` and `trigger_token_created_by` are not
        accepted; trigger tokens are generated on the workflow's page.
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, nullable: true, maxLength: 1000 }
        steps:
          type: array
          nullable: true
          description: |
            All steps in run order; replaces the current ones: they are
            deleted with their branches, and the listed steps are written as
            new steps, with new IDs and without branches. Omit it or send
            null to keep the current steps on update; `[]` removes them all.
            Not while a run of the workflow is active (409), and only for
            admins when an approval step or a gated job step (a job step
            whose job template has an approval rule) is in the list or in the
            workflow (403); a job step whose job template's inventory has an
            approval rule is a gated job step too. Runs keep the history of
            replaced steps. To change one step, use the step endpoints
            (`/api/v1/workflow-templates/{id}/steps`).
          items: { $ref: '#/components/schemas/WorkflowStepInput' }
    WorkflowStepInput:
      type: object
      description: |
        One step of a `steps` list. The list's order is the run order, and
        branches, `position` and `after_step_id` are not read here: the
        steps get none. The step endpoints set them.
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 128, description: "Required; a missing or empty name answers 422." }
        step_type: { type: string, enum: [job, approval, pause], default: job }
        job_template_id:
          type: integer
          minimum: 1
          description: |
            Required for a job step: a job template the caller may operate.
            Ignored for other step types. A job template with an approval
            rule makes the step a gated job step, which is for admins as an
            approval step is: it needs `approval-rule.update` (403
            otherwise). So does a job template whose inventory has an
            approval rule.
        approval_rule_id:
          type: integer
          minimum: 1
          description: |
            Required for an approval step: an existing approval rule. Ignored
            for other step types. Approval steps are for admins: steps with
            one need `approval-rule.update` (403 otherwise).
        extra_vars_template:
          description: |
            Extra vars this step takes from the output of the previous step:
            a JSON object that maps an extra var name (text that is not
            empty) to the name of an output variable (text), or the same
            object as JSON text; null, `{}` and `[]`, or the same as JSON
            text, store no mapping. A mapped value wins over the run's launch
            extra vars, which win over the job template's extra vars. The
            start step has no previous step, so its mapping gives nothing.
            Any other JSON is rejected with 422 `steps[<n>]:
            extra_vars_template must be null or a JSON object that maps extra
            var names to the names of output variables, such as
            {"app_version": "build_version"}.`, among the steps that cannot
            be read, before the 403 for gated steps. Either form with a
            number too large for JSON, such as `1e999`, is rejected with 422
            `steps[<n>]: The extra vars cannot be stored: they contain a
            number too large for JSON.` An object with text that is not
            valid UTF-8, which only a form-encoded body can carry, is
            rejected with 422 `steps[<n>]: The extra vars cannot be stored:
            they contain characters that are not valid UTF-8.`
          oneOf:
            - { type: object, nullable: true, additionalProperties: { type: string } }
            - { type: array, maxItems: 0 }
            - { type: string }
    WorkflowStepCreateInput:
      type: object
      required: [name]
      description: |
        The step to add. A key the body leaves out takes its default:
        `step_type` job, no branches, no variable mapping, and the end of
        the run order. Send `position` or `after_step_id`, not both (422
        `Send either position or after_step_id, not both.`); null counts as
        not sent. `id`, `step_order` and keys not listed here are ignored.
        A value that cannot be read answers 422 before anything else of the
        step is checked.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: Required; a missing or empty name answers 422 `Name cannot be blank.`
        step_type:
          type: string
          enum: [job, approval, pause]
          default: job
          description: |
            `job` runs a job template, `approval` waits for the approvers of
            an approval rule, `pause` waits until someone resumes the run.
            Not sent: `job`. null or an empty value answers 422 `Step Type
            cannot be blank.`; any other value 422 `Step Type is invalid.`
            Approval steps are for admins (`approval-rule.update`; 403
            otherwise).
        job_template_id:
          type: integer
          minimum: 1
          description: |
            Required for a job step: a job template the caller may operate
            (see the endpoint). An integer, or text with a whole number such
            as `"15"` (a sign or spaces around it are read away); text with a
            leading zero, `true` and `1.0` count as none, which answers 422
            `A job step needs a job template.`
            Ignored for other step types. A job template with an approval
            rule makes the step a gated job step, which is for admins as an
            approval step is (`approval-rule.update`; 403 otherwise), and so
            does a job template whose inventory has an approval rule.
        approval_rule_id:
          type: integer
          minimum: 1
          description: |
            Required for an approval step: an existing approval rule (422
            `An approval step needs an approval rule.` without one, `The
            selected approval rule does not exist.` for an unknown one), read
            as `job_template_id` is. Ignored for other step types.
        on_success_step_id:
          description: |
            Where a run goes after the step succeeds: its job succeeded, it
            was approved, or the run was resumed. Not sent: null, the next
            step in the run order. See `WorkflowStepBranchInput`.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WorkflowStepBranchInput' }]
        on_failure_step_id:
          description: |
            Where a run goes after the job of a job step failed, and after a
            closed approval gate: an approval rejected, timed out or
            canceled, of an approval step or of a gated job step. Not sent:
            null, the next step in the run order, except after a closed
            gate, where null ends the run as failed. A pause step takes only
            null. See `WorkflowStepBranchInput`.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WorkflowStepBranchInput' }]
        on_always_step_id:
          description: |
            Job steps only: where a run goes after the job, whether it
            succeeded or failed, instead of On Success and On Failure; not
            after a closed approval gate. Not sent: null, none. An approval
            step with one answers 422 `An approval step cannot have an
            Always branch: a rejection would continue past it.`, a pause step
            422 as for `on_failure_step_id`. See `WorkflowStepBranchInput`.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WorkflowStepBranchInput' }]
        extra_vars_template:
          description: |
            Extra vars this step takes from the output of the previous step:
            a JSON object that maps an extra var name (text that is not
            empty) to the name of an output variable (text), such as
            `{"app_version": "build_version"}`, or the same object as JSON
            text. null, `{}` and `[]`, or the same as JSON text, store no
            mapping. A mapped value wins over the run's launch extra vars,
            which win over the job template's extra vars. Any other JSON (a
            list, a number, text, true or false, a value that is not text,
            an empty key or a key that is a whole number such as `"0"`)
            answers 422 `extra_vars_template must be null or a JSON object
            that maps extra var names to the names of output variables, such
            as {"app_version": "build_version"}.` Either form with a number
            too large for JSON, such as `1e999`, answers 422 `The extra vars
            cannot be stored: they contain a number too large for JSON.`;
            text that is not valid JSON answers 422 `Extra_vars_template must
            be valid JSON.`
          oneOf:
            - { type: object, nullable: true, additionalProperties: { type: string } }
            - { type: array, maxItems: 0 }
            - { type: string }
        position:
          description: Where the step goes; neither this nor `after_step_id`, the end.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WorkflowStepPositionInput' }]
        after_step_id:
          description: Place the step right after this step of the workflow.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WorkflowStepAfterInput' }]
    WorkflowStepUpdateInput:
      type: object
      description: |
        The fields of the step to change. A key the body leaves out keeps
        its value; null clears a branch, which then goes on with the next
        step in the run order, or the variable mapping. Without `position`
        and `after_step_id`, or with both null, the step keeps its place;
        with one of them it moves there (not both: 422 `Send either position
        or after_step_id, not both.`). `id`, `step_order` and keys not
        listed here are ignored. A value that cannot be read answers 422
        before anything else of the step is checked.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: An empty name answers 422 `Name cannot be blank.`
        step_type:
          type: string
          enum: [job, approval, pause]
          description: |
            The type cannot change: the step's own type is accepted, another
            answers 422 `A step's type cannot change: add a new step and
            remove this one.`
        job_template_id:
          type: integer
          minimum: 1
          description: |
            A job step's job template, read as on add. A new one is checked
            as on add: it must exist for the caller (422) and be one the
            caller may operate (403), and one with an approval rule, its own
            or its inventory's, needs `approval-rule.update` (403). null, or
            a value that is no ID,
            answers 422 `A job step needs a job template.` Ignored for other
            step types.
        approval_rule_id:
          type: integer
          minimum: 1
          description: An approval step's approval rule, read as on add. Ignored for other step types.
        on_success_step_id:
          description: Where a run goes after the step succeeds, as on add. Not sent, unchanged.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WorkflowStepBranchInput' }]
        on_failure_step_id:
          description: |
            Where a run goes after a failed job or a closed approval gate,
            as on add. Not sent, unchanged. A pause step takes only null.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WorkflowStepBranchInput' }]
        on_always_step_id:
          description: |
            Job steps only, as on add. Not sent, unchanged. An approval step
            that an older version saved with an Always branch answers 422
            `An approval step cannot have an Always branch: a rejection would
            continue past it.` to every update until one sends null here,
            which removes it.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WorkflowStepBranchInput' }]
        extra_vars_template:
          description: |
            The variable mapping, as on add. Not sent, unchanged; null, `{}`
            or `[]` removes it. It is compared by its JSON value: the same
            mapping with other spaces or another order of keys, and `[]` or
            `{}` where there is none, is no change, so a step sent back as
            `GET` answers it is unchanged. A mapping of another shape that a
            version before 2.11.0 stored stays while an update leaves it out
            or sends it back unchanged; another mapping of that shape answers
            the 422 of add.
          oneOf:
            - { type: object, nullable: true, additionalProperties: { type: string } }
            - { type: array, maxItems: 0 }
            - { type: string }
        position:
          description: Where the step moves; not sent, it keeps its place.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WorkflowStepPositionInput' }]
        after_step_id:
          description: Move the step right after this step of the workflow.
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WorkflowStepAfterInput' }]
    WorkflowStepMoveInput:
      type: object
      description: |
        Where the step moves: exactly one of `position`, `after_step_id` and
        `direction`; a key sent as null counts as not sent. None, or more
        than one, answers 422 `Send exactly one of position, after_step_id
        and direction.`
      properties:
        position:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WorkflowStepPositionInput' }]
        after_step_id:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/WorkflowStepAfterInput' }]
        direction:
          type: string
          nullable: true
          enum: [up, down, null]
          description: |
            One place earlier (`up`) or later (`down`), as ▲ and ▼ on the
            workflow's page do; at the start or the end the step stays.
            Anything else answers 422 `direction must be "up" or "down".`
    WorkflowStepPositionInput:
      description: |
        A place in the run order: `start` (runs start with the step), `end`,
        or a 1-based position, as an integer or a string of digits. A
        position counts the step itself: an add takes 1 to the number of
        steps plus one, an update or a move 1 to the number of steps;
        another one answers 422 `position must be "start", "end" or a number
        from 1 to 4.`, naming the highest it can take. Anything else, such
        as 0, `1.5`, `true` or `"START"`, answers 422 `position must be
        "start", "end" or a whole number from 1.` A position is resolved
        when the change is applied, so another change at the same time can
        shift it; `after_step_id` names a step instead. null counts as not
        sent.
      oneOf:
        - { type: string, enum: [start, end] }
        - { type: integer, minimum: 1, nullable: true }
        - { type: string, pattern: '^0*[1-9][0-9]*$' }
    WorkflowStepAfterInput:
      description: |
        The ID of a step of this workflow, as an integer or a string of
        digits. A step that is not, or no longer, part of the workflow
        answers 422 `The step to place it after (step ID 12) is not part of
        this workflow. Load the workflow again and choose another
        position.`; the step itself, on an update or a move, 422 `A step
        cannot be placed after itself.` Anything that is no whole number
        from 1 answers 422 `after_step_id must be the ID of a step of this
        workflow.` null counts as not sent.
      oneOf:
        - { type: integer, minimum: 1, nullable: true }
        - { type: string, pattern: '^0*[1-9][0-9]*$' }
    WorkflowStepBranchInput:
      description: |
        A branch: null for the next step in the run order, 0 to end the
        run, or the ID of a step of this workflow, an earlier one too, and
        on an update the step itself (a loop: the run repeats steps until a
        branch leads elsewhere); as an integer or a string of digits. A step
        that is not part of this workflow answers 422 `The selected step is
        not part of this workflow.` Anything else, such as `""`, `true`,
        `1.5` or `-1`, answers 422 with the branch's name, such as
        `on_failure_step_id must be null, 0 (end the workflow) or the ID of
        a step of this workflow.` A pause step takes only On Success: one
        sent with an `on_failure_step_id` or `on_always_step_id` that is not
        null answers 422 `A pause step only has on_success_step_id: Resume
        continues there. Send on_failure_step_id and on_always_step_id as
        null.`
      oneOf:
        - { type: integer, minimum: 0, nullable: true }
        - { type: string, pattern: '^[0-9]+$' }
    WorkflowStepWriteResponse:
      type: object
      required: [data, change]
      description: The answer of an add, update or move of one step.
      properties:
        data: { $ref: '#/components/schemas/WorkflowStep' }
        change: { $ref: '#/components/schemas/WorkflowStepChange' }
    WorkflowStepChange:
      type: object
      required: [message, warnings]
      description: What a change of one step did, in the words of the success message on the workflow's page.
      properties:
        message:
          type: string
          description: |
            Where the step landed, or which fields changed; then, one
            sentence each, how the empty branches of other steps now lead
            elsewhere (explicit branches never move). For example:
            - `Step "Deploy" added at position 3 of 3, after "Release
              approval". "Release approval" now continues with "Deploy" (was
              the end of the run).`
            - `Step "Smoke test" added at position 2 of 3, after "Build".
              "Build" now continues with "Smoke test", also after a failure
              (was "Deploy").`
            - `Step "Deploy" moved to position 1 of 3, at the start.`
            - `Step "Deploy web" saved: name, On Failure changed.`
            - `Step "Deploy" saved: On Success changed; it is now at
              position 2 of 3, after "Build".`
            - `Step "Deploy" removed; it was at position 3 of 3. "Release
              approval" now ends the run (was "Deploy").`
            A change that writes nothing says so, and is not audited: `Step
            "Deploy" is unchanged.` for an update, `Step "Deploy" stays at
            position 3.` for a move to where the step stands.
          example: 'Step "Deploy" added at position 3 of 3, after "Release approval". "Release approval" now continues with "Deploy" (was the end of the run).'
        warnings:
          type: array
          items: { type: string }
          description: |
            What runs now do differently, one entry each; empty when nothing
            changed for them. The branches decide, not the positions alone:
            - `Runs now start with "Deploy" (was "Build").`
            - `Job step "Deploy" now runs before the approval step "Release
              approval": runs start it without waiting for that approval.`,
              for each job step that runs reached only through an approval
              step, or that the change added, and that runs now reach without
              passing one, naming the first approval step;
            - `Job step "Deploy" no longer comes after an approval step: runs
              start it without waiting for an approval.`, for each such job
              step once no approval step is left;
            - `The approval step "Release approval" is not on the success
              path: runs whose steps all succeed do not wait for it.`, for an
              approval step that the change added, moved or edited, or that
              was on the success path before, when it is not on the success
              path after the change.
          example: ['Runs now start with "Deploy" (was "Build").']
    WorkflowStepRemoveResponse:
      type: object
      required: [data, change]
      description: The answer of the removal of one step.
      properties:
        data: { $ref: '#/components/schemas/WorkflowStepDeletion' }
        change: { $ref: '#/components/schemas/WorkflowStepChange' }
    WorkflowStepDeletion:
      type: object
      required: [deleted, id]
      properties:
        deleted:
          type: boolean
          enum: [true]
        id:
          type: integer
          description: The ID of the removed step.
          example: 43
    WorkflowStepRoutes:
      type: object
      required: [success, failure, closed_gate]
      description: |
        Where a run goes after each outcome of the step, as the engine
        routes it: after a success the Always branch, else On Success; after
        a failed job the Always branch, else On Failure; after a closed
        approval gate On Failure only. null for an outcome the step cannot
        have.
      properties:
        success:
          nullable: true
          description: After the step succeeds; null only for a step of an unknown type.
          allOf: [{ $ref: '#/components/schemas/WorkflowRouteTarget' }]
        failure:
          nullable: true
          description: After the step's job failed; null for approval, pause and unknown steps.
          allOf: [{ $ref: '#/components/schemas/WorkflowRouteTarget' }]
        closed_gate:
          nullable: true
          description: |
            After its approval was rejected, timed out or canceled: for
            approval steps and gated job steps (job steps whose job template
            has an approval rule) only, null for every other step; a job step
            whose job template's inventory has an approval rule is a gated
            job step too. An empty On Failure branch ends the run as failed
            here.
          allOf: [{ $ref: '#/components/schemas/WorkflowRouteTarget' }]
    WorkflowRouteTarget:
      type: object
      required: [kind, via, step_id, position, run_outcome, loop]
      description: Where one branch of a step leads.
      properties:
        kind:
          type: string
          enum: [step, end, missing]
          description: |
            `step`: the run goes on with the step `step_id`; `end`: the run
            ends; `missing`: the branch leads to a step that no longer exists
            (`step_id`), and the run fails there (`The step this branch leads
            to no longer exists (step ID 7).`).
        via:
          type: string
          enum: [on_success, on_failure, on_always, next]
          description: |
            The branch that decides it. `next`: the branch is empty, and the
            run goes on with the step at the next position; after the last
            step it ends, as succeeded after a success and as failed after a
            failure. Moving steps changes where such a branch leads.
        step_id:
          type: integer
          nullable: true
          description: The step it leads to (`step`), or the ID that no longer exists (`missing`); null for `end`.
        position:
          type: integer
          nullable: true
          description: The position of the step it leads to; null unless `kind` is `step`.
        run_outcome:
          type: string
          nullable: true
          enum: [succeeds, fails, null]
          description: |
            How the run ends here: for `end`, `succeeds` after a success and
            `fails` otherwise; `fails` for `missing`; null for `step`.
        loop:
          type: boolean
          description: Whether it leads back to the step itself or an earlier one, so the run repeats steps.
      example: { kind: step, via: next, step_id: 43, position: 3, run_outcome: null, loop: false }
    WorkflowSuccessPath:
      type: object
      required: [step_ids, end, loop_to_step_id, missing_step_id]
      description: The steps a run passes when every step succeeds, from the start step, and how that path ends.
      properties:
        step_ids:
          type: array
          items: { type: integer }
          description: The steps in the order a run passes them, the start step first; empty without steps.
          example: [41, 42, 43]
        end:
          type: string
          nullable: true
          enum: [succeeds, loop, missing, cannot_run, null]
          description: |
            `succeeds`: the path ends the run, which succeeds; `loop`: it
            leads back to a step it passed (`loop_to_step_id`), so a run
            repeats steps until one fails or the run is canceled; `missing`:
            it leads to a step that no longer exists (`missing_step_id`),
            and the run fails there; `cannot_run`: it reaches a step that
            cannot run, the last of `step_ids` (see `cannot_run` of
            `WorkflowStep`), and the run fails there; null for a workflow
            without steps.
        loop_to_step_id:
          type: integer
          nullable: true
          description: The step the path leads back to (`loop`); null otherwise.
        missing_step_id:
          type: integer
          nullable: true
          description: The step ID the path leads to that no longer exists (`missing`); null otherwise.
    WorkflowStepRoutedToError:
      type: object
      properties:
        error:
          type: object
          required: [message, step_ids]
          properties:
            message:
              type: string
              example: 'Step "Deploy" was not removed: other steps route to it (step 1 "Build", step 4 "Verify"). Edit those steps to lead elsewhere first, then remove it.'
            step_ids:
              type: array
              items: { type: integer }
              description: The steps whose branches lead to the step, in run order.
              example: [41, 44]

    WorkflowJob:
      type: object
      properties:
        id: { type: integer }
        workflow_template_id: { type: integer }
        status:
          type: string
          enum: [running, succeeded, failed, canceled]
          description: |
            The stored status. A run that waits for an approval, a resume or
            a runner is `running`; `waiting_for` says what it waits for.
        launched_by:
          type: integer
          description: |
            User ID the run belongs to: whoever launched it or, for a trigger,
            the user the trigger runs as. Its job steps run as this user.
        started_at: { type: integer, nullable: true }
        finished_at: { type: integer, nullable: true }
        created_at: { type: integer }
        waiting_for:
          type: string
          nullable: true
          enum: [approval, resume, runner, null]
          description: |
            What the run waits for at its current step (`current_step`):
            `approval`, an approval request of an approval step or of a gated
            job step (`steps[].approval` of the run); `resume`, a pause step
            waits until someone resumes the run; `runner`, the step's job is
            queued and waits for a runner. null when the run does not wait:
            its step runs, it is between two steps, or it has finished.
        current_step:
          nullable: true
          description: The step the run is at; null once the run has finished, and between two steps.
          allOf: [{ $ref: '#/components/schemas/WorkflowJobCurrentStep' }]
    WorkflowJobCurrentStep:
      type: object
      required: [id, workflow_step_id, step_name, step_type]
      description: The step execution a running run is at, its newest that still runs.
      properties:
        id:
          type: integer
          description: The step execution (`id` of `WorkflowJobStep`).
        workflow_step_id:
          type: integer
          nullable: true
          description: The step of the workflow; null once the step was removed from the workflow.
        step_name:
          type: string
          description: The step's name when it started; `—` when unknown.
        step_type:
          type: string
          nullable: true
          description: The step's type when it started, as stored.
      example: { id: 31, workflow_step_id: 42, step_name: Release approval, step_type: approval }
    WorkflowJobDetail:
      allOf:
        - $ref: '#/components/schemas/WorkflowJob'
        - type: object
          properties:
            extra_vars:
              type: object
              nullable: true
              additionalProperties: true
              description: |
                The extra vars the run was launched with, which every job
                step received; password answers as `$encrypted$`. The
                encrypted answers themselves are never returned. null when
                the run was launched without extra vars.
              example: { env: prod, db_password: '$encrypted$' }
            steps:
              type: array
              description: |
                The steps that ran or run now, in the order they started.
                They stay when steps of the workflow are removed or
                replaced.
              items: { $ref: '#/components/schemas/WorkflowJobStep' }
    WorkflowJobStep:
      type: object
      properties:
        id: { type: integer }
        workflow_step_id:
          type: integer
          nullable: true
          description: The step of the workflow that ran; null once the step was removed from the workflow.
        step_name:
          type: string
          description: The step's name when it ran; `—` when unknown.
        step_type:
          type: string
          nullable: true
          description: The step's type when it ran (`job`, `approval` or `pause`, or a type an older version stored), as stored.
        job_id: { type: integer, nullable: true, description: "The job of a job step, or the placeholder job of an approval step." }
        status:
          type: string
          enum: [pending, running, succeeded, failed, skipped]
          description: |
            The stored status. A step that waits for an approval, a resume or
            a runner is `running` (see `waiting_for`). A step that a cancel of
            its run ended is `failed`, with `error` `Not finished: the run was
            canceled.` or `Not finished: the run was canceled because its
            workflow template was deleted.`
        started_at: { type: integer, nullable: true }
        finished_at: { type: integer, nullable: true }
        waiting_for:
          type: string
          nullable: true
          enum: [approval, resume, runner, null]
          description: |
            What the step waits for while it runs: `approval` (its job waits
            for the approval request in `approval`), `resume` (a pause step)
            or `runner` (its job is queued). null when it does not wait, and
            once it has finished.
        job_status:
          type: string
          nullable: true
          enum: [pending, queued, running, succeeded, failed, canceled, timed_out, pending_approval, rejected, null]
          description: |
            The status of the step's job (`job_id`): for an approval step, of
            the placeholder job that holds its approval request. null when
            the step has no job, or its job no longer exists.
        approval_request_id:
          type: integer
          nullable: true
          description: |
            The approval request the step's job waits or waited for: of an
            approval step, or of a job step whose job template has an
            approval rule. null without one, or when the caller may not see
            it (`approval.view` and view access to the request).
          example: 12
        approval:
          nullable: true
          description: That approval request; null as `approval_request_id`.
          allOf: [{ $ref: '#/components/schemas/WorkflowJobStepApproval' }]
        error:
          type: string
          nullable: true
          description: |
            Why the step failed, or why the run could not go on after it;
            null otherwise. The messages:
            - the user the workflow runs as may not launch the step's job
              template (inactive, without `workflow.launch`, or without
              operator access to its project), as in the example;
            - `The job template of this step no longer exists.`,
              `The approval rule of this step no longer exists.`;
            - the launch was refused for a reason the message names, for
              example `The value of "db_password" is the placeholder
              $encrypted$; send the real value.`, or the approval rule of the
              job template or of its inventory (the messages of
              `JobLaunchRejected`);
            - `The job could not be launched; see the application log.`,
              `The approval request could not be created; see the application
              log.`;
            - `Not run: unknown step type "1".`, for a type that older
              versions could store;
            - `Not run: approval rule "deploy-prod" needs 1 approval(s) from
              users other than user #7, who launched this workflow, but only
              0 of its approvers may decide.`: an approval step whose request
              could never be approved;
            - `Approval request #12 was rejected.`, `... timed out.` and
              `... was canceled.` for an approval step, `Not run: approval
              request #12 was rejected.`, `... timed out.` and
              `... was canceled.` for a job step whose job waited for
              approval: the gate did not open (see `on_failure_step_id` of
              `WorkflowStep`);
            - `Not approved: the approval request of this step no longer
              exists.` for an approval step, `Not run: the approval request of
              its job no longer exists.` for a job step: the job waited for
              approval without an approval request (2.9.0 and older deleted
              the requests of a deleted rule), and the maintenance run
              canceled it; the gate did not open;
            - `The step this branch leads to no longer exists (step ID 7).`:
              a branch to a removed step, which fails the run; added to the
              step's own message, also on a step that succeeded. Steps that
              ran before 2.11.0 keep the text they stored then: `The next step
              #7 of this workflow no longer exists.`;
            - `This step was removed from the workflow while it ran, so the
              run cannot go on.`;
            - `Not finished: the run was canceled.` and `Not finished: the run
              was canceled because its workflow template was deleted.`;
            - `Not finished: the run had ended.`: the step still ran in a run
              that had ended otherwise, and the maintenance run ended it.
          example: 'Not launched: user #7, whom this workflow runs as, may not launch job template "Deploy web" (#15).'
    WorkflowJobStepApproval:
      type: object
      required: [id, status, approval_rule_id, approval_rule_name, approval_count, rejection_count, required_approvals, requested_at, expires_at, resolved_at, timeout_action, eligible_count, open_count, can_still_be_approved]
      description: |
        The approval request a step's job waits or waited for. The counts
        leave out the votes of the user who launched the run, who never
        decides. The approvers are counted, never named.
      properties:
        id:
          type: integer
          description: The approval request (see `GET /api/v1/approvals/{id}`).
        status:
          type: string
          enum: [pending, approved, rejected, timed_out, canceled]
        approval_rule_id:
          type: integer
          nullable: true
          description: The rule the request waits for; null once that rule was deleted.
        approval_rule_name:
          type: string
          nullable: true
          description: The rule's name; null once the rule was deleted.
        approval_count:
          type: integer
          description: The approvals that count.
        rejection_count:
          type: integer
          description: The rejections that count.
        required_approvals:
          type: integer
          nullable: true
          description: The approvals the rule requires; null once the rule was deleted.
        requested_at: { type: integer }
        expires_at:
          type: integer
          nullable: true
          description: When the rule's timeout runs out; null without a timeout (see `expires_at` of `ApprovalRequest`).
        resolved_at: { type: integer, nullable: true }
        timeout_action:
          type: string
          nullable: true
          enum: [approve, reject, null]
          description: |
            What the timeout does when it runs out: `approve` or `reject`
            (see `expires_at` of `ApprovalRequest`); null without a timeout,
            or once the rule was deleted.
        eligible_count:
          type: integer
          nullable: true
          description: |
            How many approvers may decide on the request (see Approvals).
            Only for the pending request of the step the run is at, in
            `GET /api/v1/workflow-jobs/{id}`; null otherwise.
        open_count:
          type: integer
          nullable: true
          description: How many of them have not voted yet; null as `eligible_count`.
        can_still_be_approved:
          type: boolean
          nullable: true
          description: |
            Whether the approvals that count and the votes still open can
            reach `required_approvals`. false: too few approvers can still
            decide, so the request can no longer be approved; an admin can
            add approvers to the rule, or cancel the run. null as
            `eligible_count`.
      example:
        id: 12
        status: pending
        approval_rule_id: 3
        approval_rule_name: deploy-prod
        approval_count: 0
        rejection_count: 0
        required_approvals: 1
        requested_at: 1792396800
        expires_at: 1792400400
        resolved_at: null
        timeout_action: reject
        eligible_count: 2
        open_count: 2
        can_still_be_approved: true
    WorkflowJobList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/WorkflowJob' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    WorkflowLaunchResult:
      type: object
      required: [workflow_job_id, waiting_for, approval_request_id]
      properties:
        workflow_job_id:
          type: integer
          description: The new run (see `GET /api/v1/workflow-jobs/{id}`).
        waiting_for:
          type: string
          nullable: true
          enum: [approval, resume, runner, null]
          description: |
            What the run waits for right after the launch, as `waiting_for`
            of `WorkflowJob`; null when its first step runs, or the run has
            already ended.
        approval_request_id:
          type: integer
          nullable: true
          description: |
            The approval request the run's first step waits for; null when
            it waits for none, or the caller may not see it. The caller
            launched the run, so another approver decides.
    WorkflowLaunchInput:
      type: object
      description: Optional launch options of a workflow run.
      properties:
        extra_vars:
          description: |
            The run's launch extra vars: a JSON object, or JSON text of one.
            Every job step of the run receives them, over its job template's
            extra vars and under the step's `extra_vars_template` mapping.
            Values under the name of a password field of any job step's job
            template are password answers, stored only encrypted. `null`,
            `""`, `[]` and `{}` mean none. An object whose keys are 0, 1, 2
            and so on reads as a list and is refused (such keys are no
            variable names). Anything that is not an object answers 422
            `The extra vars must be a JSON object, such as {"env": "prod"}.`
          oneOf:
            - { type: object, additionalProperties: true, nullable: true }
            - { type: string }
          example: { env: prod, release: '2026.10' }
    WorkflowStepsLockedError:
      type: object
      properties:
        error:
          type: object
          required: [message, workflow_job_ids]
          properties:
            message:
              type: string
              example: 'Steps cannot change while run(s) #12 of this workflow are active: wait for them to finish or cancel them.'
            workflow_job_ids:
              type: array
              items: { type: integer }
              description: Every active run of the workflow, ascending.
              example: [12]
    WorkflowTemplateDeletion:
      type: object
      required: [deleted, canceled_runs, failed_runs]
      properties:
        deleted:
          type: boolean
          enum: [true]
        canceled_runs:
          type: integer
          description: The running runs of the workflow this delete canceled.
        failed_runs:
          type: integer
          description: |
            The running runs whose cancel failed, for example on a database
            error. Such a run can still be running, or be canceled while the
            job of one of its steps still waits: no runner starts that job,
            and its approval request takes no more votes. The maintenance
            run cancels the run, or the job, later. The reason is in the
            application log.

    TriggerJobInput:
      type: object
      description: Optional launch overrides for the job template.
      properties:
        extra_vars: { type: object, additionalProperties: true, description: "Merged over the template's extra vars." }
        limit: { type: string, maxLength: 255, description: "Longer text, a list or an object is refused with 422." }
        verbosity: { type: integer, minimum: 0, maximum: 5, description: "A value below 0 or above 5, a list or an object is refused with 422." }
    TriggerWorkflowInput:
      type: object
      properties:
        extra_vars:
          description: |
            The run's launch extra vars: a JSON object, or JSON text of one.
            They are stored on the run, password answers as `$encrypted$`,
            and reach every job step: over the job template's extra vars and
            under the step's `extra_vars_template` mapping. Values under the
            name of a password field of any job step's job template stay
            encrypted in every step's job. `null`, `""` and `{}` mean none;
            anything that is not an object answers 422.
          oneOf:
            - { type: object, additionalProperties: true, nullable: true }
            - { type: string }
    TriggerJobResult:
      type: object
      required: [job_id, status]
      properties:
        job_id: { type: integer }
        status:
          type: string
          enum: [queued, pending_approval]
          description: |
            The job's status right after the launch: `pending_approval`
            when it waits for approval, because its job template has an
            approval rule, its own or its inventory's (its approval request
            is listed by `GET /api/v1/approvals`); `queued` when it waits
            for a runner. Releases before 2.12.0 answered `job_id` only.
    TriggerWorkflowResult:
      type: object
      properties:
        workflow_job_id: { type: integer }
    TriggerError:
      type: object
      description: |
        The trigger endpoints answer 403 and 500 with a plain message, and
        422 with the reason (`TriggerRejectedError`). Their other errors
        (400, 404, 405) are the web UI's HTML error page.
      properties:
        error: { type: string, enum: ['Launch refused.', 'Launch failed.'] }
    TriggerRejectedError:
      type: object
      description: Why `/trigger/fire`, `/trigger/{token}` or `/trigger/fire-workflow` launched nothing (422).
      properties:
        error:
          type: string
          example: 'The value of "db_password" is the placeholder $encrypted$; send the real value.'
    TriggerTokenCreated:
      type: object
      required: [token, trigger_user_id]
      properties:
        token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: |
            The new trigger token. Store it now: it is never shown again, and
            the server keeps only its SHA-256 hash. Send it in the
            `X-Trigger-Token` header.
          example: "<trigger-token>"
        trigger_user_id:
          type: integer
          description: The user the trigger runs as from now on, the caller.
          example: 7
    TriggerTokenRevoked:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
          enum: [true]
          description: Always true; also when the template had no token.

    RoleSummary:
      type: object
      properties:
        name: { type: string, example: operator }
        description: { type: string, example: "Launch + manage" }
        is_system: { type: boolean, example: true }
        permission_count: { type: integer, example: 15 }
        user_count: { type: integer, example: 3 }

    Role:
      type: object
      properties:
        name: { type: string, example: reader-plus }
        description: { type: string, example: "Read-only access with analytics" }
        is_system: { type: boolean, example: false }
        direct_permissions:
          type: array
          items: { type: string }
          example: [project.view, job.view, analytics.view]
        effective_permissions:
          type: array
          items: { type: string }
          description: All permissions granted, recursively walking child roles (system roles only).
          example: [project.view, job.view, analytics.view]
        user_ids:
          type: array
          items: { type: integer }
          example: [12, 34]

    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_-]{2,39}$'
          example: reader-plus
        description:
          type: string
          maxLength: 255
          example: "Read-only access with analytics"
        permissions:
          type: array
          items: { type: string }
          example: [project.view, job.view, analytics.view]

    PermissionGroup:
      type: object
      properties:
        domain: { type: string, example: project }
        label: { type: string, example: Projects }
        permissions:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: project.view }
              label: { type: string, example: "View projects" }
