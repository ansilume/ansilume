        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/approvals/{id}/approve:
    post:
      tags: [Approvals]
      summary: Approve a pending request
      description: Requires `approval.decide`.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/GenericResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/approvals/{id}/reject:
    post:
      tags: [Approvals]
      summary: Reject a pending request
      description: Requires `approval.decide`.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/GenericResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── Workflow Templates ───────────────────────
  /api/v1/workflow-templates:
    get:
      tags: [Workflow Templates]
      summary: List workflow templates
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/GenericList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Workflow Templates]
      summary: Create a workflow template
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        '201': { $ref: '#/components/responses/GenericResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflow-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Workflow Templates]
      summary: Get a workflow template
      responses:
        '200': { $ref: '#/components/responses/GenericResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Workflow Templates]
      summary: Update a workflow template
      requestBody:
        required: true
        content: { application/json: { schema: { type: object } } }
      responses:
        '200': { $ref: '#/components/responses/GenericResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Workflow Templates]
      summary: Delete a workflow template
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflow-templates/{id}/launch:
    post:
      tags: [Workflow Templates]
      summary: Launch a workflow from this template
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '201': { $ref: '#/components/responses/GenericResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ────────────────────────── Workflow Jobs ──────────────────────────
  /api/v1/workflow-jobs:
    get:
      tags: [Workflow Jobs]
      summary: List workflow job executions
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/GenericList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflow-jobs/{id}:
    get:
      tags: [Workflow Jobs]
      summary: Get a single workflow job execution
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/GenericResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflow-jobs/{id}/cancel:
    post:
      tags: [Workflow Jobs]
      summary: Cancel a running workflow job
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/GenericResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflow-jobs/{id}/resume:
    post:
      tags: [Workflow Jobs]
      summary: Resume a paused workflow step
      description: >
        Advances the workflow past the currently paused step. The pause step
        is marked as succeeded and the engine proceeds to the next step.
        Returns 422 if the workflow is already finished or has no paused step.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/GenericResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ─────────────────────────── Analytics ─────────────────────────
  /api/v1/analytics/summary:
    get:
      tags: [Analytics]
      summary: Job execution summary (totals, success rate, MTTR)
      parameters: *analyticsFilters
      responses:
        '200': { $ref: '#/components/responses/AnalyticsResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/analytics/template-reliability:
    get:
      tags: [Analytics]
      summary: Per-template reliability (success rate, avg duration)
      parameters: *analyticsFilters
      responses:
        '200': { $ref: '#/components/responses/AnalyticsResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/analytics/project-activity:
    get:
      tags: [Analytics]
      summary: Per-project job activity
      parameters: *analyticsFilters
      responses:
        '200': { $ref: '#/components/responses/AnalyticsResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/analytics/user-activity:
    get:
      tags: [Analytics]
      summary: Per-user launch counts and success rate
      parameters: *analyticsFilters
      responses:
        '200': { $ref: '#/components/responses/AnalyticsResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/analytics/host-health:
    get:
      tags: [Analytics]
      summary: Aggregated ok/changed/failed/unreachable per host
      parameters: *analyticsFilters
      responses:
        '200': { $ref: '#/components/responses/AnalyticsResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/analytics/job-trend:
    get:
      tags: [Analytics]
      summary: Daily or weekly job counts by status
      parameters: *analyticsFilters
      responses:
        '200': { $ref: '#/components/responses/AnalyticsResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/analytics/workflow-summary:
    get:
      tags: [Analytics]
      summary: Workflow execution summary (totals, success rate, avg duration)
      parameters: *analyticsFilters
      responses:
        '200': { $ref: '#/components/responses/AnalyticsResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/analytics/workflow-activity:
    get:
      tags: [Analytics]
      summary: Per-workflow-template reliability
      parameters: *analyticsFilters
      responses:
        '200': { $ref: '#/components/responses/AnalyticsResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/analytics/approval-summary:
    get:
      tags: [Analytics]
      summary: Approval request outcomes and avg decision time
      parameters: *analyticsFilters
      responses:
        '200': { $ref: '#/components/responses/AnalyticsResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/analytics/runner-activity:
    get:
      tags: [Analytics]
      summary: Per-runner job counts, success rate, and last-seen
      parameters: *analyticsFilters
      responses:
        '200': { $ref: '#/components/responses/AnalyticsResult' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ─────────────────────────── Triggers ───────────────────────────
  /trigger/fire:
    post:
      tags: [Triggers]
      summary: Public webhook endpoint to launch a job by trigger token
      description: |
        Authentication is the token itself (query parameter). This endpoint is
        **not** under `/api/v1/` and does not use the Bearer scheme. Optional
        JSON body forwards launch overrides to the underlying JobTemplate.
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                extra_vars: { type: object, additionalProperties: true }
                limit: { type: string }
                verbosity: { type: integer, minimum: 0, maximum: 4 }
            example:
              extra_vars: { env: prod }
              limit: webservers
      responses:
        '201':
          description: Job launched
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: integer }
              example:
                job_id: 42
        '404':
          description: Unknown token

  /trigger/fire-workflow:
    post:
      tags: [Triggers]
      summary: Public webhook endpoint to launch a workflow by trigger token
      description: |
        Mirror of `/trigger/fire` but for workflow templates — launches a
        WorkflowJob by the workflow template's inbound-trigger token. The
        token is hashed (SHA-256) on the server, generated tokens are shown
        to the operator exactly once. Optional JSON body forwards
        `extra_vars` to every job step the workflow runs.
      security: []
      parameters:
        - in: query
          name: token
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                extra_vars: { type: object, additionalProperties: true }
            example:
              extra_vars: { release: '2026.04' }
      responses:
        '201':
          description: Workflow launched
          content:
            application/json:
              schema:
                type: object
                properties:
                  workflow_job_id: { type: integer }
              example:
                workflow_job_id: 17
        '404':
          description: Unknown token
        '500':
          description: Workflow execution refused (e.g., template has no steps)

  # ────────────────────────────── Roles ──────────────────────────────
  /api/v1/roles:
    get:
      tags: [Roles]
      summary: List all RBAC roles (system + custom)
      responses:
        '200':
          description: List of roles with summary counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/RoleSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Roles]
      summary: Create a custom role
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
            example:
              name: reader-plus
              description: Read-only access with analytics
              permissions: [project.view, job.view, analytics.view]
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/roles/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema: { type: string, pattern: '^[a-z][a-z0-9_-]*$' }
    get:
      tags: [Roles]
      summary: Get a role with direct + effective permissions
      responses:
        '200':
          description: Role detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Roles]
      summary: Update a role's description and direct permissions
      description: |
        System roles (viewer/operator/admin) can have their permissions edited
        but not their name. The name field in the body is ignored for them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleInput' }
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Role' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Roles]
      summary: Delete a custom role
      description: |
        System roles cannot be deleted — returns 422. Users holding the role
        are left with no role and must be reassigned manually.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/permissions:
    get:
      tags: [Roles]
      summary: List all known permissions grouped by domain
      description: |
        Returns the full permission catalog used by the role management UI.
        Useful for building custom role editors.
      responses:
        '200':
          description: Grouped permission catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/PermissionGroup' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/profile/change-password:
    post:
      tags: [Profile]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
            example:
              current_password: "currentpass123"
              new_password: "newpass12345"
              new_password_confirm: "newpass12345"
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message: { type: string, example: "Password changed." }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message: { type: string }
                      fields: { type: object, additionalProperties: { type: string } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-hex
      description: API token minted via `/profile/tokens` or `php yii api-token/create`.

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }

  responses:
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Unauthorized:
      description: Authentication required (missing or invalid token)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    Forbidden:
      description: Caller lacks the required permission
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ValidationError:
      description: Invalid input
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    ServerError:
      description: Server-side failure (e.g. directory unreachable)
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
    DeletedResponse:
      description: Deletion confirmed
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  deleted: { type: boolean }
    GenericResponse:
      description: Success
      content: { application/json: { schema: { type: object, properties: { data: { type: object } } } } }
    AnalyticsResult:
      description: |
        Analytics report result. When `format=json` the body wraps the report
        under `data.result` with the echoed filter set under `data.filters`.
        When `format=csv` the body is raw CSV and `data` is null.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  filters:
                    type: object
                    description: Echo of the filter parameters that were applied
                  result:
                    description: |
                      Report payload — shape depends on the endpoint. Summary
                      endpoints return an object; list endpoints return an
                      array of rows.
                    oneOf:
                      - { type: object }
                      - { type: array, items: { type: object } }
        text/csv:
          schema:
            type: string
            description: CSV export (only when `format=csv`)
    InventoryResponse:
      description: Inventory
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Inventory' }
    CredentialResponse:
      description: Credential (secrets never included)
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Credential' }
    CredentialDetailResponse:
      description: Credential with secret status and usage (secrets never included)
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/CredentialDetail' }
    VaultAssignmentCandidatesResponse:
      description: Job templates the caller may change
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: { $ref: '#/components/schemas/VaultAssignmentCandidate' } }
    VaultAssignmentResponse:
      description: Outcome per job template
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/VaultAssignmentResult' }
    CredentialInUse:
      description: The credential is in use; nothing was deleted
      content: { application/json: { schema: { $ref: '#/components/schemas/CredentialInUseError' } } }
    VaultAssignmentRejected:
      description: The request was rejected; nothing was written
      content: { application/json: { schema: { $ref: '#/components/schemas/VaultAssignmentError' } } }
    JobDetailResponse:
      description: Job with its credentials (secrets never included)
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/JobDetail' }
    JobLaunchResponse:
      description: The launched job, with the template's warnings
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/JobDetail' }
              warnings:
                type: array
                items: { $ref: '#/components/schemas/JobTemplateWarning' }
    ProjectVaultResponse:
      description: Vault overview of the project
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/ProjectVault' }
    ProjectResponse:
      description: Project
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Project' }
    JobTemplateResponse:
      description: Job template
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/JobTemplate' }
    JobResponse:
      description: Job
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Job' }
    ScheduleResponse:
      description: Schedule
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Schedule' }
    RunnerGroupResponse:
      description: Runner group
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/RunnerGroup' }
    RunnerResponse:
      description: Runner
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Runner' }
    TeamResponse:
      description: Team with members and projects
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/TeamDetail' }
    UserResponse:
      description: User (sensitive fields excluded)
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/User' }
    WebhookResponse:
      description: Webhook
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/Webhook' }
    AuditLogResponse:
      description: Audit log entry
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/AuditLog' }
    NotificationTemplateResponse:
      description: Notification template
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { $ref: '#/components/schemas/NotificationTemplate' }

  schemas:
    ChangePasswordInput:
      type: object
      required: [current_password, new_password, new_password_confirm]
      properties:
        current_password: { type: string, description: "User's current password" }
        new_password: { type: string, minLength: 8, maxLength: 72, description: "New password (8-72 characters)" }
        new_password_confirm: { type: string, description: "Must match new_password" }
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message: { type: string }
    PaginationMeta:
      type: object
      properties:
        total:    { type: integer }
        page:     { type: integer }
        per_page: { type: integer }
        pages:    { type: integer }

    Project:
      type: object
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string, nullable: true }
        scm_type:    { type: string, enum: [manual, git] }
        scm_url:     { type: string, nullable: true }
        scm_branch:  { type: string, nullable: true }
        status:      { type: string, enum: [new, syncing, synced, error] }
        last_synced_at: { type: integer, nullable: true, description: Unix timestamp }
        created_at:  { type: integer, description: Unix timestamp }
        vault_password_source:
          type: string
          enum: [ansilume, repository]
          description: |
            `ansilume`: runners use only the job template's vault password and
            ignore the vault settings of the repository's ansible.cfg (default
            for new projects). `repository`: runners also apply them (projects
            created before 2.8). Runners older than 2.8 always behave like
            `repository`.
        vault_scanned_at: { type: integer, nullable: true, description: Unix timestamp of the last vault scan }
    ProjectVault:
      type: object
      properties:
        password_source: { type: string, enum: [ansilume, repository] }
        password_source_label: { type: string, example: Ansilume only }
        scanned_at: { type: integer, nullable: true }
        commit: { type: string, nullable: true, description: "The commit the scan saw, for git projects" }
        error: { type: string, nullable: true, description: "Why there is no scan, e.g. no checkout yet" }
        truncated: { type: boolean, description: "The scan stopped at a limit (files, size, entries or time)" }
        files_scanned: { type: integer }
        repository_settings:
          nullable: true
          allOf: [{ $ref: '#/components/schemas/ProjectVaultSettings' }]
        findings: { type: array, items: { $ref: '#/components/schemas/ProjectVaultFinding' } }
        vault_ids: { type: array, items: { type: string }, example: [prod] }
        entries: { type: array, items: { $ref: '#/components/schemas/ProjectVaultEntry' } }
        templates: { type: array, items: { $ref: '#/components/schemas/ProjectVaultTemplate' } }
        runners_without_support:
          type: array
          description: |
            In `ansilume` mode, runners of the project's runner groups that are
            too old to ignore the repository's vault settings. Empty without
            `runner-group.view`; runners_without_support_count still counts them.
          items: { $ref: '#/components/schemas/ProjectVaultRunner' }
        runners_without_support_count: { type: integer, description: "How many such runners there are, whatever the viewer may see" }
    ProjectVaultSettings:
      type: object
      description: Vault settings found in the repository's ansible.cfg.
      properties:
        vault_password_file: { type: string, nullable: true }
        vault_identity_list: { type: string, nullable: true }
        ask_vault_pass: { type: boolean }
        vault_id_match: { type: boolean }
        vault_encrypt_salt: { type: boolean }
    ProjectVaultFinding:
      type: object
      properties:
        code:
          type: string
          enum: [password_file_committed, password_script, ask_vault_pass, vault_id_match, encrypt_salt, malformed, truncated]
        path: { type: string, nullable: true }
        message: { type: string }
    ProjectVaultEntry:
      type: object
      properties:
        path: { type: string, example: inventories/prod/group_vars/all/vault.yml }
        kind: { type: string, enum: [file, inline] }
        line: { type: integer, nullable: true, description: First line of an inline value }
        key: { type: string, nullable: true, description: Variable name of an inline value }
        vault_id: { type: string, nullable: true, description: Vault ID from a format 1.2 header }
        format_version: { type: string, nullable: true, example: '1.2' }
        error: { type: string, nullable: true, description: Why Ansible cannot read it }
    ProjectVaultTemplate:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        status:
          type: string
          nullable: true
          enum: [ok, mismatch, missing_password, unusable_password, repo_managed, no_files, stale, damaged, incomplete]
          description: |
            `ok`: the vault password opens every encrypted file and value the
            template probably loads. `mismatch`: it does not open some (or, with
            vault_id_match in the repository's ansible.cfg in `repository` mode,
            cannot be tried on them). `missing_password`: the template has none.
            `unusable_password`: its secret cannot be used. `repo_managed`: the
            repository's ansible.cfg supplies passwords Ansilume cannot check.
            `no_files`: nothing encrypted to load. `stale`: the checkout changed
            since the scan, or the check is from an older scan. `damaged`: some
            of them are damaged, Ansible cannot read them whatever the password.
            `incomplete`: not everything could be checked, see
            incomplete_reason. null: not checked yet.
        incomplete_reason:
          type: string
          nullable: true
          enum: [scan_limit, time_limit, file_name]
          description: |
            For `incomplete`. `scan_limit`: the scan stopped at a limit, so it
            may have missed files. `time_limit`: the check ran out of time.
            `file_name`: file names that are not valid UTF-8 (listed in unopened).
        credential:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            name: { type: string, nullable: true, description: "null without credential.view or job-template.view" }
        relevant_count: { type: integer }
        unopened_count:
          type: integer
          description: |
            How many entries are behind the status: those the vault password
            does not open (`mismatch`, `repo_managed`), the damaged ones
            (`damaged`), those with unreadable file names (`incomplete`).
        unopened:
          type: array
          description: "The first of them (at most 40)"
          items:
            type: object
            properties:
              path: { type: string }
              line: { type: integer, nullable: true }
              key: { type: string, nullable: true }
              reason:
                type: string
                nullable: true
                enum: [vault_id_match]
                description: "vault_id_match: the password is not tried on this vault ID. null: the password does not open it"
        checked_at: { type: integer, nullable: true }
    ProjectVaultRunner:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        group: { type: string, nullable: true }
        software_version: { type: string, nullable: true }
    ProjectList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Project' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Inventory:
      type: object
      properties:
        id:             { type: integer }
        name:           { type: string }
        description:    { type: string, nullable: true }
        inventory_type: { type: string, enum: [static, dynamic, file] }
        project_id:     { type: integer, nullable: true }
        created_at:     { type: integer }
        updated_at:     { type: integer }
    InventoryInput:
      type: object
      required: [name, inventory_type]
      properties:
        name:           { type: string, maxLength: 128 }
        description:    { type: string, nullable: true }
        inventory_type: { type: string, enum: [static, dynamic, file] }
        content:        { type: string, description: Required when inventory_type = static }
        source_path:    { type: string, description: Required when inventory_type = file }
        project_id:     { type: integer, nullable: true }
    InventoryList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Inventory' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Credential:
      type: object
      description: Secret material is never returned by the API.
      properties:
        id:              { type: integer }
        name:            { type: string }
        description:     { type: string, nullable: true }
        credential_type: { type: string, enum: [ssh_key, username_password, vault, token] }
        username:        { type: string, nullable: true }
        env_var_name:    { type: string, nullable: true, description: "Environment variable a token credential is exposed as. null means ANSILUME_CREDENTIAL_TOKEN." }
        created_at:      { type: integer }
        updated_at:      { type: integer }
    CredentialInput:
      type: object
      required: [name, credential_type]
      properties:
        name:            { type: string, maxLength: 128 }
        description:     { type: string, nullable: true }
        credential_type: { type: string, enum: [ssh_key, username_password, vault, token] }
        username:        { type: string, nullable: true }
        env_var_name:    { type: string, nullable: true, maxLength: 128, pattern: '^[A-Z_][A-Z0-9_]*$', description: "Token credentials only. Blank or null uses ANSILUME_CREDENTIAL_TOKEN." }
        secrets:
          type: object
          description: |
            Secret fields keyed by name. Only the key of `credential_type`
            counts; keys of other types are ignored. Blank values count as not
            provided. On create the key is required; on update a blank or
            missing key keeps the stored secret.

              * `ssh_key`           → `private_key` (PEM)
              * `username_password` → `password`
              * `vault`             → `vault_password`
              * `token`             → `token`
          additionalProperties: { type: string }
    CredentialList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Credential' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    CredentialDetail:
      allOf:
        - $ref: '#/components/schemas/Credential'
        - type: object
          properties:
            secret_status:
              type: string
              enum: [ok, incomplete, undecryptable]
              description: |
                `ok`: the secret of the type is stored. `incomplete`: it is
                missing, as in credentials saved before validation existed;
                jobs get no secret from it. `undecryptable`: it cannot be
                decrypted, usually because APP_SECRET_KEY changed; jobs that
                use it fail before they start.
            used_by: { $ref: '#/components/schemas/CredentialUsage' }
    CredentialUsage:
      type: object
      description: The lists only hold what the caller may see; the hidden counts cover the rest.
      properties:
        in_use: { type: boolean }
        job_templates:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              project_id: { type: integer }
              project_name: { type: string, nullable: true }
              role: { type: string, enum: [primary, additional] }
        projects:
          type: array
          description: Projects that use the credential to clone their repository.
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        hidden_job_template_count: { type: integer }
        hidden_project_count: { type: integer }
        pending_job_count: { type: integer, description: "Jobs that have not started yet (pending, queued or waiting for approval) and need the credential." }
    VaultAssignmentCandidate:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        project_id: { type: integer }
        project_name: { type: string, nullable: true }
        current:
          type: string
          enum: [none, this, other, multiple]
          description: The template's vault passwords now. `multiple` marks a template with more than one.
        vaults:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
    VaultAssignmentInput:
      type: object
      required: [job_template_ids]
      properties:
        job_template_ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: integer, minimum: 1 }
    VaultAssignmentItem:
      type: object
      properties:
        job_template_id: { type: integer }
        name: { type: string }
        status:
          type: string
          enum: [assigned, replaced, unchanged, failed]
        replaced:
          type: array
          description: The vault passwords this one replaced or detached.
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
        error: { type: string, nullable: true, description: "Why the template could not be saved (status failed)." }
    VaultAssignmentResult:
      type: object
      properties:
        credential_id: { type: integer }
        credential_name: { type: string }
        results: { type: array, items: { $ref: '#/components/schemas/VaultAssignmentItem' } }
        summary:
          type: object
          properties:
            assigned: { type: integer }
            replaced: { type: integer }
            unchanged: { type: integer }
            failed: { type: integer }
    CredentialInUseError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
              example: 'Credential "deploy-key" is in use by 2 job template(s). Pass force=1 to delete it anyway; it will be detached from all of them.'
            used_by: { $ref: '#/components/schemas/CredentialUsage' }
    VaultAssignmentError:
      type: object
      properties:
        error:
          type: object
          required: [message]
          properties:
            message:
              type: string
              example: 'You may not change job template(s) #12, #15.'
            job_template_ids:
              type: array
              items: { type: integer }
              example: [12, 15]
              description: >-
                The job template IDs the error is about: not found (422) or
                not changeable (403). Absent for errors about the credential
                or the shape of the list.

    JobTemplate:
      type: object
      properties:
        id:              { type: integer }
        name:            { type: string }
        description:     { type: string, nullable: true }
        project_id:      { type: integer }
        project_name:    { type: string, nullable: true }
        inventory_id:    { type: integer }
        inventory_name:  { type: string, nullable: true }
        runner_group_id: { type: integer, nullable: true }
        credential_id:   { type: integer, nullable: true, description: "The primary credential." }
        credential_ids:
          type: array
          items: { type: integer }
          description: The additional credentials in precedence order, after the primary one.
        credentials:
          type: array
          description: All credentials in precedence order, primary first. Never includes secrets.
          items: { $ref: '#/components/schemas/JobTemplateCredential' }
        playbook:        { type: string }
        verbosity:       { type: integer }
        forks:           { type: integer }
        become:          { type: boolean }
        become_method:   { type: string, nullable: true }
        become_user:     { type: string, nullable: true }
        limit:           { type: string, nullable: true }
        tags:            { type: string, nullable: true }
        skip_tags:       { type: string, nullable: true }
        has_survey:      { type: boolean }
        warnings:
          type: array
          description: Problems jobs of this template may run into. They never block a launch.
          items: { $ref: '#/components/schemas/JobTemplateWarning' }
        created_at:      { type: integer }
        updated_at:      { type: integer }
    JobTemplateWarning:
      type: object
      properties:
        code:
          type: string
          enum: [multiple_vault_credentials, inventory_other_project, vault_password_mismatch, vault_password_missing, vault_file_damaged, vault_check_incomplete]
          description: |
            `multiple_vault_credentials`: more than one vault password; Ansible
            only gets the first. `inventory_other_project`: a file or dynamic
            inventory of another project, which the runner never reads.
            `vault_password_mismatch`: the vault password does not open some
            encrypted files or values the template probably loads, or has no
            usable secret. `vault_password_missing`: the template probably
            loads encrypted content but has no vault password.
            `vault_file_damaged`: encrypted files or values it probably loads
            are damaged; Ansible cannot read them. `vault_check_incomplete`:
            the check could not cover everything (a limit of the scan or the
            check, or file names that are not UTF-8). The vault warnings come
            from the project's last vault scan; a check from an older scan
            gives none.
        message: { type: string }
        credential_ids:
          type: array
          items: { type: integer }
          description: For multiple_vault_credentials, the vault passwords that are ignored; for vault_password_mismatch, the checked one.
    JobTemplateCredential:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        credential_type: { type: string, enum: [ssh_key, username_password, vault, token] }
        role: { type: string, enum: [primary, additional] }
    JobTemplateList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/JobTemplate' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Job:
      type: object
      properties:
        id:              { type: integer }
        job_template_id: { type: integer, nullable: true }
        template_name:   { type: string, nullable: true }
        status:
          type: string
          enum: [pending, queued, running, succeeded, failed, canceled, timed_out, pending_approval, rejected]
        launched_by:     { type: string, nullable: true, description: "Username of whoever launched the job." }
        extra_vars:      { type: object, nullable: true, additionalProperties: true }
        limit:           { type: string, nullable: true }
        verbosity:       { type: integer, nullable: true }
        check_mode:      { type: boolean }
        exit_code:       { type: integer, nullable: true, description: "-1 when the job ended without an exit code from ansible, for example after a timeout or a failure before execution." }
        execution_command: { type: string, nullable: true }
        artifact_count:  { type: integer }
        queued_at:       { type: integer, nullable: true }
        started_at:      { type: integer, nullable: true }
        finished_at:     { type: integer, nullable: true }
        created_at:      { type: integer }
    JobDetail:
      allOf:
        - $ref: '#/components/schemas/Job'
        - type: object
          properties:
            credentials:
              type: array
              description: The job's credentials as launched, primary first. Never includes secrets.
              items: { $ref: '#/components/schemas/JobCredential' }
    JobCredential:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, nullable: true, description: "The name at launch time." }
        credential_type: { type: string, nullable: true }
        role: { type: string, enum: [primary, additional] }
        deleted: { type: boolean, description: "The credential was deleted after the launch." }
    JobLaunchInput:
      type: object
      required: [job_template_id]
      properties:
        job_template_id: { type: integer }
        template_id: { type: integer, deprecated: true, description: "Older name of job_template_id, still accepted." }
        extra_vars:
          description: Extra vars for this run, merged over the template's. An object or a JSON string.
          oneOf:
            - { type: object, additionalProperties: true }
            - { type: string }
        limit: { type: string }
        verbosity: { type: integer, minimum: 0, maximum: 5 }
        check_mode: { type: boolean }
      example:
        job_template_id: 12
        extra_vars: { app_version: "1.4.2" }
        limit: web
    JobArtifact:
      type: object
      properties:
        id:           { type: integer }
        display_name: { type: string }
        mime_type:    { type: string }
        size_bytes:   { type: integer }
        previewable:  { type: boolean, description: "True for text/JSON/XML/YAML — fetch via /content endpoint." }
        image:        { type: boolean, description: "True for image/png|jpeg|gif|webp — fetch via /download?inline=1 to embed as <img>." }
        inline_frame: { type: boolean, description: "True for application/pdf — fetch via /download?inline=1 to embed in sandboxed <iframe>." }
        created_at:   { type: integer }
    ArtifactStorageStats:
      type: object
      properties:
        stats:
          type: object
          properties:
            total_bytes:    { type: integer, description: "Sum of all stored artifact bytes." }
            artifact_count: { type: integer }
            job_count:      { type: integer, description: "Number of distinct jobs that have at least one artifact." }
        top_jobs:
          type: array
          description: Top ten jobs by total artifact bytes, descending.
          items:
            type: object
            properties:
              job_id:         { type: integer }
              total_bytes:    { type: integer }
              artifact_count: { type: integer }
        config:
          type: object
          properties:
            retention_days:        { type: integer, description: "0 = keep forever." }
            max_file_size:         { type: integer, description: "Per-file byte cap." }
            max_artifacts_per_job: { type: integer }
            max_bytes_per_job:     { type: integer, description: "0 = unlimited." }
            max_total_bytes:       { type: integer, description: "Global cap; 0 = unlimited." }
            max_jobs_with_artifacts: { type: integer, description: "Keep only the N most recent jobs with artifacts; 0 = unlimited." }
    JobList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Job' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Schedule:
      type: object
      properties:
        id:              { type: integer }
        name:            { type: string }
        job_template_id: { type: integer }
        cron_expression: { type: string }
        timezone:        { type: string }
        enabled:         { type: boolean }
        last_run_at:     { type: integer, nullable: true }
        next_run_at:     { type: integer, nullable: true }
        created_at:      { type: integer }
        updated_at:      { type: integer }
    ScheduleList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Schedule' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    NotificationTemplate:
      type: object
      description: >
        Global notification subscription. Fires on any listed event across the
        platform — no per-template pivot. Supported events (15):
        job.launched, job.succeeded, job.failed, job.canceled,
        workflow.launched, workflow.succeeded, workflow.failed, workflow.canceled, workflow.step_failed,
        approval.requested, approval.approved, approval.rejected,
        schedule.failed_to_launch, runner.offline, runner.recovered,
        project.sync_failed, project.sync_succeeded, webhook.invalid_token.
      properties:
        id:          { type: integer }
        name:        { type: string }
        description: { type: string, nullable: true }
        channel:     { type: string, enum: [email, slack, teams, webhook, telegram, pagerduty] }
        events:
          type: array
          items: { type: string }
          description: Event names this template subscribes to.
        config:
          type: object
          description: >
            Channel-specific config. email → {emails:[]}, slack/teams → {webhook_url},
            webhook → {url, headers?}, telegram → {bot_token, chat_id},
            pagerduty → {routing_key}.
        subject_template: { type: string, nullable: true }
        body_template:    { type: string, nullable: true }
        created_by:  { type: integer }
        created_at:  { type: integer }
        updated_at:  { type: integer }
    NotificationTemplateInput:
      type: object
      required: [name, channel, events]
      properties:
        name:             { type: string, maxLength: 128 }
        description:      { type: string, nullable: true }
        channel:          { type: string, enum: [email, slack, teams, webhook, telegram, pagerduty] }
        events:           { type: string, description: 'Comma-separated event names' }
        config:           { type: string, description: 'JSON string with channel-specific settings' }
        subject_template: { type: string, nullable: true, maxLength: 512 }
        body_template:    { type: string, nullable: true }
    NotificationTemplateList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/NotificationTemplate' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    ProjectInput:
      type: object
      required: [name, scm_type]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true }
        scm_type: { type: string, enum: [manual, git] }
        scm_url: { type: string, nullable: true }
        scm_branch: { type: string, nullable: true }
        scm_credential_id: { type: integer, nullable: true }
        vault_password_source:
          type: string
          enum: [ansilume, repository]
          description: Defaults to `ansilume` for new projects.

    JobTemplateInput:
      type: object
      required: [name, project_id, inventory_id, playbook]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true }
        project_id: { type: integer }
        inventory_id: { type: integer, description: "A file or dynamic inventory must belong to project_id; static inventories work with any project." }
        credential_id: { type: integer, nullable: true, description: "The primary credential. Its username and key win over the additional ones." }
        credential_ids:
          type: array
          items: { type: integer }
          description: |
            The additional credentials in precedence order. Omit the key to
            keep the current ones; `[]` removes them all. The primary
            credential and duplicates are skipped. Unknown IDs are rejected
            with 422. At most one vault password across the primary and the
            additional credentials; more is rejected with 422.
        playbook: { type: string }
        extra_vars: { type: string, nullable: true }
        verbosity: { type: integer, minimum: 0, maximum: 5, default: 0 }
        forks: { type: integer, minimum: 1, default: 5 }
        become: { type: boolean, default: false }
        become_method: { type: string, default: sudo }
        become_user: { type: string, default: root }
        limit: { type: string, nullable: true }
        tags: { type: string, nullable: true }
        skip_tags: { type: string, nullable: true }
        timeout_minutes: { type: integer, default: 120 }
        runner_group_id: { type: integer, nullable: true }
        approval_rule_id: { type: integer, nullable: true }
        survey_fields: { type: string, nullable: true, description: JSON array of survey field definitions }

    ScheduleInput:
      type: object
      required: [name, job_template_id, cron_expression]
      properties:
        name: { type: string, maxLength: 128 }
        job_template_id: { type: integer }
        cron_expression: { type: string, description: "Standard 5-field cron expression" }
        timezone: { type: string, default: UTC }
        extra_vars: { type: string, nullable: true }
        enabled: { type: boolean, default: true }

    RunnerGroup:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        runner_count: { type: integer }
        created_at: { type: integer }
    RunnerGroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true }
    RunnerGroupList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/RunnerGroup' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    Runner:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        runner_group_id: { type: integer }
        runner_group_name: { type: string, nullable: true }
        is_online: { type: boolean }
        last_seen_at: { type: integer, nullable: true }
        software_version:
          type: string
          nullable: true
          description: >-
            Semver version the runner reported on its most recent heartbeat.
            `null` for runners that have not yet reported (pre-upgrade
            images). Capped at 32 characters on the server side.
          example: "2.2.16"
        capabilities:
          type: array
          items: { type: string, enum: [vault_password_source] }
          description: >-
            Features the runner reported on its most recent request, limited to
            names this server knows. `vault_password_source`: the runner honours a
            project's vault password source and, for "Ansilume only" projects,
            neutralises the repository's ansible.cfg vault settings. Empty for
            runners that report nothing, including every runner older than 2.8;
            those apply the repository's vault settings whatever the project says.
          example: [vault_password_source]
        transport:
          type: string
          nullable: true
          enum: [https, http_internal, http_external]
          description: |
            How the runner's last request reached the server. `http_internal`:
            plain HTTP from a trusted network (RUNNER_TRUSTED_NETWORKS, by
            default loopback and private ranges, which covers the bundled
            runners). `http_external`: plain HTTP from elsewhere, so claim
            responses carry decrypted credentials in clear. X-Forwarded-Proto
            and X-Forwarded-For count only from trusted peers. `null` until the
            first request after the upgrade.
        transport_insecure: { type: boolean, description: "True for http_external." }
        remote_addr: { type: string, nullable: true, example: "203.0.113.7", description: "Client address of the last request." }
        plaintext_seen_at: { type: integer, nullable: true, description: "Last http_external request; kept after a fix." }
        last_reregistered_at:
          type: integer
          nullable: true
          description: >-
            When self-registration last issued this runner a new token, which
            revokes the previous one. `null` if that never happened. Audited
            as `runner.reregistered`.
        reregistrations_24h:
          type: integer
          description: >-
            Self-registrations of this runner within the last 24 hours. More
            than one usually means two runners share a RUNNER_NAME, or someone
            else registered with it.
        created_at: { type: integer }
    RunnerMoveInput:
      type: object
      required: [target_group_id]
      properties:
        target_group_id: { type: integer, description: ID of the target runner group }
    RunnerList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Runner' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    TeamSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        member_count: { type: integer }
        project_count: { type: integer }
        created_at: { type: integer }
    TeamDetail:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        members:
          type: array
          items:
            type: object
            properties:
              user_id: { type: integer }
              username: { type: string }
        projects:
          type: array
          items:
            type: object
            properties:
              project_id: { type: integer }
              name: { type: string }
              role: { type: string }
        created_at: { type: integer }
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 128 }
        description: { type: string, nullable: true }
    TeamList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TeamSummary' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    User:
      type: object
      description: Sensitive fields (password_hash, auth_key, totp_secret, recovery_codes) are never returned.
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        status: { type: integer, description: "10 = active, 0 = inactive" }
        is_superadmin: { type: boolean }
        totp_enabled: { type: boolean }
        role: { type: string, nullable: true }
        auth_source:
          type: string
          enum: [local, ldap]
          description: |
            Where the account authenticates. `local` uses the bcrypt password
            stored in Ansilume; `ldap` binds against the configured directory.
            Immutable once the user exists.
        ldap_dn: { type: string, nullable: true, description: Distinguished name set after the first directory bind (LDAP users only). }
        ldap_uid: { type: string, nullable: true, description: Stable directory identifier (objectGUID/entryUUID). LDAP users only. }
        last_synced_at: { type: integer, nullable: true, description: Unix timestamp of the most recent LDAP attribute sync. }
        created_at: { type: integer }
        updated_at: { type: integer }
    UserInput:
      type: object
      required: [username, email]
      properties:
        username: { type: string, maxLength: 128 }
        email: { type: string, format: email }
        password:
          type: string
          minLength: 5
          description: Required on create for local users; rejected for LDAP users. Optional on update.
        status: { type: integer }
        is_superadmin: { type: boolean }
        role: { type: string, description: RBAC role name to assign }
        auth_source:
          type: string
          enum: [local, ldap]
          default: local
          description: |
            Authentication source. Set on create; immutable thereafter — sending
            a different value on update returns 422. Defaults to `local`.
        ldap_dn:
          type: string
          nullable: true
          description: Optional DN. If omitted, the directory bind fills it on first login.
        ldap_uid:
          type: string
          nullable: true
          description: Optional stable directory identifier. Filled by directory sync if omitted.
    UserList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/User' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    LdapDiagnosticResult:
      type: object
      description: |
        LDAP connection diagnostic and optional user-lookup result.
        Never includes secrets — passwords are not echoed.
      properties:
        connection:
          type: object
          properties:
            enabled: { type: boolean }
            host: { type: string }
            encryption:
              type: string
              enum: [none, starttls, ldaps]
            base_dn: { type: string }
            bind_dn_configured: { type: boolean, description: True if a service account DN is set; the password itself is never returned. }
            service_bind: { type: boolean, description: Whether the service-account bind succeeded. }
            error: { type: string, nullable: true, description: Human-readable error if the bind failed. }
        user:
          type: object
          nullable: true
          description: Present only when the request supplies a username.
          properties:
            found: { type: boolean }
            dn: { type: string, nullable: true }
            uid: { type: string, nullable: true }
            username: { type: string, nullable: true }
            email: { type: string, nullable: true }
            display_name: { type: string, nullable: true }
            groups: { type: array, items: { type: string } }
            mapped_roles: { type: array, items: { type: string } }
            error: { type: string, nullable: true, description: Set when found=false. }

    Webhook:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        url: { type: string }
        events: { type: string, description: Comma-separated event names }
        enabled: { type: boolean }
        created_at: { type: integer }
        updated_at: { type: integer }
    WebhookInput:
      type: object
      required: [name, url]
      properties:
        name: { type: string, maxLength: 128 }
        url: { type: string, format: uri }
        secret: { type: string, nullable: true }
        events:
          description: Event names as array or comma-separated string
          oneOf:
            - { type: array, items: { type: string } }
            - { type: string }
        enabled: { type: boolean, default: true }
    WebhookList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Webhook' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    AuditLog:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer, nullable: true }
        action: { type: string }
        object_type: { type: string, nullable: true }
        object_id: { type: integer, nullable: true }
        metadata: { type: object, nullable: true, description: Parsed JSON context }
        ip_address: { type: string, nullable: true }
        created_at: { type: integer }
    AuditLogList:
      type: object
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AuditLog' } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    GenericList:
      type: object
      properties:
        data: { type: array, items: { type: object } }
        meta: { $ref: '#/components/schemas/PaginationMeta' }

    RoleSummary:
      type: object
      properties:
        name: { type: string, example: operator }
        description: { type: string, example: "Launch + manage" }
        is_system: { type: boolean, example: true }
        permission_count: { type: integer, example: 15 }
        user_count: { type: integer, example: 3 }

    Role:
      type: object
      properties:
        name: { type: string, example: reader-plus }
        description: { type: string, example: "Read-only access with analytics" }
        is_system: { type: boolean, example: false }
        direct_permissions:
          type: array
          items: { type: string }
          example: [project.view, job.view, analytics.view]
        effective_permissions:
          type: array
          items: { type: string }
          description: All permissions granted, recursively walking child roles (system roles only).
          example: [project.view, job.view, analytics.view]
        user_ids:
          type: array
          items: { type: integer }
          example: [12, 34]

    RoleInput:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
          pattern: '^[a-z][a-z0-9_-]{2,39}$'
          example: reader-plus
        description:
          type: string
          maxLength: 255
          example: "Read-only access with analytics"
        permissions:
          type: array
          items: { type: string }
          example: [project.view, job.view, analytics.view]

    PermissionGroup:
      type: object
      properties:
        domain: { type: string, example: project }
        label: { type: string, example: Projects }
        permissions:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: project.view }
              label: { type: string, example: "View projects" }
