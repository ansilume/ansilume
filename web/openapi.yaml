  # ────────────────────────────── Approvals ──────────────────────────────
  /api/v1/approvals:
    get:
      tags: [Approvals]
      summary: List approval requests
      description: |
        Requires `approval.view`. Lists approval requests of every status
        (pending, approved, rejected, timed out), newest first, 25 per page.
        Only the requests the caller may see: those of jobs whose project the
        caller may view and those of workflow approval steps whose workflow
        the caller may view.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequestList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/approvals/{id}:
    get:
      tags: [Approvals]
      summary: Get an approval request
      description: Requires `approval.view` and view access to the request (403 otherwise), as for the list.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/ApprovalRequestResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/approvals/{id}/approve:
    post:
      tags: [Approvals]
      summary: Approve a pending request
      description: |
        Requires `approval.decide`. A request the caller may not see answers
        403 `Forbidden.` Deciding also needs a place on the rule's approver
        list and a pending request; otherwise 403 `You are not eligible to
        decide on this request.` A second vote of the same caller answers
        422. Only approvers who may see the request count toward the rule's
        threshold: once the approvals still possible cannot reach it, the
        request is rejected. The decision changes only a job that still
        waits for approval: a job or workflow run canceled in the meantime
        stays canceled, although its request stays pending until decided.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionInput' }
            example:
              comment: Change window confirmed
      responses:
        '200': { $ref: '#/components/responses/ApprovalRequestResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/approvals/{id}/reject:
    post:
      tags: [Approvals]
      summary: Reject a pending request
      description: |
        Requires `approval.decide`; the same checks as approve (403 for a
        request the caller may not see or may not decide on, 422 for a second
        vote). As with approve, a job or workflow run canceled in the
        meantime stays canceled.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionInput' }
      responses:
        '200': { $ref: '#/components/responses/ApprovalRequestResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ─────────────────────── Workflow Templates ───────────────────────
  /api/v1/workflow-templates:
    get:
      tags: [Workflow Templates]
      summary: List workflow templates
      description: |
        Requires `workflow-template.view`. Lists only the workflow templates
        the caller may see: view access to the project of every job step.
        Workflows without job steps are listed for everyone with the
        permission. Newest first, 25 per page, without the steps.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowTemplateList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Workflow Templates]
      summary: Create a workflow template
      description: |
        Requires `workflow-template.create`. The caller becomes `created_by`;
        `created_by` and trigger token fields in the body are ignored.

        `steps` lists the steps in run order, see `WorkflowStepInput`. The
        job template of every job step must be one the caller may operate:
        job templates that do not exist, are deleted or belong to a project
        the caller cannot see answer 422, visible ones the caller may not
        operate answer 403, and both name the offending templates in
        `error.job_template_ids`. An invalid step answers 422 with a message
        that names it (`steps[1]: Name cannot be blank.`), unknown approval
        rules answer 422 as well. Nothing is written unless the template and
        every step are valid; the template and its steps are then written in
        one transaction.

        Branches (`on_success_step_id`, `on_failure_step_id`,
        `on_always_step_id`) cannot be set through the API. Steps written
        here have none: each continues with the next step in order, whatever
        its outcome. Set branches in the web UI.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowTemplateInput' }
            example:
              name: Release web
              description: Build, approve, deploy
              steps:
                - name: Build
                  step_type: job
                  job_template_id: 12
                - name: Release approval
                  step_type: approval
                  approval_rule_id: 3
                - name: Deploy
                  step_type: job
                  job_template_id: 15
                  extra_vars_template: { app_version: build_version }
      responses:
        '201': { $ref: '#/components/responses/WorkflowTemplateResponse' }
        '403':
          description: |
            Missing `workflow-template.create`, or a job step uses a job
            template the caller can see but may not operate (named in
            `error.job_template_ids`). Nothing was written.
          content: { application/json: { schema: { $ref: '#/components/schemas/JobTemplateRefError' } } }
        '422':
          description: |
            Invalid template or step, an unknown approval rule, or job
            templates that do not exist for the caller (named in
            `error.job_template_ids`). Nothing was written.
          content: { application/json: { schema: { $ref: '#/components/schemas/JobTemplateRefError' } } }
  /api/v1/workflow-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Workflow Templates]
      summary: Get a workflow template
      description: |
        Requires `workflow-template.view` and view access to the project of
        every job step (403 otherwise). Includes the steps.
      responses:
        '200': { $ref: '#/components/responses/WorkflowTemplateResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Workflow Templates]
      summary: Update a workflow template
      description: |
        Requires `workflow-template.update` and operator access to the project
        of every current job step (403 `Forbidden.` otherwise). Omitted
        fields keep their value. Without `steps`, or with `steps: null`, the
        steps stay as they are; a `steps` list replaces all of them, branches
        included, and `[]` removes them all. New steps are checked as on
        create (422 or 403 with `error.job_template_ids`). A rejected update
        changes nothing, neither the template nor its steps.

        Replacing the steps also deletes the step records of every earlier
        and running run of this workflow: earlier runs lose their `steps`,
        and a running run stops advancing and stays `running` until it is
        canceled. Let runs finish, or cancel them, before replacing the
        steps.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowTemplateInput' }
      responses:
        '200': { $ref: '#/components/responses/WorkflowTemplateResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          description: |
            Missing `workflow-template.update`, no operator access to the
            project of every current job step, or a new step uses a job
            template the caller can see but may not operate (named in
            `error.job_template_ids`). Nothing was written.
          content: { application/json: { schema: { $ref: '#/components/schemas/JobTemplateRefError' } } }
        '422':
          description: |
            Invalid template or step, an unknown approval rule, or job
            templates that do not exist for the caller (named in
            `error.job_template_ids`). Nothing was written.
          content: { application/json: { schema: { $ref: '#/components/schemas/JobTemplateRefError' } } }
    delete:
      tags: [Workflow Templates]
      summary: Delete a workflow template
      description: |
        Requires `workflow-template.delete` and operator access to the project
        of every job step. A soft delete: the template disappears from lists
        and can no longer be launched; its runs stay. Its trigger token is
        revoked.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflow-templates/{id}/launch:
    post:
      tags: [Workflow Templates]
      summary: Launch a workflow from this template
      description: |
        Requires `workflow.launch` and operator access to the project of every
        job step. A refusal answers 403 and is audited as
        `workflow.launch.denied` (source `api`), with the job templates the
        caller may not operate. A caller who may see the workflow gets them in
        `error.job_template_ids`; a caller who may not see it gets `You may
        not launch this workflow.` without them. The run belongs to the
        caller: each job step runs as the caller and is checked again when it
        starts. A step the caller may no longer launch then fails without a
        job (see `steps[].error` of the run) and the workflow fails. 422 when
        the template has no steps.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '201': { $ref: '#/components/responses/WorkflowLaunchResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          description: |
            Missing `workflow.launch`, or job steps whose job template the
            caller may not operate. Only a caller who may see the workflow
            gets these job templates in `error.job_template_ids`. Nothing was
            launched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobTemplateRefError' }
              examples:
                visible:
                  summary: The caller may see the workflow
                  value:
                    error:
                      message: 'You may not launch job template(s) #15 of this workflow.'
                      job_template_ids: [15]
                hidden:
                  summary: The caller may not see the workflow
                  value:
                    error:
                      message: You may not launch this workflow.
        '422': { $ref: '#/components/responses/ValidationError' }

  # ────────────────────────── Workflow Jobs ──────────────────────────
  /api/v1/workflow-jobs:
    get:
      tags: [Workflow Jobs]
      summary: List workflow job executions
      description: |
        Requires `workflow.view`. Lists only the runs of workflow templates the
        caller may see (view access to the project of every job step),
        deleted templates included. Newest first, 25 per page, without the
        steps.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowJobList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflow-jobs/{id}:
    get:
      tags: [Workflow Jobs]
      summary: Get a single workflow job execution
      description: |
        Requires `workflow.view` and view access to the project of every job
        step of the run's workflow (403 otherwise). `steps` lists the steps
        that ran; `steps[].error` says why a step failed without a job, for
        example because the user the workflow runs as may not launch the
        step's job template. Replacing the workflow's steps
        (`PUT /api/v1/workflow-templates/{id}` with `steps`) or removing a
        step in the web UI deletes these records for every run.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/WorkflowJobDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflow-jobs/{id}/cancel:
    post:
      tags: [Workflow Jobs]
      summary: Cancel a running workflow job
      description: |
        Requires `workflow.cancel` and operator access to the project of every
        job step of the run's workflow (403 otherwise). Fails the running
        steps and cancels their jobs. Access is checked before the run's
        state, so a caller without it gets 403 whatever the status; 422 only
        tells a caller with access that the run is already finished.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/WorkflowJobResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          description: |
            Missing `workflow.cancel` or operator access to the project of
            every job step, usually answered as `Forbidden.`.
            `error.job_template_ids`, when present, names the job templates
            the caller may not operate; it is never present for a caller who
            may not see the workflow.
          content: { application/json: { schema: { $ref: '#/components/schemas/JobTemplateRefError' } } }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/workflow-jobs/{id}/resume:
    post:
      tags: [Workflow Jobs]
      summary: Resume a paused workflow step
      description: |
        Requires `workflow.launch` and operator access to the project of every
        job step of the run's workflow (403 otherwise). Advances the workflow
        past the currently paused step: the pause step is marked as succeeded
        and the engine proceeds to the next step. The following job steps
        still run as the user who launched the run. Access is checked before
        the run's state, so a caller without it gets 403 whatever the status;
        422 only tells a caller with access that the workflow is already
        finished or has no paused step.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/WorkflowJobResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '403':
          description: |
            Missing `workflow.launch` or operator access to the project of
            every job step, usually answered as `Forbidden.`.
            `error.job_template_ids`, when present, names the job templates
            the caller may not operate; it is never present for a caller who
            may not see the workflow.
          content: { application/json: { schema: { $ref: '#/components/schemas/JobTemplateRefError' } } }

  # ─────────────────────────── Analytics ─────────────────────────
  /api/v1/analytics/summary:
