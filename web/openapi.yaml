openapi: 3.1.0
info:
  title: Ansilume REST API
  version: "2.12.2"
  description: |
    REST API v1 for the Ansilume automation platform.

    Every feature of Ansilume is reachable via this API — the web UI is one
    client among many. When a feature changes, this document **must** be
    updated in the same commit (see `CLAUDE.md`).

    ## Authentication

    All endpoints under `/api/v1/` require a Bearer token except where noted.
    Create a token via the browser (*Profile → API Tokens*) or from the console:

    ```bash
    docker compose exec app php yii api-token/create admin "my-token" --raw
    ```

    Pass it as:

    ```
    Authorization: Bearer <token>
    ```

    ## Authorization

    Every endpoint requires a permission, the same one the matching page in
    the web UI requires (for example `credential.view` to list credentials).
    Without it the call returns `403 Forbidden` before anything happens.
    Superadmins pass every permission check, also those without any role.
    Tokens of disabled users are rejected with `401`.

    ## Team scope

    Projects can be assigned to teams, with viewer or operator access. For a
    caller who is not an admin, everything that belongs to a team-assigned
    project is limited to that project's teams: viewer access to read,
    operator access to change, launch, resume and cancel. Projects without a
    team stay open to everyone with the permission, so removing a project
    from its last team, or deleting that team, opens it. Admins,
    superadmins and installations without team-assigned projects are not
    restricted; only admins and superadmins manage teams (`/api/v1/teams`).

    - Lists leave out what the caller may not see, and `meta.total` counts
      only the visible rows.
    - A single resource the caller may not see, or may not change, answers
      `403`; an unknown one `404`.
    - A `project_id` in a request body needs operator access to that project
      (`403` otherwise). Other references in a request body that the caller
      cannot see (the job template of a workflow step or a schedule, the
      inventory of a job template, the job templates of a vault assignment)
      are reported as not existing (`422`), like unknown or deleted ones.
      Visible job templates the caller may not operate answer `403`. Where a
      request lists job templates (workflow steps, vault assignments),
      `error.job_template_ids` names the offending IDs.
    - Workflow templates and their runs belong to the projects of their job
      steps: seeing them needs view access to the project of every job step,
      changing, launching, resuming or canceling them operator access to
      every one. Only job steps count: approval and pause steps do not
      restrict, so a workflow without job steps is open to everyone with the
      permission. A deleted job template keeps counting with its project; a
      step whose job template was purged with its project restricts the
      workflow to unrestricted callers. A refused launch, resume or cancel
      names job templates in `error.job_template_ids` only to callers who may
      see the workflow; others get a `403` without them.
    - An approval request follows its job's project; the request of a
      workflow approval step, like the placeholder job behind it, follows its
      workflow. Only approvers who may see a request can decide it, and only
      they count for its rule (see the Approvals endpoints).
    - Analytics count only what the caller may see.
    - Triggers (`/trigger/...`) run as the user who generated the token and
      are refused once that user may no longer launch; see the Triggers
      endpoints.

    ## Password survey answers

    A job template's survey can have password fields (`type: password`, see
    `SurveyField`). The value of an extra var whose top-level key is the
    name of such a field is a password answer, whatever sends it:
    `extra_vars` of `POST /api/v1/jobs`, the body of a trigger, the
    `extra_vars` of a schedule, the launch extra vars of a workflow run, or
    the web UI. For a workflow run, that is a password field of the job
    template of any of its job steps. Ansilume stores password answers only
    encrypted, with `APP_SECRET_KEY` like credentials, and gives them only
    to the runner that runs the job. Responses show the placeholder
    `$encrypted$` in their place, in `extra_vars` and `execution_command`
    of every job, in `extra_vars` of every schedule and in `extra_vars` of
    every workflow run. A launch that sends `$encrypted$` as a password
    answer is refused: `POST /api/v1/jobs`, `/trigger/fire`,
    `/trigger/{token}`, `/trigger/fire-workflow` and
    `POST /api/v1/workflow-templates/{id}/launch` answer `422` and launch
    nothing; a workflow run is not created. In the `extra_vars` of a
    schedule, `$encrypted$` keeps the answer the schedule has stored.

    ## Errors

    Error responses have the shape `{ "error": { "message": "..." } }` and
    use conventional HTTP status codes (401, 403, 404, 409, 422). Some errors
    add fields next to `message`, such as `error.job_template_ids`,
    `error.used_by`, `error.status` (the state that refused the request, for
    example of an approval request), `error.workflow_job_ids` or
    `error.step_ids`. Others come from the framework instead, with the shape
    `{ "name": "Not Found", "message": "...", "code": 0, "status": 404 }`:
    `400` for a request body that is not valid JSON, `401` for a missing or
    invalid token, `404` for an unknown resource `{id}` in the path (a
    role's `{name}`), and `500` for an unexpected error. An unknown nested
    ID in the path (`artifact_id`, `userId`, `projectId`, a workflow step's
    `stepId`) answers `404` in the usual shape. The trigger endpoints,
    outside `/api/v1/`, answer `403`, `422` and `500` as
    `{ "error": "<message>" }`, for example
    `{ "error": "Launch refused." }`. Their `400` (no token), `404` (unknown
    or revoked token, and every other path under `/trigger/`) and `405`
    (another method than POST, also on `/trigger/{token}`) are the web UI's
    HTML error page, without a JSON body.

servers:
  - url: http://localhost:8080
    description: Local dev (via nginx)
  - url: https://ansilume.example.com
    description: Production (replace with your deployment)

security:
  - bearerAuth: []

tags:
  - name: Projects
  - name: Inventories
    description: |
      An inventory names the hosts of a job: a static inventory holds them
      (`content`), a file or dynamic inventory reads them from its project's
      repository (`source_path`). Viewing inventories needs
      `inventory.view`; creating, changing and deleting them need
      `inventory.create`, `inventory.update` and `inventory.delete`, and
      operator access to the inventory's project (team scope). The list
      leaves out `content` and `source_path`; `GET /api/v1/inventories/{id}`
      answers them to the users who may see the inventory's project.

      An admin (`approval-rule.update`) can give an inventory an approval
      rule (`approval_rule_id`): every launch of every job template that
      uses it then waits for the rule's approvers, and its approval request
      says so (`required_by`: `inventory`). A launch waits for one rule only,
      so a job template on such an inventory has no rule of its own, or the
      same rule. Only admins change an inventory with a rule, every field but
      its `name` and `description`, delete it, give a job template this
      inventory, or change what the job templates that use it run (403
      otherwise); everyone who may change the inventory keeps changing its
      name and description. A runner starts a job whose job template or
      inventory has a rule only once the job was approved (see Jobs).

      The hosts of a file or dynamic inventory come from its project's
      repository when a runner claims the job, after the approval: the
      approval rule locks the source path and the project, not the file.
      Whoever may change that project (its repository URL or branch) or push
      to its repository changes these hosts without an admin.

      An inventory that job templates use cannot be deleted, also when only
      deleted job templates use it (409 with `error.used_by`): a deleted job
      template keeps its inventory, for the history of its jobs, until its
      project is deleted. `GET /api/v1/inventories/{id}` says which job
      templates use it (`used_by`), as the inventory's page does.
  - name: Credentials
  - name: Job Templates
  - name: Jobs
    description: |
      A job is one run of a job template, with the inventory, credentials
      and extra vars it was launched with (`inventory_id` and
      `inventory_name` name its inventory). A job whose job template has an
      approval rule, its own or its inventory's, waits for approval
      (`pending_approval`) and is queued once its approval request is
      approved.

      A runner starts only jobs that may run. When a runner claims a queued
      job whose job template, the inventory it was launched with or the
      template's current inventory has an approval rule, and the job was
      not approved, by its approvers or by a timeout whose action is
      `approve`, the job fails before it runs: for example a job queued
      before the rule was assigned. So does a job whose inventory is
      gone or names no hosts: a static inventory without content, a file
      inventory without a source path, or a launch record that names no
      inventory. Its status becomes `failed` with `exit_code` -1, its log
      says why, from `Job aborted before execution:` to `The job did not
      run: no credentials were decrypted or sent to the runner.`, and its
      `job.finished` audit entry names the reason in `claim_refusal`
      (`not_approved`, `inventory_missing`, `inventory_not_recorded`,
      `inventory_empty` or `inventory_no_source`). Launch it again: a job
      that needs an approval then waits for it.
  - name: Schedules
    description: |
      A schedule launches its job template at the times of its cron
      expression, as one user: `created_by`, shown as **Runs as** in the web
      UI. That is the user who created the schedule, or who last changed
      its job template, cron expression, timezone or extra vars, or enabled
      it; renaming and disabling keep the user. This user is the launcher of
      the schedule's jobs and never approves them.
  - name: Runner Groups
    description: |
      A job template names the runner group whose runners run its jobs. A
      runner claims every queued job of its group, whatever the team,
      approved jobs included, and receives the job's decrypted credentials,
      inventory and extra vars: runner groups have no team scope. Runner
      groups are managed by admins: viewing them needs `runner-group.view`,
      which every built-in role holds; creating, changing and deleting them
      need `runner-group.create`, `runner-group.update` and
      `runner-group.delete`, which of the built-in roles only admin holds
      (403 `Forbidden.` otherwise, operators included). A custom role can
      be given these permissions: whoever holds `runner-group.update`
      can take over the jobs of every runner group. A runner group has no
      token: each runner has one of its own. Self-registration with the
      bootstrap secret, through the runner API outside `/api/v1/`, creates
      the group `default` for a runner that names no group, where no group
      has that name.
  - name: Runners
    description: |
      Viewing runners needs `runner-group.view`, which every built-in role
      holds. Moving and deleting runners and regenerating their tokens need
      `runner-group.update`, which of the built-in roles only admin holds
      (403 `Forbidden.` otherwise, operators included): whoever holds a
      runner's token receives the jobs of its group with their decrypted
      credentials. Admins register runners in the web UI (Add Runner on a
      runner group's page); runners also register themselves with the
      bootstrap secret, through the runner API outside `/api/v1/`. No
      response of these endpoints carries a token, except that of
      regenerate-token.
  - name: Teams
  - name: Users
  - name: Webhooks
  - name: Audit Logs
  - name: Notification Templates
  - name: Approval Rules
    description: |
      An approval rule gates every launch of the job templates it is
      assigned to (`approval_rule_id` of the job template), of every job
      template on the inventories it is assigned to (`approval_rule_id` of
      the inventory), and the workflow approval steps that use it: the job
      waits for the rule's approvers. A launch waits for one rule only: a
      job template on an inventory with a rule has no rule of its own, or
      the same rule. A change that would give one launch two different
      rules is refused (422), and so is the launch of a job template whose
      rule differs from its inventory's (422).
      Rules are managed by admins: viewing them needs `approval-rule.view`;
      creating, changing and deleting them need `approval-rule.create`,
      `approval-rule.update` and `approval-rule.delete`, which of the
      built-in roles only admin holds. Assigning a rule to a job template or
      an inventory or removing it, adding an approval step to a workflow,
      and changing the steps of a workflow that has one need
      `approval-rule.update` as well, and so do adding a job step whose job
      template has a rule (a gated job step) and changing the steps of a
      workflow that has one. Giving a job step such a job template needs it
      too. A job step whose job template's inventory has a rule is a gated
      job step as well. Changing what a job template with a rule runs, any
      field but its name and description, needs `approval-rule.update` too
      (403 otherwise), also when only its inventory has the rule; and so do
      changing an inventory with a rule, any field but its name and
      description, deleting it, and giving a job template such an
      inventory. A custom role can be given these permissions.

      A rule gates job templates and inventories, not hosts or playbooks: a
      user who may create inventories and job templates in a project can
      create ones without a rule that run the same playbook on the same
      hosts. Only admins assign rules, but an approval rule does not stop
      such a template. An approval step gates the runs of its workflow, not
      the job templates in it: users who may launch those templates can
      launch them directly, or from another workflow without the step. To
      gate a job template wherever it runs, give the template, or its
      inventory, an approval rule. An approval approves a launch: a runner
      reads the playbook from the project's repository, and the job's
      inventory, when it claims the job, after the approval; it starts a
      job of a job template or inventory with a rule only once the job was
      approved. The inventory, the project and the credentials of a job
      template with a rule keep their own permissions, the inventory only
      while it has no rule: users who may change them, or push to the
      repository, change what its next jobs run without becoming their
      launcher, so they may approve them when they are approvers. The hosts
      of a file or dynamic inventory with a rule come from its project's
      repository too (see Inventories).

      Rule names are not unique. A change to a rule that is in use applies
      to its pending requests only at their next vote or timeout. A rule
      that inventories, job templates, approval steps of workflows or
      pending requests use cannot be deleted (409).
  - name: Approvals
    description: |
      Approval requests of jobs whose job template has an approval rule,
      its own or its inventory's, and of workflow approval steps.
      `required_by` says what required a request: `job_template` (the job
      template's own rule, also when its inventory has the same rule),
      `inventory` (the rule of the inventory the job was launched with,
      named in `inventory_id` and `inventory_name`) or `approval_step` (a
      workflow approval step). Seeing a request needs view access to the
      job's project or, for a workflow approval step, to the workflow; for
      the rule of an inventory, too, the project of the job's template
      counts, not the inventory's.

      An eligible approver is on the rule's approver list (a role rule
      counts the users assigned that role directly), has an active account,
      is a superadmin or holds `approval.decide`, may see the request, and
      did not launch its job (`launched_by`). Nobody approves their own
      launch, admins and superadmins included; their earlier votes count
      neither as approvals nor as rejections. A launch is refused (422)
      when fewer eligible approvers than the rule requires remain besides
      the user who launches.

      Votes and timeouts settle a request exactly once: each runs under a
      lock of the request, and the first that decides it wins. The
      maintenance run (`php yii maintenance/run`, which the
      schedule-runner starts every minute) applies the timeouts of expired
      requests.
  - name: Workflow Templates
    description: |
      A workflow template has no project of its own: it belongs to the
      projects of its job steps. Seeing it needs view access to the project
      of every job step; changing, deleting and launching it need operator
      access to every one.

      Steps run in the run order: by `step_order`, an internal sort key, then
      by ID. A step's `position` is its 1-based place in that order, and runs
      start with the step at position 1. An empty branch goes on with the
      step at the next position, so moving a step changes where empty
      branches lead; the `routes` of a step say where each of its branches
      leads now. The step endpoints (`/api/v1/workflow-templates/{id}/steps`)
      add, change, move and remove one step: a step keeps its ID, and the
      branches that lead to it stay. A `steps` list on `POST` or `PUT
      /api/v1/workflow-templates` replaces every step instead: the steps get
      new IDs and no branches.
  - name: Workflow Jobs
    description: |
      Runs of workflow templates. They follow their workflow template, also
      after it was deleted. A run's job steps run as the user who launched
      the run; each is checked when it starts.

      A run that waits is stored as `running`, and so is the step it waits
      at; `waiting_for` says what it waits for: `approval` (an approval
      request, at an approval step or a gated job step), `resume` (a pause
      step, until someone resumes the run) or `runner` (the step's job is
      queued and waits for a runner). The stored statuses keep their values.
  - name: Analytics
    description: |
      Reports over jobs, workflows, approval requests and runners. They count
      only what the caller may see: jobs of job templates the caller may
      view, runs of workflows the caller may view, approval requests the
      caller may view. runner-activity lists every runner but counts only
      those jobs. A filter on a project or template the caller cannot see
      counts nothing. Each filter takes a single value. An ID that is not a
      whole number, a date not in `YYYY-MM-DD` form, a granularity other
      than `daily` or `weekly`, or a `date_to` before `date_from` or more
      than 365 days after it answers 422.
  - name: Triggers
    description: |
      Inbound triggers: another system launches a job template or a
      workflow template with its trigger token, the only authentication.
      Send the token in the `X-Trigger-Token` header, or as
      `Authorization: Bearer <token>`. Tokens in the URL, the `token` query
      parameter and the path form `/trigger/{token}` (job templates only),
      still work but are deprecated: URLs end up in access logs and in
      proxies. When a request carries the token more than once, the header
      wins, then the URL, then `Authorization: Bearer`, so a caller that
      sends an unrelated `Authorization` header keeps working with its URL
      token. A trigger runs as the user who generated its token and is
      refused while that user may not launch the template. Every launch is
      audited as `trigger.fired`, with how the token was sent (`transport`:
      `header`, `bearer` or `url`) and never the token. Generate and revoke
      tokens on the template's page or with the `trigger-token` endpoints of
      job and workflow templates.
  - name: Roles
  - name: Profile
  - name: LDAP
  - name: System

# Shared query parameter list used by every analytics endpoint.
# Defined once via a YAML anchor and referenced with `*` so we don't
# repeat eight parameters ten times.
x-analytics-filters: &analyticsFilters
  - { in: query, name: date_from, required: false, schema: { type: string, format: date }, description: "Inclusive start date (YYYY-MM-DD). Defaults to 30 days ago." }
  - { in: query, name: date_to, required: false, schema: { type: string, format: date }, description: "Inclusive end date (YYYY-MM-DD). Defaults to today. Not before date_from and at most 365 days after it (422 otherwise)." }
  - { in: query, name: project_id, required: false, schema: { type: integer, minimum: 1 } }
  - { in: query, name: template_id, required: false, schema: { type: integer, minimum: 1 } }
  - { in: query, name: user_id, required: false, schema: { type: integer, minimum: 1 } }
  - { in: query, name: runner_group_id, required: false, schema: { type: integer, minimum: 1 } }
  - { in: query, name: granularity, required: false, schema: { type: string, enum: [daily, weekly], default: daily } }
  - { in: query, name: format, required: false, schema: { type: string, enum: [json, csv], default: json }, description: "csv also needs analytics.export (403 otherwise)." }

paths:
  # ─────────────────────────────── Projects ───────────────────────────────
  /api/v1/projects:
    get:
      tags: [Projects]
      summary: List projects
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Projects]
      summary: Create a project
      description: Requires `project.create`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
            examples:
              git:
                summary: Git-backed project
                value:
                  name: my-playbooks
                  scm_type: git
                  scm_url: "https://github.com/example/playbooks.git"
                  scm_branch: main
              manual:
                summary: Manual project
                value:
                  name: local-playbooks
                  scm_type: manual
      responses:
        '201': { $ref: '#/components/responses/ProjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ProjectRejected' }
  /api/v1/projects/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Projects]
      summary: Get a single project
      responses:
        '200': { $ref: '#/components/responses/ProjectResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Projects]
      summary: Update a project
      description: |
        Requires `project.update` and operator access. Changing
        `vault_password_source` is audited as `project.vault-source-changed`
        and re-checks the project's job templates against the last vault scan.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectInput' }
      responses:
        '200': { $ref: '#/components/responses/ProjectResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ProjectRejected' }
    delete:
      tags: [Projects]
      summary: Delete a project
      description: |
        Requires `project.delete`. Refuses with 422 while active job templates
        reference this project. Templates that were already deleted (soft-deleted,
        no longer listed) are purged together with the project. Their waiting
        jobs (`pending`, `queued`, `pending_approval`) are canceled first, as
        the delete of a job template cancels them: `job.canceled` audit
        entries with `reason: template_deleted` and the caller as their user,
        their pending approval requests closed, a workflow step that waits
        for such a job failed with it. Running jobs are left alone. A cancel
        that fails is logged and the maintenance run cancels that job later;
        it never runs meanwhile.

        A job template created in the project, or moved into it, while the
        delete runs gets the same refusal (422) with the templates counted
        again, and the project and its templates stay; the waiting jobs of
        its deleted templates that were canceled stay canceled. Releases up
        to 2.9.0 deleted such a template together with the project.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Job templates that are not deleted reference the project, also
            one created while the delete ran; nothing was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  message: 'Cannot delete "web": 1 job template(s) still reference this project. Remove or reassign them first.'
  /api/v1/projects/{id}/vault:
    get:
      tags: [Projects]
      summary: Vault overview of a project
      description: |
        Requires `project.view` and view access to the project. The last scan
        of the checkout for ansible-vault content (encrypted files and inline
        `!vault` values, vault IDs, the vault settings of the repository's
        ansible.cfg, findings) and, per job template, whether its vault
        password opens the encrypted files it probably loads. Checked without
        decrypting; nothing in it is secret. Runner names, groups and versions
        need `runner-group.view` (otherwise only their number), the names of
        vault passwords `credential.view` or `job-template.view` (otherwise
        only their id).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/ProjectVaultResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{id}/vault/scan:
    post:
      tags: [Projects]
      summary: Rescan a project checkout for vault content
      description: |
        Requires `project.update` and operator access. Scans the checkout as
        it is now (it does not fetch: a git project's checkout changes only
        with a sync, and every sync scans it), re-checks every job template of
        the project and answers with the overview. Audited as
        `project.vault-scanned`. Without a checkout, `error` says so and the
        overview is empty. The checks of one rescan share a time budget of
        30 seconds; templates it does not finish get the status `incomplete`
        with the reason `time_limit` and go first next time.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/ProjectVaultResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/projects/{id}/sync:
    post:
      tags: [Projects]
      summary: Trigger a git sync for a project
      description: |
        Requires `project.update`. Only works for `scm_type=git` projects.
        Queues a background sync job.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Sync queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      syncing: { type: boolean }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── Inventories ─────────────────────────────
  /api/v1/inventories:
    get:
      tags: [Inventories]
      summary: List inventories
      description: |
        Requires `inventory.view`. Lists only the inventories the caller may
        see (team scope), newest first, 25 per page, each with its approval
        rule (`approval_rule_id`, `approval_rule_name`) but without `content`
        and `source_path`: `GET /api/v1/inventories/{id}` answers them.
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Inventories]
      summary: Create an inventory
      description: |
        Requires `inventory.create` and operator access to the project
        (`project_id`; 403 `Forbidden.` otherwise). The caller becomes
        `created_by`; a `created_by` in the body is ignored. The answer is
        the inventory with its `content` and `source_path`. Audited as
        `inventory.created` with its name, type and project, the fields that
        have a value in `changed_fields` (never their values),
        `approval_rule` as `{"from": null, "to": {"id": 3, "name":
        "deploy-prod"}}` when it starts with a rule, and source `api`.

        An `approval_rule_id` other than null or `""` needs
        `approval-rule.update` (admins): without it the create answers 403
        `Only admins may assign or remove an approval rule: that needs
        approval-rule.update.` and writes nothing. Every launch of every job
        template that uses an inventory with a rule waits for that rule (see
        Inventories). A dynamic inventory with a rule needs a `source_path`
        (422). A field of the body that holds a list or an object answers
        422 (`project_id must be a single value, not a list or an object.`)
        before the body reaches the inventory.

        The answers come in this order: 403 `Forbidden.` without
        `inventory.create`; 422 for a field that holds a list or an object;
        403 `Forbidden.` without operator access to the project; 403 for an
        approval rule without `approval-rule.update`; 422 for an inventory
        that is not valid. A save that collides with a concurrent change (a
        deadlock or a lock wait timeout) is made once more, and so is a save
        whose approval rule or project another request deletes at the same
        moment (the database refuses the reference to the row that is gone):
        the second attempt answers 422 `The selected approval rule does not
        exist.` or `The selected project does not exist.`. A second
        collision or refusal in a row answers 500. Nothing is written in
        either case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryInput' }
            examples:
              static:
                summary: Static YAML inventory
                value:
                  name: zabbix-hq
                  inventory_type: static
                  content: "---\nall:\n  hosts:\n    zabbix-hq:\n      ansible_host: 10.1.42.108\n"
              gated:
                summary: A static inventory whose every launch waits for approval rule 3 (admins only)
                value:
                  name: web-prod
                  inventory_type: static
                  content: "all:\n  hosts:\n    web1.example.com:\n    web2.example.com:\n"
                  approval_rule_id: 3
      responses:
        '201': { $ref: '#/components/responses/InventoryDetailResponse' }
        '403':
          description: |
            Missing `inventory.create` or operator access to the project
            (`Forbidden.`), or an approval rule without
            `approval-rule.update`. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                forbidden:
                  summary: Missing inventory.create or operator access to the project
                  value:
                    error:
                      message: Forbidden.
                approvalRule:
                  summary: The body gives the inventory an approval rule
                  value:
                    error:
                      message: 'Only admins may assign or remove an approval rule: that needs approval-rule.update.'
        '422': { $ref: '#/components/responses/InventoryRejected' }
  /api/v1/inventories/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Inventories]
      summary: Get a single inventory
      description: |
        Requires `inventory.view` and view access to the inventory's project
        (403 otherwise). Answers the inventory with its `content` and
        `source_path`, to the users who may see the inventory's page, and
        `used_by`: the job templates that use it, as the Job templates card
        of its page shows them to the caller. `used_by.job_templates` lists
        the live job templates the caller may see, each with its own
        approval rule; `hidden_job_template_count` counts the live ones in
        projects the caller cannot see, and `deleted_job_template_count` the
        deleted ones that still refer to the inventory, for the history of
        their jobs. While `in_use` is true the inventory cannot be deleted.
        The answers of `POST` and `PUT` leave `used_by` out.
      responses:
        '200': { $ref: '#/components/responses/InventoryViewResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Inventories]
      summary: Update an inventory
      description: |
        Requires `inventory.update` and operator access to the inventory's
        project and, when `project_id` changes, to the new project (403
        otherwise). Changing the type or the project is rejected with 422 when
        job templates of another project would then use a file or dynamic
        inventory of this project. Fields the body leaves out keep their
        value. The answer is the inventory with its `content` and
        `source_path`.

        Setting, changing or removing `approval_rule_id` needs
        `approval-rule.update` (admins): another value than the stored one,
        `null` and `""` included, answers 403 `Only admins may assign or
        remove an approval rule: that needs approval-rule.update.` for
        everyone else and writes nothing. Sending the stored value again, or
        leaving the field out, is allowed; `null` removes the rule. Giving
        the inventory a rule, or another one, while live job templates on it
        have another rule of their own answers 422 `Job templates that use
        this inventory have another approval rule of their own:
        "deploy-web". A launch waits for one rule only, so give them this
        rule or none first.`, which names the job templates the caller may
        see and counts the others (`"deploy-web" and 2 in projects you
        cannot see`).

        An inventory with an approval rule is changed only by admins
        (`approval-rule.update`), but for its `name` and `description`: the
        schedules, triggers and workflows of the job templates that use it
        launch their jobs as the users they run as, who never approve them,
        so whoever changed the hosts could approve them alone. For everyone
        else, an update that changes any other field (`inventory_type`,
        `content`, `source_path`, `project_id`) answers 403 `This inventory
        has an approval rule: only admins may change its hosts
        (approval-rule.update). You may change its name and description.`
        and writes nothing. A field sent with its stored value is no change:
        `null` and `""` are the same, and values are compared as their
        field's type (`"5"` and `5` alike), so the body of `GET` sent back
        with a new `name` is accepted. A change of `approval_rule_id` is
        refused with its own message first. The inventory row is locked
        while the update decides, so a rule assigned or removed at the same
        moment counts, and fields the body does not change keep what
        another request saved meanwhile.

        Audited as `inventory.updated` with the name, the changed fields in
        `changed_fields` (never their values; `[]` when nothing changed),
        `approval_rule` as `{"from": ..., "to": ...}` when the rule changes,
        and source `api`. The answers come in this order: 403 `Forbidden.`
        without `inventory.update`; 404 for an unknown inventory; 403
        `Forbidden.` without operator access to its project; 422 for a field
        that holds a list or an object; 403 `Forbidden.` without operator
        access to the new project; 403 for a change of the approval rule
        without `approval-rule.update`; 404 for an inventory deleted
        meanwhile; 403 `Forbidden.` for operator access lost meanwhile; 403
        for a change of an inventory with an approval rule; 422 for an
        inventory that is not valid. A save that collides with a concurrent
        change (a deadlock or a lock wait timeout) is made once more, and so
        is a save whose approval rule or new project another request deletes
        at the same moment (the database refuses the reference to the row
        that is gone): the second attempt answers 422 `The selected approval
        rule does not exist.` or `The selected project does not exist.`. A
        second collision or refusal in a row answers 500. Nothing is written
        in either case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryInput' }
            examples:
              assignRule:
                summary: Give the inventory approval rule 3 (admins only)
                value:
                  name: web-prod
                  inventory_type: static
                  approval_rule_id: 3
              removeRule:
                summary: Remove its approval rule (admins only)
                value:
                  name: web-prod
                  inventory_type: static
                  approval_rule_id: null
      responses:
        '200': { $ref: '#/components/responses/InventoryDetailResponse' }
        '403':
          description: |
            Missing `inventory.update` or operator access to the inventory's
            project or the new one (`Forbidden.`); a change of
            `approval_rule_id` without `approval-rule.update`; or, on an
            inventory with an approval rule, a change of any field but
            `name` and `description` without `approval-rule.update`. Nothing
            was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                forbidden:
                  summary: Missing inventory.update or operator access to the project
                  value:
                    error:
                      message: Forbidden.
                approvalRule:
                  summary: The update changes the approval rule
                  value:
                    error:
                      message: 'Only admins may assign or remove an approval rule: that needs approval-rule.update.'
                gatedInventory:
                  summary: The inventory has an approval rule, and the update changes more than its name and description
                  value:
                    error:
                      message: 'This inventory has an approval rule: only admins may change its hosts (approval-rule.update). You may change its name and description.'
        '404': { $ref: '#/components/responses/InventoryNotFound' }
        '422': { $ref: '#/components/responses/InventoryRejected' }
    delete:
      tags: [Inventories]
      summary: Delete an inventory
      description: |
        Requires `inventory.delete`, which of the built-in roles only admin
        holds, and operator access to the inventory's project (403
        `Forbidden.` otherwise). An inventory with an approval rule is
        deleted only by admins (`approval-rule.update`): a custom role that
        holds `inventory.delete` without it gets 403 `This inventory has an
        approval rule: only admins may delete it (approval-rule.update).`

        An inventory that job templates use, also when only deleted ones
        do, is not deleted: 409 with `error.used_by`, and nothing is
        changed. Point its job templates at another inventory first: a
        deleted job template keeps its inventory, for the history of its
        jobs, until its project is deleted. A job template that starts to
        use the inventory while the delete runs gets the same 409, with the
        job templates counted again. Audited as `inventory.deleted` with the
        name, the type, `approval_rule` as `{"from": ..., "to": null}` when
        it had one, and source `api`.

        The answers come in this order: 403 `Forbidden.` without
        `inventory.delete`; 404 for an unknown inventory; 403 `Forbidden.`
        without operator access to its project; 404 for an inventory deleted
        meanwhile; 403 `Forbidden.` for operator access lost meanwhile; 403
        for an inventory with an approval rule without
        `approval-rule.update`; 409 for an inventory in use. A delete that
        collides with a concurrent change (a deadlock or a lock wait
        timeout) is made once more; a second collision answers 500, and
        nothing is deleted.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403':
          description: |
            Missing `inventory.delete` or operator access to the inventory's
            project (`Forbidden.`), or an inventory with an approval rule
            without `approval-rule.update`. Nothing was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                forbidden:
                  summary: Missing inventory.delete or operator access to the project
                  value:
                    error:
                      message: Forbidden.
                gatedInventory:
                  summary: The inventory has an approval rule
                  value:
                    error:
                      message: 'This inventory has an approval rule: only admins may delete it (approval-rule.update).'
        '404': { $ref: '#/components/responses/InventoryNotFound' }
        '409': { $ref: '#/components/responses/InventoryInUse' }

  # ───────────────────────────── Credentials ─────────────────────────────
  /api/v1/credentials:
    get:
      tags: [Credentials]
      summary: List credentials
      description: Secret material is never returned, not even redacted placeholders.
      parameters:
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: Paginated list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Credentials]
      summary: Create a credential
      description: |
        Requires `credential.create`. The secret of the credential's type is
        required (see `CredentialInput.secrets`); without it the answer is 422,
        for example `Token is required for Token credentials.` For `ssh_key`
        type, provide the raw PEM private key in `secrets.private_key`; public
        key and algorithm are derived server-side via `ssh-keygen -y`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialInput' }
            examples:
              ssh:
                summary: SSH key credential
                value:
                  name: ssh
                  credential_type: ssh_key
                  username: root
                  secrets:
                    private_key: "-----BEGIN OPENSSH PRIVATE KEY-----\n...\n-----END OPENSSH PRIVATE KEY-----\n"
              password:
                summary: Username/password credential
                value:
                  name: db-root
                  credential_type: username_password
                  username: root
                  secrets:
                    password: "<password>"
              token:
                summary: Token credential exposed as an environment variable
                value:
                  name: deploy-token
                  credential_type: token
                  env_var_name: DEPLOY_TOKEN
                  secrets:
                    token: "<token>"
      responses:
        '201': { $ref: '#/components/responses/CredentialResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/credentials/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Credentials]
      summary: Get a single credential
      description: |
        Adds `secret_status` (whether the stored secret is usable) and
        `used_by` (job templates, projects and waiting jobs that use the
        credential). The lists only name what the caller may see; the hidden
        counts cover the rest.
      responses:
        '200': { $ref: '#/components/responses/CredentialDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Credentials]
      summary: Update a credential
      description: |
        Requires `credential.update`. Omitted fields keep their value. If
        `secrets` is omitted or its values are blank, the stored secret is
        kept; a submitted secret replaces it. Changing `credential_type`
        requires the new type's secret (422 otherwise), so no secret of the
        old type stays behind. Changing it to `vault` is rejected with 422
        while a job template using the credential already has another vault
        password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CredentialInput' }
      responses:
        '200': { $ref: '#/components/responses/CredentialResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Credentials]
      summary: Delete a credential
      description: |
        Requires `credential.delete`. A credential that a job template, a
        project or a waiting job uses is not deleted: the answer is 409 with
        `error.used_by`. Pass `force=1` to delete it anyway. It is then
        detached from every job template and project, and waiting jobs that
        need it fail before they start. Job templates with an approval rule
        lose it too, although only admins (`approval-rule.update`) change
        what they run otherwise; `credential.delete` is for admins by
        default.
      parameters:
        - name: force
          in: query
          required: false
          description: "`1` or `true` deletes a credential that is in use."
          schema: { type: boolean, default: false }
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/CredentialInUse' }

  /api/v1/credentials/{id}/job-templates:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [Credentials]
      summary: Job templates a vault password can be assigned to
      description: |
        Requires `job-template.update` and `credential.view`. Lists the job
        templates the caller may change, with their current vault passwords.
        Job templates with an approval rule, their own or their inventory's,
        are listed too; only callers with `approval-rule.update` can assign a
        vault password to them (see `POST`).
      responses:
        '200': { $ref: '#/components/responses/VaultAssignmentCandidatesResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Credentials]
      summary: Assign a vault password to several job templates
      description: |
        Requires `job-template.update` and `credential.view`. A template that
        has another vault password gets it replaced in the same position (a
        primary stays primary); any further vault password is detached, so
        each template ends up with exactly this one. Each changed template is
        audited as `job-template.updated`. Jobs that already wait keep the
        credentials they were launched with.

        A job template with an approval rule changes only for callers with
        `approval-rule.update` (admins), as on `PUT
        /api/v1/job-templates/{id}`: for everyone else it is left as it is,
        reported with the status `failed` and the error `This job template
        has an approval rule: only admins may change what it runs
        (approval-rule.update). You may change its name and description.`,
        and the other templates are assigned. So is a job template whose
        inventory has an approval rule, with the error `The inventory of
        this job template has an approval rule: only admins may change what
        it runs (approval-rule.update). You may change its name and
        description.`

        Nothing is written when the request is invalid: 422 for a credential
        that is not a vault password or has no usable secret, a malformed or
        empty list, more than 500 IDs, or IDs of templates that do not exist
        or that the caller cannot see; 403 for templates the caller can see
        but not change. `error.job_template_ids` names the offending IDs.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultAssignmentInput' }
            example:
              job_template_ids: [12, 15]
      responses:
        '200': { $ref: '#/components/responses/VaultAssignmentResponse' }
        '403': { $ref: '#/components/responses/VaultAssignmentRejected' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/VaultAssignmentRejected' }

  # ─────────────────────────── Job Templates ───────────────────────────
  /api/v1/job-templates:
    get:
      tags: [Job Templates]
      summary: List job templates
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: warning
          in: query
          required: false
          description: Only templates with this warning, see JobTemplateWarning.
          schema: { type: string, enum: [multiple_vault_credentials, inventory_other_project, vault_password_mismatch, vault_password_missing, vault_file_damaged, vault_check_incomplete] }
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/JobTemplateList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Job Templates]
      summary: Create a job template
      description: |
        Requires `job-template.create` and operator access to the project
        (403 otherwise). An `approval_rule_id` other than null needs
        `approval-rule.update` as well (admins): without it the create
        answers 403 `Only admins may assign or remove an approval rule: that
        needs approval-rule.update.` and writes nothing. Rejected with 422
        when the credentials hold more than one vault password, when a file or
        dynamic inventory belongs to another project than the template, and
        when the project, inventory, runner group or approval rule does not
        exist. An inventory of a project the caller cannot see counts as not
        existing. The survey and the extra vars are checked by the rules
        described at `survey_fields` and `extra_vars` of `JobTemplateInput`
        (422 with the first problem).

        An inventory with an approval rule (`approval_rule_id` of the
        inventory) needs `approval-rule.update` as well: every launch of the
        template would wait for that rule, so without it the create answers
        403 `The selected inventory has an approval rule: only admins may
        give a job template an inventory with an approval rule
        (approval-rule.update).` and writes nothing. An inventory the caller
        cannot see answers 422 `The selected inventory does not exist.`
        instead, also one with a rule. A launch waits for one rule only: an
        `approval_rule_id` other than the rule of the inventory, when the
        inventory has one, answers 422 `Inventory "web-prod" has the
        approval rule "deploy-prod": a job template on it may have only that
        rule as its own, or none.`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobTemplateInput' }
            example:
              name: Deploy web servers
              project_id: 1
              inventory_id: 1
              playbook: site.yml
              runner_group_id: 1
              verbosity: 0
              forks: 5
              extra_vars: '{"http_port": 8080}'
              survey_fields:
                - name: app_env
                  label: Environment
                  type: select
                  required: true
                  default: staging
                  options: [staging, production]
                - name: db_password
                  label: Database password
                  type: password
                  required: true
      responses:
        '201': { $ref: '#/components/responses/JobTemplateResponse' }
        '403':
          description: |
            Missing `job-template.create` or operator access to the project
            (`Forbidden.`), an `approval_rule_id` without
            `approval-rule.update`, or an inventory with an approval rule
            without `approval-rule.update`. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                forbidden:
                  summary: No permission or no operator access
                  value:
                    error:
                      message: 'Forbidden.'
                approvalRule:
                  summary: The template gets an approval rule
                  value:
                    error:
                      message: 'Only admins may assign or remove an approval rule: that needs approval-rule.update.'
                gatedInventory:
                  summary: The template's inventory has an approval rule
                  value:
                    error:
                      message: 'The selected inventory has an approval rule: only admins may give a job template an inventory with an approval rule (approval-rule.update).'
        '422': { $ref: '#/components/responses/JobTemplateRejected' }
  /api/v1/job-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Job Templates]
      summary: Get a single job template
      responses:
        '200': { $ref: '#/components/responses/JobTemplateResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Job Templates]
      summary: Update a job template
      description: |
        Requires `job-template.update` and operator access to the template's
        project and, when `project_id` changes, to the new project (403
        otherwise). Rejected with 422 while the template holds more than one
        vault password, also when the request leaves `credential_ids` out;
        send `credential_ids` with one vault password at most. Changing
        `project_id` or `inventory_id` to a file or dynamic inventory of
        another project is rejected too; older templates that already have one
        keep working and report the `inventory_other_project` warning. A new
        inventory must exist and belong to a project the caller can see, as on
        create. The survey rules (see `survey_fields` and `extra_vars` of
        `JobTemplateInput`) apply only when the update changes what they
        check, so templates saved before the rules keep saving. Extra vars
        that hold a number too large for JSON are rejected on every update
        (see `extra_vars`).

        Setting, changing or removing `approval_rule_id` needs
        `approval-rule.update` (admins): another value than the stored one,
        `null` and `""` included, answers 403 `Only admins may assign or
        remove an approval rule: that needs approval-rule.update.` for
        everyone else and writes nothing. Sending the stored value again, or
        leaving the field out, is allowed.

        A job template with an approval rule is changed only by admins
        (`approval-rule.update`), but for its `name` and `description`: its
        schedules, triggers and workflows launch its jobs as the user they
        run as, who never approves them, so whoever changed what it runs
        could approve it alone. For everyone else, an update that changes
        any other field, the credentials and their order and the survey
        included, answers 403 `This job template has an approval rule: only
        admins may change what it runs (approval-rule.update). You may
        change its name and description.` and writes nothing. A field sent
        with its stored value is no change: values are compared as their
        field's type (`"5"` and `5` alike), `extra_vars` and
        `survey_fields` as JSON, where spacing does not count but the order
        of keys does, and the credentials as the ordered list. So the body
        of `GET` sent back with a new `name` is accepted. A change of
        `approval_rule_id` is refused with its own message first. The
        template row is locked while the update decides, so a rule assigned
        at the same moment counts.

        The same holds for a job template whose inventory has an approval
        rule: every launch waits for that rule (`approval_gate`), so for
        everyone but admins an update that changes more than its `name` and
        `description` answers 403 `The inventory of this job template has an
        approval rule: only admins may change what it runs
        (approval-rule.update). You may change its name and description.`
        and writes nothing. Moving it to another inventory, also one without
        a rule, is such a change. A template with a rule of its own gets the
        refusal of its own rule, also when its inventory has one. Giving a
        template an inventory with an approval rule needs
        `approval-rule.update` too: 403 `The selected inventory has an
        approval rule: only admins may give a job template an inventory with
        an approval rule (approval-rule.update).`; an inventory the caller
        cannot see answers 422 `The selected inventory does not exist.`
        instead. The rules of the stored and of the new inventory are read
        with a lock while the update decides, so a rule assigned to them at
        the same moment counts.

        A launch waits for one rule only: an update that changes
        `approval_rule_id` or `inventory_id` so that the template's own rule
        differs from the rule of its inventory answers 422 `Inventory
        "web-prod" has the approval rule "deploy-prod": a job template on it
        may have only that rule as its own, or none.` A template whose own
        rule already differs from its inventory's can still be renamed; its
        launches are refused (see `POST /api/v1/jobs`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobTemplateInput' }
      responses:
        '200': { $ref: '#/components/responses/JobTemplateResponse' }
        '403':
          description: |
            Missing `job-template.update` or operator access to the
            project (`Forbidden.`); a change of `approval_rule_id` without
            `approval-rule.update`; or, on a job template with an approval
            rule, a change of any field but `name` and `description` without
            `approval-rule.update`, also when only its inventory has the
            rule; or a new inventory with an approval rule without
            `approval-rule.update`. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                forbidden:
                  summary: No permission or no operator access
                  value:
                    error:
                      message: 'Forbidden.'
                approvalRule:
                  summary: The update changes the approval rule
                  value:
                    error:
                      message: 'Only admins may assign or remove an approval rule: that needs approval-rule.update.'
                gatedTemplate:
                  summary: The template has an approval rule, and the update changes more than its name and description
                  value:
                    error:
                      message: 'This job template has an approval rule: only admins may change what it runs (approval-rule.update). You may change its name and description.'
                inventoryGatedTemplate:
                  summary: The template's inventory has an approval rule, and the update changes more than its name and description
                  value:
                    error:
                      message: 'The inventory of this job template has an approval rule: only admins may change what it runs (approval-rule.update). You may change its name and description.'
                gatedInventory:
                  summary: The update gives the template an inventory with an approval rule
                  value:
                    error:
                      message: 'The selected inventory has an approval rule: only admins may give a job template an inventory with an approval rule (approval-rule.update).'
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/JobTemplateRejected' }
    delete:
      tags: [Job Templates]
      summary: Delete a job template
      description: |
        Requires `job-template.delete` and operator access to the template's
        project (403 otherwise). A soft delete, like in the web UI: the
        template disappears from lists and can no longer be launched, while
        its jobs keep their link to it. Its trigger token is revoked.

        A deleted template can never run its jobs or schedules, so the
        delete resolves them:
        - its enabled schedules are disabled (`schedule.toggled` audit
          entries with `reason: template_deleted`);
        - its waiting jobs (`pending`, `queued` and `pending_approval`) are
          canceled, each with a `job.canceled` audit entry with
          `reason: template_deleted` and its `job.canceled` notification,
          and their pending approval requests are canceled with them. A
          workflow step that waits for such a job fails with it, and its
          run moves on as after any failed step; for a job that waited for
          approval, as after a rejection (see `on_failure_step_id` of
          `WorkflowStep`);
        - running jobs are not touched: they finish, and their results are
          recorded.

        A launch of the template at the same moment either commits first
        (its job is then canceled here) or is refused with 422
        `Job template #7 was deleted.` The response counts what the delete
        did; the `job-template.deleted` audit entry has the same counts. A
        job whose cancel failed, for example on a database error, is not
        counted: it keeps waiting, no runner claims it, the application log
        names it, and the maintenance run cancels it. A template that
        another request deleted first answers 404 `Template #7 not found.`
      responses:
        '200': { $ref: '#/components/responses/JobTemplateDeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/job-templates/{id}/trigger-token:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [Job Templates, Triggers]
      summary: Generate or replace the template's trigger token
      description: |
        Requires `job-template.update` and operator access to the template's
        project (403 otherwise), as on the template's page. Generates a new
        trigger token and returns it; this response is the only place it
        ever appears, the server keeps only its SHA-256 hash. A token the
        template had before stops working at once.

        The trigger now runs as the caller (`trigger_user_id`), whoever
        generated the previous token: every call checks that this user is
        active, holds `job.launch` and may operate the template's project.
        Audited as `job-template.trigger-token.generated` with source `api`.
        Send the token in the `X-Trigger-Token` header of
        `POST /trigger/fire`. An unknown or deleted job template answers 404.
      responses:
        '201': { $ref: '#/components/responses/TriggerTokenCreatedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Job Templates, Triggers]
      summary: Revoke the template's trigger token
      description: |
        Requires `job-template.update` and operator access to the template's
        project (403 otherwise). The trigger stops working at once. Revoking
        a template without a token answers 200 as well and changes nothing;
        only an actual revocation is audited, as
        `job-template.trigger-token.revoked` with source `api`. An unknown or
        deleted job template answers 404.
      responses:
        '200': { $ref: '#/components/responses/TriggerTokenRevokedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────── Jobs ──────────────────────────────
  /api/v1/jobs:
    get:
      tags: [Jobs]
      summary: List jobs
      description: |
        Requires `job.view`. Lists only the jobs of job templates the caller
        may see (deleted templates count with their project). Jobs without a
        job template, such as the placeholder job of a workflow approval
        step, are listed only for unrestricted callers; fetch them by ID.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/JobList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Jobs]
      summary: Launch a job from a template
      description: |
        Requires `job.launch` and operator access to the template's project.
        The response lists the credentials the job will use and the
        template's warnings (e.g. a vault password that does not open the
        template's encrypted files); warnings never block a launch.

        Values in `extra_vars` whose key is a password field of the
        template's survey are password answers: they are stored only
        encrypted, and the response shows `$encrypted$` in their place (see
        Password survey answers above). Refused with 422, and nothing is
        stored: `$encrypted$` sent as an answer, a template with a password
        field whose name cannot carry an answer, and extra vars that JSON
        cannot hold, such as a number too large for JSON (`1e999`), in
        either form of `extra_vars`. Other failures, such as an
        `APP_SECRET_KEY` that cannot encrypt, answer 500 `Launch failed.`

        A `limit` longer than 255 characters, a `verbosity` below 0 or
        above 5, or a list or an object as either is refused with 422
        before anything is written: `error.message` has the job record's
        messages, and `error.fields` each such field with its message
        (example `invalidInput`). Releases up to 2.9.0 answered 500 for
        it, or took a list or an object as the verbosity for a number.

        A template with an approval rule (`approval_rule_id`) creates the
        job with status `pending_approval` and its approval request in one
        transaction; the job is queued once the request is approved. So
        does a template whose inventory has an approval rule (see
        `approval_gate` of `JobTemplate`): the answer's `status` is then
        `pending_approval`, and `approval_request_id` names the request,
        whose `required_by` says which rule required it. Also
        refused with 422, before anything is written: a rule that leaves
        fewer eligible approvers besides the caller than it requires (the
        caller never approves their own job, see Approvals), a rule that no
        longer exists, a template that was deleted, or one whose approval
        rule changed while the job was being launched. A launch waits for
        one rule only, so a template whose own rule differs from its
        inventory's is refused too, and so is a launch whose inventory no
        longer exists, or whose template got another inventory, or whose
        inventory got another rule, while the job was being launched.
        Schedules report the same reasons when they fail to launch
        (`schedule.failed_to_launch`), and a workflow job step fails with
        them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobLaunchInput' }
            example:
              job_template_id: 12
              extra_vars: { app_version: "1.4.2", db_password: "<database password>" }
              limit: web
      responses:
        '201': { $ref: '#/components/responses/JobLaunchResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/JobLaunchRejected' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/jobs/{id}:
    get:
      tags: [Jobs]
      summary: Get a single job
      description: |
        Requires `job.view` and view access to the job (403 otherwise). A job
        follows the project of its job template. A job without a job template
        is not open to everyone: the placeholder job of a workflow approval
        step follows its workflow (view access to the project of every job
        step), and a job whose template was purged is visible only to
        unrestricted callers.

        `approval_request_id`, `workflow_job_id` and `workflow_job_step_id`
        link the job to its approval request and to the workflow run and step
        execution it was created for (see `JobDetail`), as far as the caller
        may see them.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/JobDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/jobs/{id}/cancel:
    post:
      tags: [Jobs]
      summary: Cancel a running job
      description: |
        Requires `job.cancel` and operator access to the job, by the same rule
        as viewing it: the job template's project, or the workflow of a
        workflow approval placeholder. Access is checked before the job's
        state, so a caller without it gets 403 whatever the status; 409 only
        tells a caller with access that the job is already finished.

        A job that waits for approval is canceled together with its pending
        approval request, which gets the status `canceled` (audited as
        `approval.canceled`) and takes no more votes. A job of a workflow
        step ends its step, and the run moves on. The cancel changes the job
        only while it has not finished: a job that finished between the
        check and the cancel keeps its outcome, and the call answers 409
        with the status the job has now in `error.status`.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/JobDetailResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            The job is already finished and was not canceled. The job keeps
            its status; `error.status` is set when the job finished while it
            was being canceled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobCancelConflictError' }
              examples:
                finished:
                  summary: The job had finished before the call
                  value:
                    error:
                      message: "Job #42 cannot be canceled in status 'succeeded'."
                finishedMeanwhile:
                  summary: The job finished while it was being canceled
                  value:
                    error:
                      message: 'Job #42 was not canceled: it is already succeeded.'
                      status: succeeded

  /api/v1/jobs/{id}/artifacts:
    get:
      tags: [Jobs]
      summary: List artifacts for a job
      description: Requires `job.view` and view access to the job.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: List of artifacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/JobArtifact' } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/jobs/{id}/artifacts/download-all:
    get:
      tags: [Jobs]
      summary: Download all artifacts as a zip archive
      description: Requires `job.view` and view access to the job.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: Zip file download
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/jobs/{id}/artifacts/{artifact_id}/download:
    get:
      tags: [Jobs]
      summary: Download a single artifact
      description: |
        Requires `job.view` and view access to the job. By default the
        response uses `Content-Disposition: attachment` so the browser saves
        the file.

        Pass `?inline=1` to receive `Content-Disposition: inline`. This is
        honoured for two MIME categories:
        - Image types (`image/png`, `image/jpeg`, `image/gif`, `image/webp`)
          — rendered as `<img>` in the UI.
        - PDF (`application/pdf`) — served with a hardened
          `Content-Security-Policy: ... sandbox;` header so the document can
          be embedded in a sandboxed `<iframe>` without script execution.

        Non-image / non-PDF artifacts ignore the parameter and continue to
        download.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - name: artifact_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: inline
          in: query
          required: false
          description: Set to `1` to render images inline (ignored for non-image MIME types).
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: File download
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/jobs/{id}/artifacts/{artifact_id}/content:
    get:
      tags: [Jobs]
      summary: Get artifact content inline (text-based files only)
      description: Requires `job.view` and view access to the job. Returns 415 for non-previewable MIME types.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - name: artifact_id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Inline artifact content
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:           { type: integer }
                      display_name: { type: string }
                      mime_type:    { type: string }
                      content:      { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415':
          description: Artifact type is not previewable

  # ─────────────────────────── Schedules ───────────────────────────
  /api/v1/schedules:
    get:
      tags: [Schedules]
      summary: List schedules
      description: |
        Requires `job.launch`. Lists only the schedules of job templates the
        caller may see.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/ScheduleList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Schedules]
      summary: Create a schedule
      description: |
        Requires `job.launch`. `job_template_id` must be a job template the
        caller may operate: one the caller sees but may not operate answers
        403, one that is unknown, deleted or in a project the caller cannot
        see answers 422 `The selected job template does not exist.` A body
        without `name`, `job_template_id` or `cron_expression` answers 422.

        The caller becomes the user the schedule runs as, returned as
        `created_by` (**Runs as** in the web UI); `created_by` in the body is
        ignored. Scheduled jobs run as this user, who is their launcher and
        never approves them, and only while this user is active, holds
        `job.launch` and may operate the job template's project. Otherwise
        the schedule does not launch when it is due: the refusal is audited
        as `schedule.launch.denied` and the `schedule.failed_to_launch`
        notification is sent. This holds on installations without teams too.

        Password answers in `extra_vars` are stored only encrypted; see
        `extra_vars` of `ScheduleInput` for how to keep, replace and drop
        them, and for the 422 answers. These come after the template checks
        above and the field validation, so they never name the password
        fields of a template the caller may not use.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
            example:
              name: Nightly deploy
              job_template_id: 1
              cron_expression: "0 2 * * *"
              timezone: UTC
              extra_vars: '{"app_env": "production", "db_password": "<database password>"}'
              enabled: true
      responses:
        '201': { $ref: '#/components/responses/ScheduleResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/schedules/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Schedules]
      summary: Get a single schedule
      description: Requires `job.launch` and view access to the project of the schedule's job template.
      responses:
        '200': { $ref: '#/components/responses/ScheduleResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Schedules]
      summary: Update a schedule
      description: |
        Requires `job.launch` and operator access to the project of the
        schedule's job template (403 otherwise). A new `job_template_id`
        follows the rules of create: 403 for a template the caller sees but
        may not operate, 422 `The selected job template does not exist.` for
        an unknown, deleted or invisible one. Every update stores a fresh
        `next_run_at`, the next time the cron expression matches.

        An update that changes what or when the schedule runs makes the
        caller the user the schedule runs as (`created_by`): a new
        `job_template_id`, `cron_expression`, `timezone` or `extra_vars`
        (a password answer sent anew, or dropped from `extra_vars`, counts;
        `$encrypted$` for a stored answer, or the same values written
        differently, does not),
        or `enabled: true` for a disabled schedule. Its `schedule.updated`
        audit entry then records `run_as` with `from` and `to`. Renaming the
        schedule, disabling it, and sending the stored values again keep the
        user it runs as. `created_by` in the body is ignored.

        Fields the body leaves out keep their value. A body without
        `extra_vars` keeps the extra vars and the stored password answers,
        unless it changes `job_template_id` while answers are stored: such a
        request answers 422 until it sends `extra_vars` with the answers
        again, as stored answers never move to another job template. See
        `extra_vars` of `ScheduleInput`.

        A schedule whose job template was deleted answers 422
        `The selected job template does not exist.` to every update, unless
        the body moves it to another job template.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
            example:
              name: Nightly deploy
              job_template_id: 1
              cron_expression: "30 2 * * *"
              extra_vars: '{"app_env": "production", "db_password": "$encrypted$"}'
      responses:
        '200': { $ref: '#/components/responses/ScheduleResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Schedules]
      summary: Delete a schedule
      description: Requires `job.launch` and operator access to the project of the schedule's job template.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/schedules/{id}/toggle:
    post:
      tags: [Schedules]
      summary: Toggle a schedule between enabled and disabled
      description: |
        Requires `job.launch` and operator access to the project of the
        schedule's job template. Disabling always works and keeps the user
        the schedule runs as. Enabling makes the caller the user the
        schedule runs as (`created_by`), and its `schedule.toggled` audit
        entry records `run_as` with `from` and `to` when that user changes.
        Enabling a schedule whose job template was deleted is refused with
        422; deleting a job template disables its schedules, and a due
        schedule of a deleted template disables itself
        (`schedule.failed_to_launch`:
        `Job template #15 was deleted; the schedule was disabled.`).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/ScheduleResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: The schedule was not enabled, because its job template was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  message: 'Schedule "Nightly deploy" was not enabled: its job template #15 was deleted. Edit the schedule to choose another job template, or delete it.'

  # ─────────────────────── Runner Groups ───────────────────────
  /api/v1/runner-groups:
    get:
      tags: [Runner Groups]
      summary: List runner groups
      description: Requires `runner-group.view`, which every built-in role holds.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/RunnerGroupList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Runner Groups]
      summary: Create a runner group
      description: |
        Requires `runner-group.create`, which of the built-in roles only
        admin holds (403 `Forbidden.` otherwise, operators included).
        Audited as `runner-group.created` with source `api`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerGroupInput' }
            example:
              name: production-runners
              description: Runners in the production datacenter
      responses:
        '201': { $ref: '#/components/responses/RunnerGroupResponse' }
        '403': { $ref: '#/components/responses/RunnerManagementForbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/runner-groups/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Runner Groups]
      summary: Get a single runner group
      description: Requires `runner-group.view`, which every built-in role holds.
      responses:
        '200': { $ref: '#/components/responses/RunnerGroupResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Runner Groups]
      summary: Update a runner group
      description: |
        Requires `runner-group.update`, which of the built-in roles only
        admin holds (403 `Forbidden.` otherwise, operators included).
        Audited as `runner-group.updated` with source `api`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerGroupInput' }
      responses:
        '200': { $ref: '#/components/responses/RunnerGroupResponse' }
        '403': { $ref: '#/components/responses/RunnerManagementForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Runner Groups]
      summary: Delete a runner group
      description: |
        Requires `runner-group.delete`, which of the built-in roles only
        admin holds (403 `Forbidden.` otherwise, operators included).
        Refused with 422, and nothing is
        deleted, while runners belong to the group or job templates use it
        (deleted job templates do not count): deleting it would delete its
        runners and take it off the templates, whose jobs no runner would
        claim any more. Move the runners to another group
        (`POST /api/v1/runners/{id}/move`) or delete them, and give the
        templates another runner group, first. The web UI refuses the same
        deletes with the same messages.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/RunnerManagementForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Runners belong to the group, or job templates use it; nothing
            was deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                runners:
                  summary: Runners belong to the group
                  value:
                    error:
                      message: 'Cannot delete "eu-west": 2 runner(s) still belong to this group.'
                jobTemplates:
                  summary: Job templates use the group
                  value:
                    error:
                      message: 'Cannot delete "eu-west": 3 job template(s) reference this group.'

  # ────────────────────────────── Runners ────────────────────────────
  /api/v1/runners:
    get:
      tags: [Runners]
      summary: List runners
      description: Requires `runner-group.view`, which every built-in role holds.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - name: group_id
          in: query
          schema: { type: integer }
          description: Filter by runner group ID
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/RunnerList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/runners/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Runners]
      summary: Get a single runner
      description: Requires `runner-group.view`, which every built-in role holds.
      responses:
        '200': { $ref: '#/components/responses/RunnerResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Runners]
      summary: Delete a runner
      description: |
        Requires `runner-group.update`, which of the built-in roles only
        admin holds (403 `Forbidden.` otherwise, operators included). Its
        token stops working. Audited as `runner.deleted` with source `api`.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/RunnerManagementForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runners/{id}/move:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [Runners]
      summary: Move runner to a different group
      description: |
        Requires `runner-group.update`, which of the built-in roles only
        admin holds (403 `Forbidden.` otherwise, operators included): the
        runner then claims the jobs of the target group. Refuses if the
        runner has active or pending jobs. Audited as `runner.updated` with
        source `api`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerMoveInput' }
            example:
              target_group_id: 2
      responses:
        '200': { $ref: '#/components/responses/RunnerResponse' }
        '403': { $ref: '#/components/responses/RunnerManagementForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/runners/{id}/regenerate-token:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [Runners]
      summary: Regenerate runner token
      description: |
        Requires `runner-group.update`, which of the built-in roles only
        admin holds (403 `Forbidden.` otherwise, operators included).
        Returns the new raw token (shown once); the old token stops working
        at once. Whoever holds the token receives the jobs of the runner's
        group with their decrypted credentials. Audited as
        `runner.token.regenerated` with source `api`.
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      runner: { $ref: '#/components/schemas/Runner' }
                      token: { type: string, description: Raw token (shown once) }
        '403': { $ref: '#/components/responses/RunnerManagementForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────── Teams ──────────────────────────────
  /api/v1/teams:
    get:
      tags: [Teams]
      summary: List teams
      description: Requires `admin` role.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/TeamList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Teams]
      summary: Create a team
      description: Requires `admin` role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
            example:
              name: platform-team
              description: Infrastructure automation team
      responses:
        '201': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/teams/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Teams]
      summary: Get a team with members and projects
      description: Requires `admin` role.
      responses:
        '200': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Teams]
      summary: Update a team
      description: Requires `admin` role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '200': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Teams]
      summary: Delete a team
      description: |
        Requires `admin` role. Also removes all member and project
        associations. A project that no team has any more is open: every
        signed-in user reaches it, as far as their permissions allow.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/teams/{id}/members:
    post:
      tags: [Teams]
      summary: Add a member to a team
      description: Requires `admin` role.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
            example:
              user_id: 5
      responses:
        '201': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/teams/{id}/members/{userId}:
    delete:
      tags: [Teams]
      summary: Remove a member from a team
      description: Requires `admin` role.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - in: path
          name: userId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/teams/{id}/projects:
    post:
      tags: [Teams]
      summary: Assign a project to a team
      description: Requires `admin` role.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id: { type: integer }
                role: { type: string, default: viewer, enum: [viewer, operator] }
            example:
              project_id: 3
              role: operator
      responses:
        '201': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/teams/{id}/projects/{projectId}:
    delete:
      tags: [Teams]
      summary: Unassign a project from a team
      description: |
        Requires `admin` role. A project that no team has any more is open:
        every signed-in user reaches it, as far as their permissions allow.
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - in: path
          name: projectId
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/TeamResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────────── Users ──────────────────────────────
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      description: Requires `user.view`.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/UserList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user
      description: |
        Requires `user.create`. Password is required and must be at least 5
        characters. A `role` needs every permission the role grants, through
        its child roles too, unless the caller is a superadmin;
        `is_superadmin: true` needs a superadmin. Either refusal answers 403
        and creates nothing. The `admin` role, which gives every
        team-restricted project on top of its permissions, and a role that
        contains it are given only by a superadmin or a caller who holds the
        `admin` role: a caller who holds every permission of it through
        another role gets 403 `You cannot assign the role "admin": it is or
        contains the admin role, which only superadmins and admins may
        assign.` The answers come in this order: 403
        `Forbidden.` without `user.create`; 422 for an unknown
        `auth_source` or `role`; 403 for a role the caller may not assign;
        403 for `is_superadmin: true` from a caller who is no superadmin;
        422 for a password or another field that is not valid.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
            example:
              username: operator01
              email: operator01@example.com
              password: changeme123
              role: operator
      responses:
        '201': { $ref: '#/components/responses/UserResponse' }
        '403': { $ref: '#/components/responses/UserGrantForbidden' }
        '422':
          description: |
            Invalid input, such as a missing password, or a `role` that is not
            the name of one of the instance's roles, compared exactly; that
            answer names the roles. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                role:
                  summary: role names no role of the instance
                  value:
                    error:
                      message: 'role must be one of: admin, operator, viewer.'
  /api/v1/users/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Users]
      summary: Get a single user
      description: |
        Requires `user.view`. Sensitive fields (password_hash, auth_key,
        totp_secret, recovery_codes) are never returned.
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Update a user
      description: |
        Requires `user.update`. A caller who is no superadmin changes only a
        user who is no superadmin and all of whose assigned roles they may
        assign, that is, whose roles grant no permission the caller does not
        hold; a user without an assigned role may be changed by everyone with
        `user.update`. Anyone else gets 403 `You cannot change or delete this
        user: they are a superadmin, or a role assigned to them grants
        permissions you do not hold.` and nothing is written. A caller who
        holds every permission those roles grant, but neither is a superadmin
        nor holds the `admin` role, gets 403 `You cannot change or delete this
        user: a role assigned to them is or contains the admin role, which
        only a superadmin or an admin may assign.` in its place for a user who
        is no superadmin and holds the `admin` role or a role that contains
        it, whatever the user's teams; nothing is written. A caller who
        neither is a superadmin nor holds the `admin` role changes a user
        only when, for every team-restricted project the user's teams give
        the user, the caller's own teams give the caller that project with at
        least the same role (operator over viewer; the highest role of their
        teams counts); anyone else gets 403 `You cannot change or delete this
        user: their teams give them more access to a project than you have.`
        where the roles allow the change, and nothing is written.

        Password is optional on update — if provided it must be at least 5
        characters. The only active superadmin changes their own account,
        but taking their superadmin flag (`is_superadmin: false`) answers
        422 `Cannot demote the only active superadmin.`, and deactivating
        them (a `status` other than 10) answers 422 `Cannot deactivate the
        only active superadmin.`; both change nothing. An inactive
        superadmin does not count as another superadmin, and may be demoted
        or deactivated. A change of `status` clears `ldap_sync_disabled`, so
        an LDAP account deactivated this way stays inactive whatever the
        directory says.

        A `role` the user already has, one of the roles assigned to them,
        keeps every role assigned to the user, so a `role` read with `GET`
        and sent back keeps them all; another role replaces them all and
        needs every permission it grants, unless the caller is a
        superadmin. The `admin` role, which gives every team-restricted
        project on top of its permissions, and a role that contains it are
        given only by a superadmin or a caller who holds the `admin` role: a
        caller who holds every permission of it through another role gets
        403 `You cannot assign the role "admin": it is or contains the admin
        role, which only superadmins and admins may assign.` Only a
        superadmin changes `is_superadmin`: a value that would set or clear
        the flag answers 403 for anyone else, and the current value is
        accepted. A refusal answers 403 and changes nothing. The answers come
        in this order: 403 `Forbidden.` without `user.update`; 404 for an
        unknown user; 403 for a user the caller may not change, for their
        roles or their teams; 422 for a change of `auth_source` or an unknown
        `role`; 403 for a role the caller may not assign; 403 for a change of
        `is_superadmin` from a caller who is no superadmin; 422 `Cannot
        demote the only active superadmin.` or `Cannot deactivate the only
        active superadmin.`; 422 for a password or another field that is not
        valid.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200': { $ref: '#/components/responses/UserResponse' }
        '403': { $ref: '#/components/responses/UserUpdateForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: |
            Invalid input, such as a password that is too short, taking the
            superadmin flag from the only active superadmin or deactivating
            them, or a `role` that is not the name of one of the instance's
            roles, compared exactly; that answer names the roles. Nothing was
            written: neither the user nor their roles changed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                role:
                  summary: role names no role of the instance
                  value:
                    error:
                      message: 'role must be one of: admin, operator, viewer.'
                deactivate:
                  summary: status 0 for the only active superadmin
                  value:
                    error:
                      message: 'Cannot deactivate the only active superadmin.'
    delete:
      tags: [Users]
      summary: Delete a user
      description: |
        Requires `user.delete`. A caller who is no superadmin deletes only a
        user who is no superadmin and all of whose assigned roles they may
        assign, and, unless the caller holds the `admin` role, whose teams
        give them no project beyond what the caller's teams give the caller,
        with at least the same role; anyone else gets 403 `You cannot change
        or delete this user: they are a superadmin, or a role assigned to them
        grants permissions you do not hold.`, 403 `You cannot change or delete
        this user: a role assigned to them is or contains the admin role,
        which only a superadmin or an admin may assign.` (a user who is no
        superadmin, with the `admin` role or a role that contains it, from a
        caller who holds every permission of the user's roles but not the
        `admin` role, whatever the teams) or 403 `You cannot change or delete
        this user: their teams give them more access to a project than you
        have.` and nothing is deleted. Cannot delete your own
        account or the only active superadmin (422); an inactive superadmin
        may be deleted. A user whom other records still refer to cannot be
        deleted either (409): jobs they launched, rows they created (projects,
        templates, schedules and so on) or a trigger token they generated.
        Disable such a user instead (`PUT` with `status: 0`). The answers come
        in this order: 403 `Forbidden.` without `user.delete`; 404 for an
        unknown user; 403 for a user the caller may not change, for their
        roles or their teams; 422 `Cannot delete your own account.`; 422
        `Cannot delete the only active superadmin.`; 409 for a user other
        records still refer to.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/UserDeleteForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            Other records still refer to the user. Nothing was changed: the
            user and their roles are kept.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ───────────────────────────── LDAP ─────────────────────────────
  /api/v1/admin/ldap/test:
    get:
      tags: [LDAP]
      summary: Run an LDAP connection diagnostic
      description: |
        Admin-only. Performs a service-account bind against the configured
        directory and returns connection-level diagnostics. Never returns the
        bind password or any other secret.
      responses:
        '200':
          description: Diagnostic snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LdapDiagnosticResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServerError' }
    post:
      tags: [LDAP]
      summary: Run a diagnostic and verify a directory user
      description: |
        Admin-only. Same as `GET /admin/ldap/test`, plus an optional user
        lookup. If `password` is included the call performs a full
        authenticate (bind as user); otherwise it performs a search-only
        lookup. Useful for verifying the search filter, group mapping,
        and the resulting Ansilume role assignment for a candidate user.
        Without a `password`, a lookup that fails, whether the service bind,
        the user search or the group search, answers `found: false` with
        that failure as `error`; `User not found in directory.` means that
        the directory has no such user.

        Audited via `ldap.test.performed`. The submitted password is **never**
        logged, persisted, or returned.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Directory username to look up (sAMAccountName / uid).
                password:
                  type: string
                  description: Optional. If set, performs a full authenticate.
            example:
              username: jdoe
              password: optional-only-for-bind-verification
      responses:
        '200':
          description: Diagnostic snapshot with optional user lookup
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/LdapDiagnosticResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServerError' }

  # ─────────────────────────── System ───────────────────────────
  /api/v1/system/artifact-stats:
    get:
      tags: [System]
      summary: Aggregate artifact storage statistics
      description: |
        Admin-only. Returns total bytes/count of stored artifacts, the top
        ten jobs by artifact size, and the active retention/quota config.
        Requires `user.view`.
      responses:
        '200':
          description: Storage stats snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/ArtifactStorageStats' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ─────────────────────────── Webhooks ───────────────────────────
  /api/v1/webhooks:
    get:
      tags: [Webhooks]
      summary: List webhooks
      description: Requires `admin` role.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/WebhookList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Webhooks]
      summary: Create a webhook
      description: Requires `admin` role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookInput' }
            example:
              name: slack-notifications
              url: "https://hooks.slack.com/services/T00/B00/xxx"
              events: [job.success, job.failure]
              enabled: true
      responses:
        '201': { $ref: '#/components/responses/WebhookResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/webhooks/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Webhooks]
      summary: Get a single webhook
      description: Requires `admin` role.
      responses:
        '200': { $ref: '#/components/responses/WebhookResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Webhooks]
      summary: Update a webhook
      description: Requires `admin` role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookInput' }
      responses:
        '200': { $ref: '#/components/responses/WebhookResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Webhooks]
      summary: Delete a webhook
      description: Requires `admin` role.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── Audit Logs ───────────────────────
  /api/v1/audit-logs:
    get:
      tags: [Audit Logs]
      summary: List audit log entries
      description: |
        Requires `user.view`. Supports filtering by action, user_id, and
        object_type via query parameters.
      parameters:
        - $ref: '#/components/parameters/Page'
        - in: query
          name: action
          required: false
          schema: { type: string }
          description: Filter by action name (e.g. "user.login")
        - in: query
          name: user_id
          required: false
          schema: { type: integer }
          description: Filter by user ID
        - in: query
          name: object_type
          required: false
          schema: { type: string }
          description: Filter by object type (e.g. "project", "job")
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/AuditLogList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/audit-logs/{id}:
    get:
      tags: [Audit Logs]
      summary: Get a single audit log entry
      description: Requires `user.view`.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/AuditLogResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────── Notification Templates ───────────────────────
  /api/v1/notification-templates:
    get:
      tags: [Notification Templates]
      summary: List notification templates
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationTemplateList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Notification Templates]
      summary: Create a notification template
      description: |
        Requires `notification-template.create`. The answer shows every
        channel secret of `config` as `$encrypted$`, as every answer does
        (see `config` of `NotificationTemplate`); `$encrypted$` at the place
        of a channel secret in the body answers 422, as nothing is stored
        yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTemplateInput' }
      responses:
        '201': { $ref: '#/components/responses/NotificationTemplateResponse' }
        '422': { $ref: '#/components/responses/NotificationTemplateRejected' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/notification-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Notification Templates]
      summary: Get a single notification template
      responses:
        '200': { $ref: '#/components/responses/NotificationTemplateResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Notification Templates]
      summary: Update a notification template
      description: |
        Requires `notification-template.update`. Fields left out keep their
        value. `$encrypted$` at the place of a channel secret in `config`
        keeps the stored secret, so a template read with `GET` and sent
        back unchanged keeps every secret (see `config` of
        `NotificationTemplateInput`); a new value replaces the stored one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationTemplateInput' }
            example:
              name: ops-telegram
              channel: telegram
              events: job.failed,workflow.failed
              config: { bot_token: '$encrypted$', chat_id: '-1001234567890' }
      responses:
        '200': { $ref: '#/components/responses/NotificationTemplateResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/NotificationTemplateRejected' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Notification Templates]
      summary: Delete a notification template
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/notification-templates/{id}/test:
    post:
      tags: [Notification Templates]
      summary: Send a test notification through this template
      description: |
        Requires `notification-template.update`. Sends one test message
        through the template's channel, with the sample variables of the
        web UI's Send Test: sample values, as strings, of the variables
        that notifications carry, among them `event`, `severity`,
        `app.url`, the job, template, project, runner, workflow, schedule,
        approval and trigger ones, `approval.required_by`,
        `job.inventory_id` and `job.inventory_name`; `launched_by` is the
        caller. The event is the template's first event, else `test`, as
        in the web UI. Before 2.12.0 it sent nine variables of its own,
        for the event `test`. Like every send, it writes a
        `notification.dispatched` or `notification.failed` audit entry,
        which names the event.
        Answers `{"sent": true}` only when the channel took the message.
        When the channel did not, for example a webhook endpoint that
        answered an error status or could not be reached, the call answers
        502 with `Test failed: ` and the channel's error, where it answered
        `{"sent": true}` before. Another error answers 500 with
        `Test failed: ` and the error; a database error is named by its
        class, SQLSTATE and driver error code, never by its message.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200':
          description: The channel took the test message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      sent: { type: boolean, enum: [true] }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500':
          description: |
            The test failed outside the delivery, for example while the
            message was put together. The message names the error, a
            database error by its class, SQLSTATE and driver error code
            only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  message: 'Test failed: yii\db\Exception (SQLSTATE HY000, driver error 2006)'
        '502':
          description: |
            The channel did not take the test message. The message names the
            channel's error, such as the HTTP status a webhook endpoint
            answered (`HTTP 0` when nothing answered). The
            `notification.failed` audit entry has the same error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  message: 'Test failed: WebhookChannel: HTTP 404 — Not Found'

  # ─────────────────────────── Approval Rules ───────────────────────────
  /api/v1/approval-rules:
    get:
      tags: [Approval Rules]
      summary: List approval rules
      description: Requires `approval-rule.view`. Newest first, 25 per page, without `used_by`.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRuleList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Approval Rules]
      summary: Create an approval rule
      description: |
        Requires `approval-rule.create`, which of the built-in roles only
        admin holds (403 `Forbidden.` otherwise, operators included). The
        caller becomes `created_by`. Audited as `approval-rule.created` with
        the rule's settings and source `api`. The response is the rule as
        stored, with the database's defaults for the fields the body left
        out.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRuleInput' }
            example:
              name: deploy-prod
              description: Production deploys need a second pair of eyes
              approver_type: users
              approver_config: { user_ids: [7, 12] }
              required_approvals: 1
              timeout_minutes: 60
              timeout_action: reject
      responses:
        '201': { $ref: '#/components/responses/ApprovalRuleResponse' }
        '422': { $ref: '#/components/responses/ApprovalRuleRejected' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/approval-rules/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Approval Rules]
      summary: Get an approval rule
      description: |
        Requires `approval-rule.view`. Includes `used_by`: where the rule is
        used, which decides whether it can be deleted.
      responses:
        '200': { $ref: '#/components/responses/ApprovalRuleDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Approval Rules]
      summary: Update an approval rule
      description: |
        Requires `approval-rule.update`, which of the built-in roles only
        admin holds (403 `Forbidden.` otherwise, operators included). Fields
        the body leaves out keep their value; `created_by` cannot be
        changed. Audited as `approval-rule.updated` with each changed field
        under `changes`, as `{"from": ..., "to": ...}`, and source `api`.
        The response is the rule as stored.

        A rule that is in use changes for its inventories, job templates and
        approval steps at once. Its pending requests are checked against the
        new settings at their next vote or timeout, not when the rule
        changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalRuleInput' }
            example:
              required_approvals: 2
              approver_config: { user_ids: [7, 12, 15] }
      responses:
        '200': { $ref: '#/components/responses/ApprovalRuleResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ApprovalRuleRejected' }
    delete:
      tags: [Approval Rules]
      summary: Delete an approval rule
      description: |
        Requires `approval-rule.delete` (403 otherwise). A rule is in use
        while inventories, live job templates, steps of live workflows or
        pending approval requests whose job still waits for approval refer
        to it. Deleting a rule in use is refused with 409, a message that
        counts each of them (`1 inventory(ies)`, `2 job template(s)` and so
        on) and `error.used_by`, and nothing is changed; there is no force
        option. Remove the rule from the inventories, job templates
        and workflow steps, and let its pending requests be decided or their
        jobs canceled, first. An inventory's rule is removed with
        `PUT /api/v1/inventories/{id}` and `approval_rule_id: null`, by an
        admin.

        Deleting an unused rule clears it from deleted job templates and
        from steps of deleted workflows, which cannot run, and keeps its
        resolved approval requests, whose `approval_rule_id` becomes
        null. Audited as `approval-rule.deleted` with the rule's settings,
        the number of detached job templates and workflow steps, and source
        `api`.

        A delete that collides with a concurrent assignment of the rule
        (deadlock or lock wait timeout) is retried once and then refused
        with the same 409 and `used_by`; a second collision is a 500.
      responses:
        '200': { $ref: '#/components/responses/DeletedResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/ApprovalRuleInUse' }

  # ────────────────────────────── Approvals ──────────────────────────────
  /api/v1/approvals:
    get:
      tags: [Approvals]
      summary: List approval requests
      description: |
        Requires `approval.view`. Lists approval requests of every status
        (pending, approved, rejected, timed out, canceled), newest first, 25
        per page; with `status`, only the requests of that status. Only the
        requests the caller may see: those of jobs whose project the caller
        may view and those of workflow approval steps whose workflow the
        caller may view. The request of a workflow step names its run, step
        and workflow only to a caller who may view that workflow (see
        `workflow_job_id` of `ApprovalRequest`). Each request lists its
        votes in `decisions`, read for the whole page at once, says what
        required it (`required_by`), and names the inventory its job was
        launched with (`inventory_id`, `inventory_name`).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ApprovalStatusFilter'
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/ApprovalRequestList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: |
            `status` is not a status of approval requests; nothing was
            listed. An empty `status` lists every request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  message: 'status must be one of: pending, approved, rejected, timed_out, canceled.'
  /api/v1/approvals/{id}:
    get:
      tags: [Approvals]
      summary: Get an approval request
      description: |
        Requires `approval.view` and view access to the request (403
        otherwise), as for the list. The request lists its votes in
        `decisions`.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/ApprovalRequestResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/approvals/{id}/approve:
    post:
      tags: [Approvals]
      summary: Approve a pending request
      description: |
        Requires `approval.decide`. A request the caller may not see answers
        403 `Forbidden.` before anything else. Then the vote is checked
        under a lock of the request, in this order, and a refused vote
        records nothing:
        - the request is resolved (approved, rejected, timed out or
          canceled): 409;
        - it has expired (`expires_at` has passed): 409, as the next
          maintenance run applies its timeout;
        - its job no longer waits for approval, for example because it was
          canceled: 409, and the request is closed as canceled; also when
          the job still waits but its workflow run has ended, which
          cancels the job too, and likewise when its workflow step no
          longer runs or its job template was deleted;
        - the caller launched the job: 403 `You launched this job; another
          approver must decide.`; for the job of a workflow step, the
          placeholder job of an approval step or the job of a gated job
          step, whose run the caller started: 403 `You launched this
          workflow run; another approver must decide.`; also for admins and
          superadmins;
        - the caller is not an eligible approver (see Approvals): 403
          `You are not eligible to decide on this request.`;
        - the caller has voted on this request already: 422
          `User has already voted on this request.`;
        - the vote cannot be stored, for example a comment that is too
          long: 422 `The decision cannot be recorded: ...`.
        A 409 carries the request's status in `error.status`. A request
        that was deleted while the vote ran answers 404.

        The request is approved once the approvals that count reach the
        rule's `required_approvals`, and rejected as soon as the approvals
        still possible cannot reach it; the launcher's votes never count.
        Votes and timeouts settle a request exactly once. An approved job is
        queued; the placeholder job of a workflow approval step succeeds,
        and its run goes on. A workflow job step whose job waited for the
        approval stays running until its job finishes.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionInput' }
            example:
              comment: Change window confirmed
      responses:
        '200': { $ref: '#/components/responses/ApprovalRequestResponse' }
        '403': { $ref: '#/components/responses/ApprovalDecisionForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ApprovalDecisionConflict' }
        '422': { $ref: '#/components/responses/ApprovalDecisionRejected' }
  /api/v1/approvals/{id}/reject:
    post:
      tags: [Approvals]
      summary: Reject a pending request
      description: |
        Requires `approval.decide`; the same checks, in the same order, and
        the same answers as approve (403, 409, 422). A rejection lowers the
        approvals still possible: the request is rejected as soon as they
        cannot reach the rule's `required_approvals`. A rejected job ends
        as `rejected`; a workflow approval step, or a job
        step whose job waited for the approval, then fails, and its run
        follows the step's On Failure branch or ends as failed (see
        `on_failure_step_id` of `WorkflowStep`). The comment is stored with
        the vote and shown with the decisions, also in `decisions` of the
        request.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionInput' }
            example:
              comment: Not during the freeze
      responses:
        '200': { $ref: '#/components/responses/ApprovalRequestResponse' }
        '403': { $ref: '#/components/responses/ApprovalDecisionForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/ApprovalDecisionConflict' }
        '422': { $ref: '#/components/responses/ApprovalDecisionRejected' }

  # ─────────────────────── Workflow Templates ───────────────────────
  /api/v1/workflow-templates:
    get:
      tags: [Workflow Templates]
      summary: List workflow templates
      description: |
        Requires `workflow-template.view`. Lists only the workflow templates
        the caller may see: view access to the project of every job step.
        Workflows without job steps are listed for everyone with the
        permission. Newest first, 25 per page, without the steps.
      parameters: [{ $ref: '#/components/parameters/Page' }]
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowTemplateList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Workflow Templates]
      summary: Create a workflow template
      description: |
        Requires `workflow-template.create`. The caller becomes `created_by`;
        `created_by` and trigger token fields in the body are ignored.

        `steps` lists the steps in run order, see `WorkflowStepInput`. The
        job template of every job step must be one the caller may operate:
        job templates that do not exist, are deleted or belong to a project
        the caller cannot see answer 422, visible ones the caller may not
        operate answer 403, and both name the offending templates in
        `error.job_template_ids`. An invalid step answers 422 with a message
        that names it (`steps[1]: Name cannot be blank.`), unknown approval
        rules answer 422 as well. Nothing is written unless the template and
        every step are valid; the template and its steps are then written in
        one transaction.

        Approval steps are for admins: steps that include one need
        `approval-rule.update`, otherwise the call answers 403 `Only admins
        may add approval steps: that needs approval-rule.update.` and writes
        nothing. So are gated job steps, job steps whose job template has an
        approval rule: steps that include one need `approval-rule.update` as
        well, otherwise the call answers 403 `Only admins may add a job step
        whose job template has an approval rule: that needs
        approval-rule.update.` A job step whose job template's inventory has
        an approval rule is a gated job step too: 403 `Only admins may add a
        job step whose job template's inventory has an approval rule: that
        needs approval-rule.update.` A job template the caller cannot see
        counts as none for this check and answers 422 as not found. Whether
        a job step's job template is gated is checked again in the transaction
        that writes the steps: an approval rule assigned to it meanwhile
        answers the same 403 `Only admins may add a job step whose job
        template has an approval rule: that needs approval-rule.update.`,
        and nothing is written. A rule assigned meanwhile to the inventory
        of such a job template answers its inventory's 403 the same way.
        The answers come in this order: 422 for a
        template that is not valid, such as one without a name (`Name
        cannot be blank.`); 422 for steps that cannot be read; 403 for
        approval steps and gated job steps; 422 for unknown approval rules;
        422 or 403 for job templates; 403 for a job template that got an
        approval rule meanwhile; 422 for a template or step that cannot be
        saved.

        The `steps` list sets no branches (`on_success_step_id`,
        `on_failure_step_id`, `on_always_step_id`): steps written here have
        none, so a step that succeeds or fails continues with the next step
        in the list. An approval step that is rejected, times out or is
        canceled, and a job step whose job is rejected or canceled while it
        waits for approval, end the run as failed instead (see
        `on_failure_step_id` of `WorkflowStep`). Set branches with the step
        endpoints, which add, change, move and remove one step:
        `POST /api/v1/workflow-templates/{id}/steps` and
        `PUT /api/v1/workflow-templates/{id}/steps/{stepId}`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowTemplateInput' }
            example:
              name: Release web
              description: Build, approve, deploy
              steps:
                - name: Build
                  step_type: job
                  job_template_id: 12
                - name: Release approval
                  step_type: approval
                  approval_rule_id: 3
                - name: Deploy
                  step_type: job
                  job_template_id: 15
                  extra_vars_template: { app_version: build_version }
      responses:
        '201': { $ref: '#/components/responses/WorkflowTemplateResponse' }
        '403':
          description: |
            Missing `workflow-template.create`, approval steps or gated job
            steps without `approval-rule.update` (also a job template of
            the new steps that got an approval rule while they were
            written), or a job step uses a job template the caller can see
            but may not operate (named in `error.job_template_ids`). Nothing
            was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobTemplateRefError' }
              examples:
                approvalStep:
                  summary: The steps include an approval step
                  value:
                    error:
                      message: 'Only admins may add approval steps: that needs approval-rule.update.'
                gatedJobStep:
                  summary: The steps include a job step whose job template has an approval rule
                  value:
                    error:
                      message: 'Only admins may add a job step whose job template has an approval rule: that needs approval-rule.update.'
                gatedInventoryJobStep:
                  summary: The steps include a job step whose job template's inventory has an approval rule
                  value:
                    error:
                      message: "Only admins may add a job step whose job template's inventory has an approval rule: that needs approval-rule.update."
                jobTemplate:
                  summary: A job template the caller may not operate
                  value:
                    error:
                      message: 'You may not use job template(s) #15 in a workflow: that needs operator access to their project.'
                      job_template_ids: [15]
        '422':
          description: |
            Invalid template or step, an unknown approval rule, or job
            templates that do not exist for the caller (named in
            `error.job_template_ids`). Nothing was written.
          content: { application/json: { schema: { $ref: '#/components/schemas/JobTemplateRefError' } } }
  /api/v1/workflow-templates/{id}:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    get:
      tags: [Workflow Templates]
      summary: Get a workflow template
      description: |
        Requires `workflow-template.view` and view access to the project of
        every job step (403 otherwise). Includes the steps in run order, by
        `position`, each with where its branches lead (`routes`), and the
        workflow's start step (`start_step_id`) and success path
        (`success_path`).
      responses:
        '200': { $ref: '#/components/responses/WorkflowTemplateResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Workflow Templates]
      summary: Update a workflow template
      description: |
        Requires `workflow-template.update` and operator access to the project
        of every current job step (403 `Forbidden.` otherwise). Omitted
        fields keep their value. Without `steps`, or with `steps: null`, the
        steps stay as they are. A `steps` list replaces all of them: every
        step is deleted with its branches, and the listed steps are written
        as new steps, with new IDs and without branches, so the branches
        that led to the old steps are gone too; `[]` removes them all. To
        change one step and keep its ID and the branches that lead to it,
        use `PUT /api/v1/workflow-templates/{id}/steps/{stepId}`. New steps
        are checked as on create (422 or 403 with `error.job_template_ids`).
        A rejected update changes nothing, neither the template nor its
        steps.

        Approval steps and gated job steps (job steps whose job template has
        an approval rule) are for admins (`approval-rule.update`). Without
        that permission, a `steps` list that includes an approval step
        answers 403 `Only admins may add approval steps: that needs
        approval-rule.update.`, one that includes a gated job step 403 `Only
        admins may add a job step whose job template has an approval rule:
        that needs approval-rule.update.`, and any `steps` list for a
        workflow that has an approval step answers 403 `This workflow has an
        approval step: only admins may change its steps
        (approval-rule.update).`, or for a workflow that has a gated job step
        403 `This workflow has a job step whose job template has an approval
        rule: only admins may change its steps (approval-rule.update).`, also
        when it holds the same steps. A job step whose job template's
        inventory has an approval rule is a gated job step too: 403 `Only
        admins may add a job step whose job template's inventory has an
        approval rule: that needs approval-rule.update.` for a new one, and
        `This workflow has a job step whose job template's inventory has an
        approval rule: only admins may change its steps
        (approval-rule.update).` for a workflow that has one; the job
        template's own rule is named first. Whether a job step is gated is
        read from its job template and its inventory at each call, so a job
        template that gets an approval rule locks the workflows that use it
        from then on, and so does an inventory that gets one. The new steps
        are checked again while the workflow is locked: an approval rule
        assigned meanwhile to the job template of a new job step
        answers the same 403 `Only admins may add a job step whose job
        template has an approval rule: that needs approval-rule.update.`,
        and nothing is written. A rule assigned meanwhile to its inventory
        answers its inventory's 403 the same way. A job template the caller
        cannot see counts as none for this check. Without `steps`, or with
        `steps: null`, the name and description change as before.

        The steps cannot change while a run of the workflow is active
        (`running`): such an update answers 409 and names the runs in
        `error.workflow_job_ids`. Let them finish, or cancel them, first. A
        workflow that another request deleted meanwhile answers 404
        `Workflow template #5 not found.` The answers come in this order:
        403 `Forbidden.` without access to the workflow; 422 for a template
        that is not valid, such as an empty name (`Name cannot be blank.`);
        422 for steps that cannot be read; 403 for approval steps and gated
        job steps; 422 for unknown approval rules; 422 or 403 for job
        templates; 404 for a workflow deleted meanwhile; 403 `Forbidden.`
        for operator access lost meanwhile; 403 for steps locked meanwhile;
        409 for an active run; 403 for a job template that got an approval
        rule meanwhile; 422 for a template or step that cannot be saved.

        Runs keep the history of replaced steps: their executions keep the
        name and type the step had when it ran (`step_name`, `step_type`),
        and their `workflow_step_id` becomes null.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowTemplateInput' }
      responses:
        '200': { $ref: '#/components/responses/WorkflowTemplateResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          description: |
            Missing `workflow-template.update`, no operator access to the
            project of every current job step, approval steps or gated job
            steps without `approval-rule.update` (also a job template of the
            new steps that got an approval rule while they were written), or
            a new step uses a job template the caller can see but may not
            operate (named in `error.job_template_ids`). Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobTemplateRefError' }
              examples:
                approvalStep:
                  summary: The new steps include an approval step
                  value:
                    error:
                      message: 'Only admins may add approval steps: that needs approval-rule.update.'
                gatedJobStep:
                  summary: The new steps include a job step whose job template has an approval rule
                  value:
                    error:
                      message: 'Only admins may add a job step whose job template has an approval rule: that needs approval-rule.update.'
                gatedInventoryJobStep:
                  summary: The new steps include a job step whose job template's inventory has an approval rule
                  value:
                    error:
                      message: "Only admins may add a job step whose job template's inventory has an approval rule: that needs approval-rule.update."
                approvalWorkflow:
                  summary: The workflow has an approval step
                  value:
                    error:
                      message: 'This workflow has an approval step: only admins may change its steps (approval-rule.update).'
                gatedJobWorkflow:
                  summary: The workflow has a job step whose job template has an approval rule
                  value:
                    error:
                      message: 'This workflow has a job step whose job template has an approval rule: only admins may change its steps (approval-rule.update).'
                gatedInventoryJobWorkflow:
                  summary: The workflow has a job step whose job template's inventory has an approval rule
                  value:
                    error:
                      message: "This workflow has a job step whose job template's inventory has an approval rule: only admins may change its steps (approval-rule.update)."
        '409': { $ref: '#/components/responses/WorkflowStepsLocked' }
        '422':
          description: |
            Invalid template or step, an unknown approval rule, or job
            templates that do not exist for the caller (named in
            `error.job_template_ids`). Nothing was written.
          content: { application/json: { schema: { $ref: '#/components/schemas/JobTemplateRefError' } } }
    delete:
      tags: [Workflow Templates]
      summary: Delete a workflow template
      description: |
        Requires `workflow-template.delete` and operator access to the project
        of every job step. A soft delete: the template disappears from lists
        and can no longer be launched; its runs stay. Its trigger token is
        revoked.

        The workflow's running runs are canceled: their running steps fail
        with `Not finished: the run was canceled because its workflow
        template was deleted.`, the jobs of these steps are canceled
        together with their pending approval requests, and each run gets
        one `workflow.canceled` audit entry and one `workflow.canceled`
        notification. A run that finished meanwhile keeps its outcome. The
        response counts the canceled runs, and the runs whose cancel failed;
        the maintenance run cancels those, or the jobs they left waiting,
        later (see `failed_runs`). A canceled run whose step's job could not
        be canceled leaves that job to the maintenance run as well, as
        `POST /api/v1/workflow-jobs/{id}/cancel` does. A launch at the same moment
        either commits first (its run is then canceled here) or is refused
        with 422 `Workflow template #5 was deleted.` A workflow that another
        request deleted first answers 404.
      responses:
        '200': { $ref: '#/components/responses/WorkflowTemplateDeletedResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflow-templates/{id}/steps:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [Workflow Templates]
      summary: Add a step to a workflow template
      description: |
        Requires `workflow-template.update` and operator access to the
        project of every job step of the workflow (403 `Forbidden.`
        otherwise). Adds one step (see `WorkflowStepCreateInput`); every
        other step keeps its ID and its branches. The step goes to the end
        of the run order unless `position` or `after_step_id` names another
        place. Its branches can lead to any step of the workflow, an earlier
        one too (a loop, see `WorkflowStep`). An empty branch of another
        step goes on with the step at the next position, so a step placed
        right after it changes where that branch leads: `change.message`
        says so.

        Approval steps and gated job steps (job steps whose job template has
        an approval rule) are for admins (`approval-rule.update`). Without
        that permission, adding an approval step answers 403 `Only admins
        may add approval steps: that needs approval-rule.update.`, adding a
        gated job step 403 `Only admins may add a job step whose job
        template has an approval rule: that needs approval-rule.update.`,
        and adding any step to a workflow that has an approval step 403
        `This workflow has an approval step: only admins may change its
        steps (approval-rule.update).`, or to one that has a gated job step
        403 `This workflow has a job step whose job template has an approval
        rule: only admins may change its steps (approval-rule.update).`
        A job step whose job template's inventory has an approval rule is a
        gated job step too: adding one answers 403 `Only admins may add a
        job step whose job template's inventory has an approval rule: that
        needs approval-rule.update.`, and adding any step to a workflow that
        has one 403 `This workflow has a job step whose job template's
        inventory has an approval rule: only admins may change its steps
        (approval-rule.update).`; the job template's own rule is named
        first. Whether a job step's job template is gated is checked again
        while the workflow is locked: an approval rule assigned to it meanwhile
        answers the same 403 `Only admins may add a job step whose job
        template has an approval rule: that needs approval-rule.update.`,
        and nothing is written. A rule assigned meanwhile to its inventory
        answers its inventory's 403 the same way. The job template of a job
        step must be one the caller may operate: one
        that does not exist, is deleted or belongs to a project the caller
        cannot see answers 422 `The selected job template does not exist.`,
        a visible one the caller may not operate 403 `You may not use this
        job template in a workflow: that needs operator access to its
        project.`; both name it in `error.job_template_ids`. The steps cannot
        change while a run of the workflow is active (409, the runs in
        `error.workflow_job_ids`). A refused change writes nothing.

        The answer holds the step as it is now (`data`, with its `position`
        and `routes`) and what the change did (`change`): where the step
        landed, how the empty branches of other steps now lead, and
        warnings when runs now start with another step, reach a job step
        without passing the approval step they passed before, or when an
        approval step is not on the success path (see `warnings` of
        `WorkflowStepChange`). Audited as `workflow-template.step.added`
        with source `api`.

        The answers come in this order: 401 without a valid token; 403
        `Forbidden.` without `workflow-template.update`; 404 for an unknown
        workflow; 403 `Forbidden.` without operator access to the workflow;
        422 for a body that cannot be read; 403 for an approval step, a
        gated job step or a workflow that has one; 422 or 403 for the job
        template; 422 for a step that is not valid; 404 for a workflow
        deleted meanwhile; 403 `Forbidden.` for operator access lost
        meanwhile; 403 for steps locked meanwhile; 409 for an active run;
        403 for a job template that got an approval rule meanwhile; 422 for
        a step that cannot be saved or a place it cannot take.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowStepCreateInput' }
            examples:
              jobStep:
                summary: A job step right after the approval step 42 that ends the run when its job fails
                value:
                  name: Deploy
                  step_type: job
                  job_template_id: 15
                  on_failure_step_id: 0
                  after_step_id: 42
              approvalStep:
                summary: An approval step at the start (admins only)
                value:
                  name: Release approval
                  step_type: approval
                  approval_rule_id: 3
                  position: start
              pauseStep:
                summary: A pause step at position 2 whose Resume continues with step 43
                value:
                  name: Wait for the change window
                  step_type: pause
                  on_success_step_id: 43
                  position: 2
              mapping:
                summary: A job step at the end that takes a variable from the output of the step before it
                value:
                  name: Smoke test
                  job_template_id: 16
                  extra_vars_template: { app_version: build_version }
      responses:
        '201': { $ref: '#/components/responses/WorkflowStepWritten' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Missing `workflow-template.update` or operator access to the
            workflow (`Forbidden.`); an approval step, a gated job step or a
            workflow that has one, without `approval-rule.update`; or a job
            template the caller can see but may not operate (named in
            `error.job_template_ids`). Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobTemplateRefError' }
              examples:
                forbidden:
                  summary: Missing workflow-template.update or operator access to the workflow
                  value:
                    error:
                      message: Forbidden.
                approvalStep:
                  summary: The step is an approval step
                  value:
                    error:
                      message: 'Only admins may add approval steps: that needs approval-rule.update.'
                gatedJobStep:
                  summary: The step is a job step whose job template has an approval rule
                  value:
                    error:
                      message: 'Only admins may add a job step whose job template has an approval rule: that needs approval-rule.update.'
                gatedInventoryJobStep:
                  summary: The step is a job step whose job template's inventory has an approval rule
                  value:
                    error:
                      message: "Only admins may add a job step whose job template's inventory has an approval rule: that needs approval-rule.update."
                approvalWorkflow:
                  summary: The workflow has an approval step
                  value:
                    error:
                      message: 'This workflow has an approval step: only admins may change its steps (approval-rule.update).'
                gatedJobWorkflow:
                  summary: The workflow has a job step whose job template has an approval rule
                  value:
                    error:
                      message: 'This workflow has a job step whose job template has an approval rule: only admins may change its steps (approval-rule.update).'
                gatedInventoryJobWorkflow:
                  summary: The workflow has a job step whose job template's inventory has an approval rule
                  value:
                    error:
                      message: "This workflow has a job step whose job template's inventory has an approval rule: only admins may change its steps (approval-rule.update)."
                jobTemplate:
                  summary: A job template the caller may see but not operate
                  value:
                    error:
                      message: 'You may not use this job template in a workflow: that needs operator access to its project.'
                      job_template_ids: [15]
        '404': { $ref: '#/components/responses/WorkflowForStepNotFound' }
        '409': { $ref: '#/components/responses/WorkflowStepsLocked' }
        '422':
          description: |
            The body cannot be read (see `WorkflowStepCreateInput`), the job
            template does not exist for the caller (named in
            `error.job_template_ids`), the step is not valid, or it cannot
            take the place the body names. The first refusal answers, and
            nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobTemplateRefError' }
              examples:
                bothGiven:
                  summary: position and after_step_id together
                  value:
                    error:
                      message: 'Send either position or after_step_id, not both.'
                position:
                  summary: A position that is no whole number from 1
                  value:
                    error:
                      message: 'position must be "start", "end" or a whole number from 1.'
                afterStepId:
                  summary: An after_step_id that is no whole number from 1
                  value:
                    error:
                      message: 'after_step_id must be the ID of a step of this workflow.'
                branch:
                  summary: A branch that is neither null, 0 nor a step ID, such as "" or true
                  value:
                    error:
                      message: 'on_failure_step_id must be null, 0 (end the workflow) or the ID of a step of this workflow.'
                pauseBranches:
                  summary: A pause step with an On Failure or Always branch
                  value:
                    error:
                      message: 'A pause step only has on_success_step_id: Resume continues there. Send on_failure_step_id and on_always_step_id as null.'
                numberTooLarge:
                  summary: A variable mapping with a number too large for JSON
                  value:
                    error:
                      message: 'The extra vars cannot be stored: they contain a number too large for JSON.'
                mappingShape:
                  summary: A variable mapping that is not an object of extra var names to output variable names, such as ["build_version"]
                  value:
                    error:
                      message: 'extra_vars_template must be null or a JSON object that maps extra var names to the names of output variables, such as {"app_version": "build_version"}.'
                name:
                  summary: No name
                  value:
                    error:
                      message: 'Name cannot be blank.'
                stepType:
                  summary: A type other than job, approval and pause
                  value:
                    error:
                      message: 'Step Type is invalid.'
                stepTypeBlank:
                  summary: A step_type that is null or empty
                  value:
                    error:
                      message: 'Step Type cannot be blank.'
                jobTemplateRequired:
                  summary: A job step without a job template
                  value:
                    error:
                      message: 'A job step needs a job template.'
                jobTemplateNotFound:
                  summary: A job template that does not exist for the caller
                  value:
                    error:
                      message: 'The selected job template does not exist.'
                      job_template_ids: [12]
                approvalRuleRequired:
                  summary: An approval step without an approval rule
                  value:
                    error:
                      message: 'An approval step needs an approval rule.'
                approvalRuleNotFound:
                  summary: An approval rule that does not exist
                  value:
                    error:
                      message: 'The selected approval rule does not exist.'
                approvalAlways:
                  summary: An approval step with an Always branch
                  value:
                    error:
                      message: 'An approval step cannot have an Always branch: a rejection would continue past it.'
                branchOutside:
                  summary: A branch to a step that is not part of this workflow
                  value:
                    error:
                      message: 'The selected step is not part of this workflow.'
                afterStepMissing:
                  summary: after_step_id names a step that is not, or no longer, part of this workflow
                  value:
                    error:
                      message: 'The step to place it after (step ID 12) is not part of this workflow. Load the workflow again and choose another position.'
                positionOutOfRange:
                  summary: A position after the end of a workflow with 3 steps, where the new step can take 1 to 4
                  value:
                    error:
                      message: 'position must be "start", "end" or a number from 1 to 4.'
  /api/v1/workflow-templates/{id}/steps/{stepId}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/StepIdPath'
    put:
      tags: [Workflow Templates]
      summary: Change a step of a workflow template
      description: |
        Requires `workflow-template.update` and operator access to the
        project of every job step of the workflow (403 `Forbidden.`
        otherwise). Changes the step in place: it keeps its ID, so the
        branches that lead to it and the history of its runs stay. Only the
        fields the body sends change (see `WorkflowStepUpdateInput`); null
        clears a branch, which then goes on with the next step in the run
        order, or the variable mapping. With `position` or `after_step_id`
        the step moves too. The type of a step cannot change: a body with
        another `step_type` answers 422 `A step's type cannot change: add a
        new step and remove this one.`

        The steps of a workflow that has an approval step or a gated job
        step are for admins (`approval-rule.update`): without it, an update
        answers 403 `This workflow has an approval step: only admins may
        change its steps (approval-rule.update).` or `This workflow has a
        job step whose job template has an approval rule: only admins may
        change its steps (approval-rule.update).` So is giving a job step a
        job template with an approval rule: 403 `Only admins may add a job
        step whose job template has an approval rule: that needs
        approval-rule.update.` This is checked again while the workflow is
        locked: an approval rule assigned to that job template meanwhile
        answers the same 403, and nothing is written. A job template whose
        inventory has an approval rule makes a gated job step too: giving a
        job step one answers 403 `Only admins may add a job step whose job
        template's inventory has an approval rule: that needs
        approval-rule.update.`, and a workflow with such a step answers 403
        `This workflow has a job step whose job template's inventory has an
        approval rule: only admins may change its steps
        (approval-rule.update).`; the job template's own rule is named
        first. A new job template is
        checked as on add (422
        or 403, with `error.job_template_ids`). An approval step that an
        older version saved with an Always branch answers 422 `An approval
        step cannot have an Always branch: a rejection would continue past
        it.` until the body sends `on_always_step_id: null`. The steps
        cannot change while a run of the workflow is active (409). A refused
        change writes nothing.

        An update that changes nothing answers 200 with `change.message`
        `Step "Deploy" is unchanged.`, writes nothing and is not audited.
        The variable mapping is compared by its JSON value, so a step sent
        back as `GET` answers it (`extra_vars_template: []` for none, or the
        stored mapping without its spaces) is unchanged.
        Any other is audited as `workflow-template.step.updated` with source
        `api` and the changed fields, each with its old and new value (the
        variable mapping only as changed, without its values).

        The answers come in this order: 401 without a valid token; 403
        `Forbidden.` without `workflow-template.update`; 404 for an unknown
        workflow; 403 `Forbidden.` without operator access to the workflow;
        404 for a step the workflow does not have; 422 for a body that
        cannot be read or another step type; 403 for a workflow whose steps
        are for admins, or a gated job template; 422 or 403 for a new job
        template; 422 for a step that is not valid; 404 for a workflow
        deleted meanwhile; 403 `Forbidden.` for operator access lost
        meanwhile; 403 for steps locked meanwhile; 409 for an active run;
        404 for a step removed meanwhile; 403 for a job template the update
        gives a job step that got an approval rule meanwhile; 422 for a step
        that cannot be saved or a place it cannot take.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowStepUpdateInput' }
            examples:
              renameAndBranch:
                summary: A new name, and a failed job goes back to step 41
                value:
                  name: Deploy web
                  on_failure_step_id: 41
              branchAndPlace:
                summary: Empty the On Success branch and move the step to position 2
                value:
                  on_success_step_id: null
                  position: 2
              legacyAlways:
                summary: Remove the Always branch an older version saved on an approval step
                value:
                  on_always_step_id: null
      responses:
        '200': { $ref: '#/components/responses/WorkflowStepWritten' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Missing `workflow-template.update` or operator access to the
            workflow (`Forbidden.`); a workflow that has an approval step or
            a gated job step, or a gated job template, without
            `approval-rule.update`; or a new job template the caller can see
            but may not operate (named in `error.job_template_ids`). Nothing
            was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobTemplateRefError' }
              examples:
                forbidden:
                  summary: Missing workflow-template.update or operator access to the workflow
                  value:
                    error:
                      message: Forbidden.
                approvalWorkflow:
                  summary: The workflow has an approval step
                  value:
                    error:
                      message: 'This workflow has an approval step: only admins may change its steps (approval-rule.update).'
                gatedJobWorkflow:
                  summary: The workflow has a job step whose job template has an approval rule
                  value:
                    error:
                      message: 'This workflow has a job step whose job template has an approval rule: only admins may change its steps (approval-rule.update).'
                gatedInventoryJobWorkflow:
                  summary: The workflow has a job step whose job template's inventory has an approval rule
                  value:
                    error:
                      message: "This workflow has a job step whose job template's inventory has an approval rule: only admins may change its steps (approval-rule.update)."
                gatedJobStep:
                  summary: The new job template has an approval rule
                  value:
                    error:
                      message: 'Only admins may add a job step whose job template has an approval rule: that needs approval-rule.update.'
                gatedInventoryJobStep:
                  summary: The new job template's inventory has an approval rule
                  value:
                    error:
                      message: "Only admins may add a job step whose job template's inventory has an approval rule: that needs approval-rule.update."
                jobTemplate:
                  summary: A new job template the caller may see but not operate
                  value:
                    error:
                      message: 'You may not use this job template in a workflow: that needs operator access to its project.'
                      job_template_ids: [15]
        '404': { $ref: '#/components/responses/WorkflowStepNotFound' }
        '409': { $ref: '#/components/responses/WorkflowStepsLocked' }
        '422':
          description: |
            The body cannot be read (see `WorkflowStepUpdateInput`), it names
            another step type, the new job template does not exist for the
            caller (named in `error.job_template_ids`), the step is not
            valid, or it cannot take the place the body names. The first
            refusal answers, and nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobTemplateRefError' }
              examples:
                typeLocked:
                  summary: Another step type
                  value:
                    error:
                      message: "A step's type cannot change: add a new step and remove this one."
                bothGiven:
                  summary: position and after_step_id together
                  value:
                    error:
                      message: 'Send either position or after_step_id, not both.'
                position:
                  summary: A position that is no whole number from 1
                  value:
                    error:
                      message: 'position must be "start", "end" or a whole number from 1.'
                afterStepId:
                  summary: An after_step_id that is no whole number from 1
                  value:
                    error:
                      message: 'after_step_id must be the ID of a step of this workflow.'
                branch:
                  summary: A branch that is neither null, 0 nor a step ID, such as "" or true
                  value:
                    error:
                      message: 'on_success_step_id must be null, 0 (end the workflow) or the ID of a step of this workflow.'
                pauseBranches:
                  summary: An On Failure or Always branch for a pause step
                  value:
                    error:
                      message: 'A pause step only has on_success_step_id: Resume continues there. Send on_failure_step_id and on_always_step_id as null.'
                numberTooLarge:
                  summary: A variable mapping with a number too large for JSON
                  value:
                    error:
                      message: 'The extra vars cannot be stored: they contain a number too large for JSON.'
                mappingShape:
                  summary: A new variable mapping that is not an object of extra var names to output variable names
                  value:
                    error:
                      message: 'extra_vars_template must be null or a JSON object that maps extra var names to the names of output variables, such as {"app_version": "build_version"}.'
                name:
                  summary: An empty name
                  value:
                    error:
                      message: 'Name cannot be blank.'
                jobTemplateRequired:
                  summary: A job step without a job template, such as after job_template_id null
                  value:
                    error:
                      message: 'A job step needs a job template.'
                jobTemplateNotFound:
                  summary: A new job template that does not exist for the caller
                  value:
                    error:
                      message: 'The selected job template does not exist.'
                      job_template_ids: [12]
                approvalRuleNotFound:
                  summary: An approval rule that does not exist
                  value:
                    error:
                      message: 'The selected approval rule does not exist.'
                approvalAlways:
                  summary: An approval step that keeps an Always branch an older version saved
                  value:
                    error:
                      message: 'An approval step cannot have an Always branch: a rejection would continue past it.'
                branchOutside:
                  summary: A branch to a step that is not part of this workflow
                  value:
                    error:
                      message: 'The selected step is not part of this workflow.'
                afterStepMissing:
                  summary: after_step_id names a step that is not, or no longer, part of this workflow
                  value:
                    error:
                      message: 'The step to place it after (step ID 12) is not part of this workflow. Load the workflow again and choose another position.'
                afterItself:
                  summary: after_step_id names the step itself
                  value:
                    error:
                      message: 'A step cannot be placed after itself.'
                positionOutOfRange:
                  summary: A position after the end of a workflow with 3 steps
                  value:
                    error:
                      message: 'position must be "start", "end" or a number from 1 to 3.'
    delete:
      tags: [Workflow Templates]
      summary: Remove a step from a workflow template
      description: |
        Requires `workflow-template.update` and operator access to the
        project of every job step of the workflow (403 `Forbidden.`
        otherwise). Removes the step; every other step keeps its ID and its
        branches, and their empty branches now go on with the step that
        follows them. A step that branches of other steps lead to is not
        removed: 409 `Step "Deploy" was not removed: other steps route to it
        (step 1 "Build", step 4 "Verify"). Edit those steps to lead
        elsewhere first, then remove it.`, with those steps by position in
        the message and by ID in `error.step_ids`; change their branches
        first (`PUT /api/v1/workflow-templates/{id}/steps/{stepId}`). A
        branch of the step to itself does not keep it. The steps of a
        workflow that has an approval step or a gated job step are for
        admins (403, as for an update), and the steps cannot change while a
        run of the workflow is active (409). Runs keep the history of the
        removed step: its executions keep the name and type it had when it
        ran (`step_name`, `step_type`), and their `workflow_step_id` becomes
        null. The answer names the removed step (`data`) and what the
        removal did (`change`), with warnings when runs now start with
        another step, reach a job step without passing the approval step
        they passed before, or when an approval step is no longer on the
        success path (see `warnings` of `WorkflowStepChange`).
        Audited as `workflow-template.step.removed` with source `api`.

        The answers come in this order: 401 without a valid token; 403
        `Forbidden.` without `workflow-template.update`; 404 for an unknown
        workflow; 403 `Forbidden.` without operator access to the workflow;
        404 for a step the workflow does not have; 404 for a workflow deleted
        meanwhile; 403 `Forbidden.` for operator access lost meanwhile; 403
        for a workflow whose steps are for admins; 409 for an active run;
        404 for a step removed meanwhile; 409 for a step that other steps
        route to.
      responses:
        '200': { $ref: '#/components/responses/WorkflowStepDeletedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkflowStepsForbidden' }
        '404': { $ref: '#/components/responses/WorkflowStepNotFound' }
        '409': { $ref: '#/components/responses/WorkflowStepRemoveConflict' }
  /api/v1/workflow-templates/{id}/steps/{stepId}/move:
    parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/StepIdPath'
    post:
      tags: [Workflow Templates]
      summary: Move a step of a workflow template
      description: |
        Requires `workflow-template.update` and operator access to the
        project of every job step of the workflow (403 `Forbidden.`
        otherwise). Moves the step to another place in the run order, any
        distance in one call (see `WorkflowStepMoveInput`): to the start, to
        the end, right after another step, to a position, or one place up
        or down. The step keeps its ID and its branches. A move changes
        where empty branches lead, which step runs first and whose output
        the variable mapping of the step after it reads: `change` says what
        changed, and warns when runs now start with another step, reach a
        job step without passing the approval step they passed before, or
        when an approval step is not on the success path (see `warnings` of
        `WorkflowStepChange`). The steps of a
        workflow that has an approval step or a gated job step are for
        admins (403, as for an update), and the steps cannot change while a
        run of the workflow is active (409).

        A move to where the step stands, also up from the start or down
        from the end, answers 200 with `change.message` `Step "Deploy" stays
        at position 3.`, writes nothing and is not audited. Any other move is
        audited as `workflow-template.step.moved` with source `api`.

        The answers come in this order: 401 without a valid token; 403
        `Forbidden.` without `workflow-template.update`; 404 for an unknown
        workflow; 403 `Forbidden.` without operator access to the workflow;
        404 for a step the workflow does not have; 422 for a body that
        cannot be read; 404 for a workflow deleted meanwhile; 403
        `Forbidden.` for operator access lost meanwhile; 403 for a workflow
        whose steps are for admins; 409 for an active run; 404 for a step
        removed meanwhile; 422 for a place the step cannot take.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowStepMoveInput' }
            examples:
              afterStep:
                summary: Right after step 41
                value:
                  after_step_id: 41
              start:
                summary: To the start, so that runs start with it
                value:
                  position: start
              position:
                summary: To position 2
                value:
                  position: 2
              up:
                summary: One place up
                value:
                  direction: up
      responses:
        '200': { $ref: '#/components/responses/WorkflowStepWritten' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/WorkflowStepsForbidden' }
        '404': { $ref: '#/components/responses/WorkflowStepNotFound' }
        '409': { $ref: '#/components/responses/WorkflowStepsLocked' }
        '422':
          description: |
            The body cannot be read (see `WorkflowStepMoveInput`), or the
            step cannot take the place it names. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                moveNeedsOne:
                  summary: None, or more than one, of position, after_step_id and direction
                  value:
                    error:
                      message: 'Send exactly one of position, after_step_id and direction.'
                position:
                  summary: A position that is no whole number from 1
                  value:
                    error:
                      message: 'position must be "start", "end" or a whole number from 1.'
                afterStepId:
                  summary: An after_step_id that is no whole number from 1
                  value:
                    error:
                      message: 'after_step_id must be the ID of a step of this workflow.'
                direction:
                  summary: A direction other than up and down
                  value:
                    error:
                      message: 'direction must be "up" or "down".'
                afterStepMissing:
                  summary: after_step_id names a step that is not, or no longer, part of this workflow
                  value:
                    error:
                      message: 'The step to place it after (step ID 12) is not part of this workflow. Load the workflow again and choose another position.'
                afterItself:
                  summary: after_step_id names the step itself
                  value:
                    error:
                      message: 'A step cannot be placed after itself.'
                positionOutOfRange:
                  summary: A position after the end of a workflow with 3 steps
                  value:
                    error:
                      message: 'position must be "start", "end" or a number from 1 to 3.'
  /api/v1/workflow-templates/{id}/launch:
    post:
      tags: [Workflow Templates]
      summary: Launch a workflow from this template
      description: |
        Requires `workflow.launch` and operator access to the project of every
        job step. A refusal answers 403 and is audited as
        `workflow.launch.denied` (source `api`), with the job templates the
        caller may not operate. A caller who may see the workflow gets them in
        `error.job_template_ids`; a caller who may not see it gets `You may
        not launch this workflow.` without them. The run belongs to the
        caller: each job step runs as the caller and is checked again when it
        starts. A step the caller may no longer launch then fails without a
        job (see `steps[].error` of the run) and the workflow fails. The
        answer says what the run waits for right after the launch
        (`waiting_for`), and names the approval request of a first step that
        waits for an approval (`approval_request_id`); the caller, who
        launched the run, never decides on it.

        The optional `extra_vars` are the run's launch extra vars. They are
        stored on the run (`extra_vars` of `GET /api/v1/workflow-jobs/{id}`,
        password answers as `$encrypted$`) and reach every job step of it:
        over the job template's extra vars, and under the step's mapping of
        the previous step's output (`extra_vars_template`). A value whose
        key is a password field of the job template of any job step is a
        password answer, stored only encrypted and passed on encrypted to
        every job step's job. `null`, `""`, `[]` and `{}` mean none.

        Refused with 422, and no run is created: launch extra vars that are
        not a JSON object, that JSON cannot hold or that take more than
        65535 bytes, `$encrypted$` sent as a password answer, a template
        without steps, a template deleted meanwhile, and an approval that
        could never be granted: an approval step, or a job step whose job
        template has an approval rule, its own or its inventory's, whose
        rule leaves too few eligible approvers besides the caller or no
        longer exists; and a job step whose job template and inventory have
        different approval rules, as a launch waits for one rule only.

        A database error is no refusal: 500, with the error named by its
        class, SQLSTATE and driver error code only (it answered 422 with its
        message, or a bare server error, before).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowLaunchInput' }
            example:
              extra_vars: { env: prod, release: '2026.10' }
      responses:
        '201': { $ref: '#/components/responses/WorkflowLaunchResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          description: |
            Missing `workflow.launch`, or job steps whose job template the
            caller may not operate. Only a caller who may see the workflow
            gets these job templates in `error.job_template_ids`. Nothing was
            launched.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobTemplateRefError' }
              examples:
                visible:
                  summary: The caller may see the workflow
                  value:
                    error:
                      message: 'You may not launch job template(s) #15 of this workflow.'
                      job_template_ids: [15]
                hidden:
                  summary: The caller may not see the workflow
                  value:
                    error:
                      message: You may not launch this workflow.
        '422': { $ref: '#/components/responses/WorkflowLaunchRejected' }
        '500': { $ref: '#/components/responses/WorkflowLaunchFailed' }
  /api/v1/workflow-templates/{id}/trigger-token:
    parameters: [{ $ref: '#/components/parameters/IdPath' }]
    post:
      tags: [Workflow Templates, Triggers]
      summary: Generate or replace the workflow's trigger token
      description: |
        Requires `workflow-template.update` and operator access to the
        project of every job step (403 otherwise), as on the workflow's page.
        Generates a new trigger token and returns it; this response is the
        only place it ever appears, the server keeps only its SHA-256 hash. A
        token the workflow had before stops working at once.

        The trigger now runs as the caller (`trigger_user_id`), whoever
        generated the previous token: every call checks that this user is
        active, holds `workflow.launch` and may operate the project of every
        job step. Audited as `workflow-template.trigger-token.generated` with
        source `api`. Send the token in the `X-Trigger-Token` header of
        `POST /trigger/fire-workflow`. An unknown or deleted workflow
        template answers 404.
      responses:
        '201': { $ref: '#/components/responses/TriggerTokenCreatedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Workflow Templates, Triggers]
      summary: Revoke the workflow's trigger token
      description: |
        Requires `workflow-template.update` and operator access to the
        project of every job step (403 otherwise). The trigger stops working
        at once. Revoking a workflow without a token answers 200 as well and
        changes nothing; only an actual revocation is audited, as
        `workflow-template.trigger-token.revoked` with source `api`. An
        unknown or deleted workflow template answers 404.
      responses:
        '200': { $ref: '#/components/responses/TriggerTokenRevokedResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ────────────────────────── Workflow Jobs ──────────────────────────
  /api/v1/workflow-jobs:
    get:
      tags: [Workflow Jobs]
      summary: List workflow job executions
      description: |
        Requires `workflow.view`. Lists only the runs of workflow templates the
        caller may see (view access to the project of every job step),
        deleted templates included. Newest first, 25 per page, without the
        steps; each run says what it waits for (`waiting_for`) and the step
        it is at (`current_step`).

        The filters combine: `waiting_for` keeps the running runs that wait
        for that at their current step, `workflow_template_id` the runs of
        one workflow template, and `status` the runs with that stored
        status. A missing or empty filter does not filter. Any other value
        that a filter does not take answers 422, and nothing is listed.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/WaitingForFilter'
        - $ref: '#/components/parameters/WorkflowTemplateIdFilter'
        - $ref: '#/components/parameters/WorkflowJobStatusFilter'
      responses:
        '200':
          description: Paginated list
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowJobList' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422':
          description: A filter has a value it does not take; nothing was listed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                waitingFor:
                  summary: waiting_for is not approval, resume or runner
                  value:
                    error:
                      message: 'waiting_for must be one of: approval, resume, runner.'
                workflowTemplateId:
                  summary: workflow_template_id is no whole number from 1
                  value:
                    error:
                      message: 'workflow_template_id must be a positive integer.'
                status:
                  summary: status is not a status of runs
                  value:
                    error:
                      message: 'status must be one of: running, succeeded, failed, canceled.'
  /api/v1/workflow-jobs/{id}:
    get:
      tags: [Workflow Jobs]
      summary: Get a single workflow job execution
      description: |
        Requires `workflow.view` and view access to the project of every job
        step of the run's workflow (403 otherwise). `steps` lists the steps
        that ran; `steps[].error` says why a step failed without a job, for
        example because the user the workflow runs as may not launch the
        step's job template. Each execution keeps the name and type its step
        had when it ran, also after the step was removed from the workflow
        or replaced; its `workflow_step_id` is null then. `extra_vars` are
        the run's launch extra vars, password answers as `$encrypted$`.

        Each execution says what it waits for (`waiting_for`), the status of
        its job (`job_status`), and the approval request it waits or waited
        for (`approval`), when the caller may see that request. For the
        pending request of the step the run is at, `approval` also counts
        the approvers who may decide (`eligible_count`), those of them who
        have not voted (`open_count`), and says whether it can still be
        approved (`can_still_be_approved`).
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/WorkflowJobDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/workflow-jobs/{id}/cancel:
    post:
      tags: [Workflow Jobs]
      summary: Cancel a running workflow job
      description: |
        Requires `workflow.cancel` and operator access to the project of every
        job step of the run's workflow (403 otherwise). Fails the running
        steps with `Not finished: the run was canceled.` and cancels their
        jobs together with their pending approval requests, which get the
        status `canceled`. The run gets one `workflow.canceled` audit entry
        and one `workflow.canceled` notification. A step whose job cannot be
        canceled, for example on a database error, does not stop the
        cancel: the run is canceled all the same, no runner starts that
        job, its approval request takes no more votes, and the maintenance
        run cancels the job later. Access is checked before
        the run's state, so a caller without it gets 403 whatever the
        status; 422 `Workflow is already finished.` only tells a caller with
        access that the run is already finished, also when it finished while
        it was being canceled. A database error answers 500 with a message
        that says what it left (see the 500 response), where it answered a
        bare server error before.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/WorkflowJobResponse' }
        '500': { $ref: '#/components/responses/WorkflowRunOperationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403':
          description: |
            Missing `workflow.cancel` or operator access to the project of
            every job step, usually answered as `Forbidden.`.
            `error.job_template_ids`, when present, names the job templates
            the caller may not operate; it is never present for a caller who
            may not see the workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobTemplateRefError' }
              examples:
                forbidden:
                  summary: Missing workflow.cancel or operator access to the workflow
                  value:
                    error:
                      message: Forbidden.
                visible:
                  summary: Access lost meanwhile, to a caller who may see the workflow
                  value:
                    error:
                      message: 'You may not operate job template(s) #15 of this workflow.'
                      job_template_ids: [15]
                hidden:
                  summary: Access lost meanwhile, to a caller who may not see the workflow
                  value:
                    error:
                      message: You may not operate this workflow.
        '422':
          description: The run has already finished, also when it finished while it was being canceled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              example:
                error:
                  message: Workflow is already finished.
  /api/v1/workflow-jobs/{id}/resume:
    post:
      tags: [Workflow Jobs]
      summary: Resume a paused workflow step
      description: |
        Requires `workflow.launch` and operator access to the project of every
        job step of the run's workflow (403 otherwise). Advances the workflow
        past the currently paused step: the pause step is marked as succeeded
        and the engine proceeds to the next step. The following job steps
        still run as the user who launched the run. Access is checked before
        the run's state, so a caller without it gets 403 whatever the status;
        422 only tells a caller with access that the workflow is already
        finished or has no paused step. A database error answers 500 with a
        message that says what it left (see the 500 response), where it
        answered a bare server error before.
      parameters: [{ $ref: '#/components/parameters/IdPath' }]
      responses:
        '200': { $ref: '#/components/responses/WorkflowJobResponse' }
        '500': { $ref: '#/components/responses/WorkflowRunOperationFailed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: The run has already finished, or it waits at no pause step.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                finished:
                  summary: The run has finished
                  value:
                    error:
                      message: Workflow is already finished.
                notPaused:
                  summary: The run waits at no pause step
                  value:
                    error:
                      message: No paused step to resume.
        '403':
          description: |
            Missing `workflow.launch` or operator access to the project of
            every job step, usually answered as `Forbidden.`.
            `error.job_template_ids`, when present, names the job templates
            the caller may not operate; it is never present for a caller who
            may not see the workflow.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobTemplateRefError' }
              examples:
                forbidden:
                  summary: Missing workflow.launch or operator access to the workflow
                  value:
                    error:
                      message: Forbidden.
                visible:
                  summary: Access lost meanwhile, to a caller who may see the workflow
                  value:
                    error:
                      message: 'You may not operate job template(s) #15 of this workflow.'
                      job_template_ids: [15]
                hidden:
                  summary: Access lost meanwhile, to a caller who may not see the workflow
                  value:
                    error:
                      message: You may not operate this workflow.

