name: Release — Build & Push Container Images

# Multi-arch release pipeline (linux/amd64 + linux/arm64):
#
#   1. build — one job per image × architecture on NATIVE runners (no QEMU).
#      Each job pushes its single-arch image by digest only (untagged) and
#      hands the digest to the merge job via an artifact.
#   2. merge — per image: assembles the digests into one multi-arch manifest
#      list, tags it with the version (2.12.2) only, and verifies both
#      platforms are present in the pushed manifest.
#   3. smoke-test-arm64 — boots the prebuilt compose stack on an arm64
#      runner against the freshly pushed images of the version and waits
#      for the app, nginx, and runner containers to report healthy.
#      scan — at the same time, scans both platforms of each image of the
#      version with grype: a vulnerability of high or critical severity
#      that has a fix fails the release (.grype.yaml lists accepted ones).
#   4. promote — only once both passed: moves latest and the floating
#      version tags (2.12, 2) to the images of the version, each only when
#      the version is the highest release it covers.
#   5. github-release — creates the GitHub release of the tag
#      (github-release.yml): only now, so the latest release, whose compose
#      file bin/quickstart installs prebuilt installations with, never names
#      a version whose images are missing, failed the smoke test or the
#      scan, or are not latest yet.
#
# Every action is pinned to the commit of its release (the comment names
# it); Dependabot proposes updates (.github/dependabot.yml).

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  # anchore/grype v0.120.1, pinned to the digest of its image index.
  GRYPE_IMAGE: anchore/grype:v0.120.1@sha256:e4a44ef45d285b829ce6efe2642980329661bd2d18eab5fc539138d4adaebbbe

# Each job asks for what it needs; packages: write only where images are
# pushed or tagged.
permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target.slug }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - image: ansilume/ansilume
            slug: app
            dockerfile: docker/php/Dockerfile.prod
          - image: ansilume/ansilume-nginx
            slug: nginx
            dockerfile: docker/nginx/Dockerfile.prod
          - image: ansilume/ansilume-runner
            slug: runner
            dockerfile: docker/runner/Dockerfile
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.target.image }}

      # Push by digest only — tags are applied in the merge job once both
      # architectures exist. The GHA build cache is scoped per image and
      # architecture so the matrix jobs never overwrite each other's cache.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ matrix.target.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.target.slug }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.slug }}-${{ matrix.platform.arch }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${RUNNER_TEMP}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.target.slug }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest (${{ matrix.target.slug }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - image: ansilume/ansilume
            slug: app
          - image: ansilume/ansilume-nginx
            slug: nginx
          - image: ansilume/ansilume-runner
            slug: runner

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.target.slug }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version tag only. latest and the floating tags (2.12, 2) follow
      # in the promote job, once the images passed the smoke test and the
      # scan; latest=false keeps metadata-action from adding latest itself.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.target.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          mapfile -t tag_args < <(jq -r '.tags[] | "-t", .' <<< "${DOCKER_METADATA_OUTPUT_JSON}")
          refs=()
          for digest in *; do
            refs+=("${REGISTRY}/${{ matrix.target.image }}@sha256:${digest}")
          done
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"

      - name: Verify multi-arch manifest
        run: |
          ref="${{ env.REGISTRY }}/${{ matrix.target.image }}:${{ steps.meta.outputs.version }}"
          manifest=$(docker buildx imagetools inspect "${ref}")
          echo "${manifest}"
          for platform in "linux/amd64" "linux/arm64"; do
            if ! grep -q "${platform}" <<< "${manifest}"; then
              echo "::error::${ref} is missing ${platform}"
              exit 1
            fi
          done

  smoke-test-arm64:
    name: Smoke test (arm64, prebuilt compose)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    needs: merge
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ANSILUME_IMAGE_TAG: the images of this version, which latest does
      # not name before the promote job.
      - name: Create .env from production example
        run: |
          cp .env.prod.example .env
          sed -i \
            -e "s|COOKIE_VALIDATION_KEY=CHANGE-ME|COOKIE_VALIDATION_KEY=$(openssl rand -hex 32)|" \
            -e "s|APP_SECRET_KEY=CHANGE-ME|APP_SECRET_KEY=$(openssl rand -hex 32)|" \
            -e "s|RUNNER_BOOTSTRAP_SECRET=CHANGE-ME|RUNNER_BOOTSTRAP_SECRET=$(openssl rand -hex 24)|" \
            -e "s|DB_ROOT_PASSWORD=CHANGE-ME|DB_ROOT_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|DB_PASSWORD=CHANGE-ME|DB_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|REDIS_PASSWORD=CHANGE-ME|REDIS_PASSWORD=$(openssl rand -hex 32)|" \
            .env
          echo "ANSILUME_IMAGE_TAG=${GITHUB_REF_NAME#v}" >> .env

      - name: Pull released images
        run: docker compose -f docker-compose.prebuilt.yml pull app nginx runner-1

      - name: Verify pulled images are arm64
        run: |
          for image in ansilume ansilume-nginx ansilume-runner; do
            ref="${REGISTRY}/ansilume/${image}:${GITHUB_REF_NAME#v}"
            arch=$(docker image inspect "${ref}" --format '{{.Architecture}}')
            echo "${image}: ${arch}"
            if [ "${arch}" != "arm64" ]; then
              echo "::error::${ref} resolved to ${arch} on an arm64 host"
              exit 1
            fi
          done

      - name: Start prebuilt stack
        run: docker compose -f docker-compose.prebuilt.yml up -d

      # A fresh database has no users, and runner self-registration is
      # rejected with 503 until the first user exists. `up -d` has already
      # waited for app to become healthy (runner-1 depends on nginx, nginx
      # on app), so exec works immediately. As www-data, as the documentation
      # and the quickstart create the first admin: the release proves that
      # command on its images.
      - name: Create admin user (required for runner registration)
        run: |
          docker compose -f docker-compose.prebuilt.yml exec -T -u www-data app \
            php yii setup/admin smoke-admin smoke-admin@example.com "$(openssl rand -hex 16)"

      # runner-1 restart-loops until its first successful registration
      # (each attempt before the admin user existed exits non-zero), so
      # transient exited/restarting states are expected — poll until
      # healthy instead of failing fast on container state.
      - name: Wait for services to become healthy
        run: |
          for service in app nginx runner-1; do
            container="ansilume_${service//-/_}"
            echo "Waiting for ${container}..."
            STATUS=none
            for i in $(seq 1 60); do
              STATUS=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "${container}" 2>/dev/null || echo "unknown")
              if [ "${STATUS}" = "healthy" ]; then
                echo "${container} healthy after $((i * 5))s"
                break
              fi
              sleep 5
            done
            if [ "${STATUS}" != "healthy" ]; then
              echo "::error::Timeout waiting for ${container} (status: ${STATUS})"
              docker compose -f docker-compose.prebuilt.yml logs "${service}"
              exit 1
            fi
          done

      # curl's status is kept after ||: these steps run with bash -e, which
      # would end them at the assignment when nginx does not answer, before
      # they say so. A body cut off (curl exit 18) fails them too.
      - name: Check /health through nginx
        run: |
          curl_status=0
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' http://localhost:8080/health) || curl_status=$?
          cat /tmp/health.json || true
          echo
          if [ "${curl_status}" -ne 0 ] || [ "${code}" != "200" ]; then
            echo "::error::/health returned HTTP ${code} (curl exit ${curl_status})"
            exit 1
          fi

      # nginx serves the API spec as a static file baked into its image.
      - name: Check /openapi.yaml through nginx
        run: |
          curl_status=0
          code=$(curl -sS -o /tmp/openapi.yaml -w '%{http_code}' http://localhost:8080/openapi.yaml) || curl_status=$?
          if [ "${curl_status}" -ne 0 ] || [ "${code}" != "200" ] || ! head -n 1 /tmp/openapi.yaml | grep -q '^openapi: '; then
            echo "::error::/openapi.yaml returned HTTP ${code} without the spec (curl exit ${curl_status})"
            head -n 5 /tmp/openapi.yaml || true
            exit 1
          fi

      # Playbooks run on runners, so a bundled runner must reach nothing but
      # nginx, and Redis must refuse unauthenticated clients. /health above
      # being 200 proves the app itself authenticates to Redis.
      - name: Verify runner isolation and Redis authentication
        run: |
          compose="docker compose -f docker-compose.prebuilt.yml"
          backends="app redis queue-worker schedule-runner"
          if ${compose} ps --services --status running | grep -qx db; then
            backends="${backends} db"
          fi
          # Trailing dot: absolute names, so a DNS search domain cannot interfere.
          for svc in ${backends}; do
            if ${compose} exec -T runner-1 getent hosts "${svc}." >/dev/null 2>&1; then
              echo "::error::runner-1 can resolve ${svc}; runners must only join the runners network"
              exit 1
            fi
          done
          if ! ${compose} exec -T runner-1 getent hosts nginx. >/dev/null 2>&1; then
            echo "::error::runner-1 cannot resolve nginx"
            exit 1
          fi
          reply=$(${compose} exec -T redis redis-cli ping 2>&1 || true)
          echo "unauthenticated PING: ${reply}"
          case "${reply}" in
            *NOAUTH*) ;;
            *) echo "::error::Redis answered an unauthenticated PING"; exit 1 ;;
          esac

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.prebuilt.yml logs

  # Fails the release on a vulnerability of high or critical severity that
  # has a fix, in either platform of an image: its version tag stays, but
  # latest, the floating tags and the GitHub release do not move to it.
  # grype reads .grype.yaml, the accepted findings with their reasons, from
  # the checkout when there is one.
  scan:
    name: Scan ${{ matrix.target.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: merge
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        target:
          - image: ansilume/ansilume
            slug: app
          - image: ansilume/ansilume-nginx
            slug: nginx
          - image: ansilume/ansilume-runner
            slug: runner

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan both platforms
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.target.image }}
        run: |
          failed=0
          for platform in linux/amd64 linux/arm64; do
            echo "Scanning ${IMAGE}:${GITHUB_REF_NAME#v} (${platform})"
            if ! docker run --rm -v "${PWD}:/src:ro" -w /src "${GRYPE_IMAGE}" \
              "registry:${IMAGE}:${GITHUB_REF_NAME#v}" --platform "${platform}" --only-fixed --fail-on high; then
              echo "::error::The scan of ${IMAGE}:${GITHUB_REF_NAME#v} (${platform}) failed: a vulnerability of high or critical severity that has a fix, or grype could not scan the image (see its output above)"
              failed=1
            fi
          done
          exit "${failed}"

  # Moves latest and the floating version tags (2.12, 2) to the images of
  # the version, now that they passed the smoke test and the scan, and each
  # only when the version is the highest release it covers: a release of an
  # older line, or a re-run of an older release, leaves them where they are.
  promote:
    name: Promote ${{ matrix.target.slug }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [smoke-test-arm64, scan]
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        target:
          - image: ansilume/ansilume
            slug: app
          - image: ansilume/ansilume-nginx
            slug: nginx
          - image: ansilume/ansilume-runner
            slug: runner

    defaults:
      run:
        shell: bash

    steps:
      # All history, for the version tags.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move latest and the floating tags
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ env.REGISTRY }}/${{ matrix.target.image }}
        run: |
          version="${TAG#v}"
          # The highest release (vX.Y.Z, no release candidate) whose tag
          # matches the pattern $1.
          highest() {
            git tag --list "$1" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true
          }
          tags=()
          if [ "$(highest 'v*')" = "${TAG}" ]; then
            tags+=(latest)
          fi
          if [ "$(highest "v${version%%.*}.*")" = "${TAG}" ]; then
            tags+=("${version%%.*}")
          fi
          if [ "$(highest "v${version%.*}.*")" = "${TAG}" ]; then
            tags+=("${version%.*}")
          fi
          if [ ${#tags[@]} -eq 0 ]; then
            echo "${TAG} is not the highest release of its line: latest and the floating tags stay where they are."
            exit 0
          fi
          args=()
          for tag in "${tags[@]}"; do
            args+=(-t "${IMAGE}:${tag}")
          done
          docker buildx imagetools create "${args[@]}" "${IMAGE}:${version}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{.Manifest.Digest}}')
          for tag in "${tags[@]}"; do
            moved=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}}')
            if [ "${moved}" != "${digest}" ]; then
              echo "::error::${IMAGE}:${tag} names ${moved}, not ${digest}, the images of ${IMAGE}:${version}"
              exit 1
            fi
            echo "${IMAGE}:${tag} -> ${digest}"
          done

  # The only job that writes to the repository: it creates the release and
  # attests its source archive. A release candidate (v2.13.0-rc1) gets none:
  # the job is skipped, not failed, so its run ends green.
  github-release:
    name: GitHub release
    needs: promote
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/github-release.yml
