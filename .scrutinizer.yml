# The complete Scrutinizer config. The repository settings on
# scrutinizer-ci.com stay empty: Scrutinizer merges them first and this file
# wins on conflicts, but a list here replaces the list there, which once
# dropped the JavaScript analysis without anyone noticing.
#
# Scrutinizer only analyses the code: PHP and JavaScript analysis in the
# analysis node, PSR-12 in the tests node. It never runs PHPUnit and never
# starts services; every test suite runs in GitHub Actions against the docker
# compose stack. Its database and Redis services often accepted connections
# without ever answering, so tests here failed for reasons unrelated to the
# code. Read docs/ci.md before changing this file;
# tests/unit/config/ScrutinizerConfigTest.php enforces these rules.
build:
  environment:
    php:
      version: "8.2"
  dependencies:
    override:
      - composer self-update --2
      - composer install --no-interaction --prefer-dist
  nodes:
    # Static analysis only. Defining this node replaces Scrutinizer's default
    # analysis commands, which include phpcs-run: finding no phpcs of its
    # own, phpcs-run installs phpcs 3.7.1, which Composer refuses because of a
    # security advisory (GHSA-hmqg-cxww-wqhq), so every build failed with
    # exit code 127. PSR-12 runs in the tests node with the phpcs from
    # require-dev instead.
    analysis:
      project_setup:
        override:
          - 'true'
      tests:
        override:
          - php-scrutinizer-run
          - js-scrutinizer-run
    # Named "tests" on purpose: Scrutinizer's default config enables a
    # "tests" node with auto-detected commands, which would run PHPUnit
    # without a database. A node of the same name here replaces it. It runs
    # PSR-12 with the project's own phpcs, same scope as bin/tests-style.sh,
    # and nothing else.
    tests:
      tests:
        override:
          - vendor/bin/phpcs --standard=PSR12 --extensions=php --warning-severity=0 --ignore=vendor,.composer,runtime,@runtime,web/assets,docker,migrations,tests -q .

checks:
  php:
    code_rating: true
    duplication: true
    # PSR-12 is authoritative for code style — suppress conflicting fixes:
    # - PSR-12 requires space after 'function' in closures: function ($x)
    # - PSR-12 requires spaces around bitwise OR: CONST_A | CONST_B
    spacing_of_function_arguments: false
    spacing_around_non_conditional_operators: false
  javascript: true

# Style of the fixes Scrutinizer suggests, matching PSR-12 and CLAUDE.md:
# no space after a cast, spaces around the concatenation operator.
coding_style:
  php:
    spaces:
      around_operators:
        bitwise: false
        concatenation: true
      other:
        after_type_cast: false

tools:
  # No php_code_sniffer here, see build.nodes.analysis.
  php_mess_detector: true
  php_cpd: true

filter:
  excluded_paths:
    - vendor/*
    - tests/*
    - bin/*
    - runtime/*
    - web/assets/*
    # Minified third-party bundles (bootstrap, chart.js, ansi_up, cronstrue).
    - '*.min.js'
    # Vendored third-party JS (CodeMirror, js-yaml, …) — not ours to review,
    # and their size/complexity skews the metrics for our own code.
    - web/js/vendor/*
    - docker/*
    - migrations/*
