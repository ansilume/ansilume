# {{ ansible_managed }}

# Access log without tokens from URLs.
#
# map and log_format belong to the http context: nginx includes this file
# inside http {}, and both are rejected inside server {}. The maps mask,
# case-insensitively, in the request URI and in the referrer:
#   - the path of /trigger/<token> (every path under /trigger/ except
#     /trigger/fire and /trigger/fire-workflow);
#   - everything from the first token= query parameter on, which covers
#     trigger calls with ?token= and password-reset links.
# The field order is that of nginx's predefined "combined" format. The error
# log cannot be masked: only the X-Trigger-Token header keeps a trigger token
# out of it, and out of proxies in front of nginx.
# Keep this block identical in docker/nginx/default.conf
# (tests/unit/docker/NginxLogMaskingTest.php checks both).
map $request_uri $ansilume_uri_path_masked {
    '~*^(?<ansilume_up>[^?]*?/trigger/)(?!(?:fire|fire-workflow)/?(?:[?]|$))[^?]+(?<ansilume_uq>(?:[?].*)?)$' '${ansilume_up}[REDACTED]${ansilume_uq}';
    default $request_uri;
}
map $ansilume_uri_path_masked $ansilume_log_uri {
    '~*^(?<ansilume_uqp>[^?]*[?](?:[^&]*&)*?)token=.*$' '${ansilume_uqp}token=[REDACTED]';
    default $ansilume_uri_path_masked;
}
map $http_referer $ansilume_referer_path_masked {
    '~*^(?<ansilume_rp>[^?]*?/trigger/)(?!(?:fire|fire-workflow)/?(?:[?]|$))[^?]+(?<ansilume_rq>(?:[?].*)?)$' '${ansilume_rp}[REDACTED]${ansilume_rq}';
    default $http_referer;
}
map $ansilume_referer_path_masked $ansilume_log_referer {
    '' '-';
    '~*^(?<ansilume_rqp>[^?]*[?](?:[^&]*&)*?)token=.*$' '${ansilume_rqp}token=[REDACTED]';
    default $ansilume_referer_path_masked;
}
log_format ansilume_masked '$remote_addr - $remote_user [$time_local] "$request_method $ansilume_log_uri $server_protocol" $status $body_bytes_sent "$ansilume_log_referer" "$http_user_agent"';

server {
    listen 80;
    server_name {{ ansilume_nginx_server_name }};
    root /var/www/web;
    index index.php;

    charset utf-8;
    client_max_body_size {{ ansilume_nginx_client_max_body_size }};

    # Hide nginx version in Server header and error pages
    server_tokens off;

    access_log /var/log/nginx/access.log ansilume_masked;
    error_log  /var/log/nginx/error.log;

    # Publicly serve the OpenAPI spec with CORS enabled, like
    # docker/nginx/default.conf. nginx does not inherit server-level
    # add_header into locations that set their own headers, so the security
    # headers are repeated here.
    location = /openapi.yaml {
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff"    always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cache-Control "no-cache" always;
        default_type application/yaml;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        # httpoxy: never pass a client "Proxy:" header on as HTTP_PROXY.
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout {{ ansilume_nginx_fastcgi_timeout }};
    }

    location ~ /\.(ht|git) {
        deny all;
    }
}
