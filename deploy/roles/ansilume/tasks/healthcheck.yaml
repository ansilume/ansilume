---
- name: Wait for nginx to become healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ ansilume_nginx_port }}/health"
    return_content: true
    status_code: [200, 503]
  register: ansilume_health
  until: ansilume_health.status == 200
  retries: 30
  delay: 10

- name: Report health status
  ansible.builtin.debug:
    msg: >-
      Ansilume is {{ ansilume_health.json.status }} —
      runners: {{ ansilume_health.json.runners.online }}/{{ ansilume_health.json.runners.total }} online,
      queue: {{ ansilume_health.json.queue.pending }} pending / {{ ansilume_health.json.queue.running }} running
